name: M3Top3 Finance Page100 G10 Read-Only Forensic S3 AUDIT v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_FORENSIC_S3_AUDIT_ACTIVATION_v1.0.json

permissions:
  contents: read
  issues: read
  actions: read
  id-token: write

concurrency:
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

env:
  AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_FORENSIC_S3_AUTHORITY_v1.0.json
  MANIFEST_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_FORENSIC_S3_MANIFEST_v1.0.json
  POLICY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_FORENSIC_S3_AUDIT_SESSION_POLICY_v1.0.json
  ACTIVATION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_FORENSIC_S3_AUDIT_ACTIVATION_v1.0.json
  RUNNER_PATH: tools/m3top3/finance_page100_g10_forensic_s3.py
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  AWS_MAX_ATTEMPTS: "1"
  AWS_RETRY_MODE: standard
  AWS_PAGER: ""

jobs:
  audit:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      github.event.forced == false &&
      github.event.head_commit.message == 'Arm G10 read-only forensic S3 AUDIT 20260830074857 v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: m3top3-source-admission
    steps:
      - name: Checkout exact AUDIT activation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail-closed S3 activation Owner-comment and PRECHECK proof preflight
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_PATH" preflight \
            --mode AUDIT \
            --authority "$AUTHORITY_PATH" \
            --activation "$ACTIVATION_PATH" \
            --manifest "$MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --verify-owner-comment \
            --verify-precheck

      - name: Download exact PRECHECK artifact archive before AWS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          artifact_id="$(jq -er '.precheck_evidence.artifact_id | select(type == "number" and . > 0)' "$ACTIVATION_PATH")"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > precheck-artifact.zip
          test -s precheck-artifact.zip

      - name: Verify exact PRECHECK archive and durable PASS binding
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_PATH" verify-precheck-archive \
            --authority "$AUTHORITY_PATH" \
            --activation "$ACTIVATION_PATH" \
            --manifest "$MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --precheck-archive precheck-artifact.zip

      - name: Verify remote branch PRECHECK lineage and single-run custody before AWS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_PATH" remote-gate \
            --mode AUDIT \
            --activation "$ACTIVATION_PATH" \
            --phase before-aws

      - name: Configure exact-version read-only AWS OIDC audit session
        id: configure-audit-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: g10-readonly-forensic-s3-audit-${{ github.run_id }}
          role-duration-seconds: 3600
          retry-max-attempts: 1
          disable-retry: true
          output-env-credentials: false
          output-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: >-
            {"Statement":[{"Action":"s3:ListBucketVersions","Condition":{"StringEquals":{"s3:prefix":["raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_generation/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/","raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/","raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-08-30/execution-claim.json"]}},"Effect":"Allow","Resource":"arn:aws:s3:::semi-data-plane-aofspds-20260815"},{"Action":"s3:GetObjectVersion","Effect":"Allow","Resource":["arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_generation/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/*","arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/checkpoint.json","arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-08-30/execution-claim.json"]}],"Version":"2012-10-17"}

      - name: Read exact existing versions and reproduce hash-only conflicts
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          AWS_ACCESS_KEY_ID: ${{ steps.configure-audit-aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.configure-audit-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.configure-audit-aws.outputs.aws-session-token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p forensic-audit-artifact
          python "$RUNNER_PATH" audit \
            --authority "$AUTHORITY_PATH" \
            --activation "$ACTIVATION_PATH" \
            --manifest "$MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --output-dir forensic-audit-artifact \
            --precheck-archive precheck-artifact.zip
          rm -f precheck-artifact.zip

      - name: Verify remote branch PRECHECK lineage and single-run custody before audit artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_PATH" remote-gate \
            --mode AUDIT \
            --activation "$ACTIVATION_PATH" \
            --phase before-artifact

      - name: Upload sanitized S3 read-only forensic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3top3-g10-readonly-forensic-s3-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: forensic-audit-artifact
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
