jobs:
  focused-precheck:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      github.event.forced == false &&
      github.event.head_commit.message == 'Arm M3Top3 Finance Page100 G11C9 focused PRECHECK 20260901200940 v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m3top3-source-admission
    steps:
      - name: Checkout exact fresh G11C9 PRECHECK activation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 33
          fetch-tags: false
          persist-credentials: false

      - name: Fail closed on activation lineage or C8 pre-LIVE invalidation drift
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$EVENT_REPOSITORY" = 'AofSpds/asset-agent-asa'
          test "$EVENT_ACTOR" = 'AofSpds'
          test "$EVENT_TRIGGERING_ACTOR" = 'AofSpds'
          test "$EVENT_REF" = 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828'
          test "$EVENT_RUN_ATTEMPT" = '1'
          test "$(TZ=Asia/Seoul date +%F)" = '2026-09-01'
          test "$(git rev-parse HEAD)" = "$EVENT_AFTER"
          test "$(git rev-parse HEAD^)" = "$EVENT_BEFORE"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B HEAD)" = "$EXPECTED_MESSAGE"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$ACTIVATION_PATH")"

          for ref in HEAD HEAD^ HEAD^^
          do
            git cat-file -e "${ref}^{commit}"
            dynamic_tree="$(git rev-parse "${ref}^{tree}")"
            git cat-file -e "${dynamic_tree}^{tree}"
            test "$(git rev-parse "${ref}^{tree}")" = "$dynamic_tree"
          done
          test "$(git rev-parse HEAD^^)" = "$C8_TERMINAL_CHECKPOINT_COMMIT"
          test "$(git rev-parse 'HEAD^^^{tree}')" = "$C8_TERMINAL_CHECKPOINT_TREE"

          preparation_commit="$(git rev-parse HEAD^)"
          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          test "$(git log -1 --pretty=%B "$preparation_commit")" = "$EXPECTED_PREPARATION_MESSAGE"
          test "$(git rev-parse "${preparation_commit}^")" = "$EXPECTED_PREPARATION_PARENT_COMMIT"
          test "$(git rev-parse "${preparation_commit}^^{tree}")" = "$EXPECTED_PREPARATION_PARENT_TREE"
          test "$(git rev-parse "${EXPECTED_PREPARATION_PARENT_COMMIT}^{tree}")" = "$EXPECTED_PREPARATION_PARENT_TREE"

          while IFS='|' read -r role commit tree
          do
            test -n "$role"
            git cat-file -e "${commit}^{commit}"
            git cat-file -e "${tree}^{tree}"
            test "$(git rev-parse "${commit}^{tree}")" = "$tree"
          done <<EOF
          G11C1_PREPARATION|$INELIGIBLE_G11C1_PREPARATION_COMMIT|$INELIGIBLE_G11C1_PREPARATION_TREE
          G11C2_PREPARATION|$INVALIDATED_G11C2_PREPARATION_COMMIT|$INVALIDATED_G11C2_PREPARATION_TREE
          G11C2_PRECHECK_ACTIVATION|$INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT|$INVALIDATED_G11C2_PRECHECK_ACTIVATION_TREE
          G11C2_PRECHECK_RECEIPT_APPEND|$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT|$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_TREE
          G11C2_TERMINAL_CHECKPOINT|$INVALIDATED_G11C2_TERMINAL_CHECKPOINT_COMMIT|$INVALIDATED_G11C2_TERMINAL_CHECKPOINT_TREE
          G11C6_TERMINAL_RECEIPT_APPEND|$G11C6_TERMINAL_RECEIPT_APPEND_COMMIT|$G11C6_TERMINAL_RECEIPT_APPEND_TREE
          G11C7_PREPARATION|$C7_PREPARATION_COMMIT|$C7_PREPARATION_TREE
          G11C7_PRECHECK_ACTIVATION|$C7_PRECHECK_ACTIVATION_COMMIT|$C7_PRECHECK_ACTIVATION_TREE
          G11C7_PRECHECK_RECEIPT_APPEND|$C7_PRECHECK_RECEIPT_APPEND_COMMIT|$C7_PRECHECK_RECEIPT_APPEND_TREE
          G11C7_LIVE_ACTIVATION|$C7_LIVE_ACTIVATION_COMMIT|$C7_LIVE_ACTIVATION_TREE
          G11C7_TERMINAL_RECEIPT_APPEND|$C7_TERMINAL_RECEIPT_APPEND_COMMIT|$C7_TERMINAL_RECEIPT_APPEND_TREE
          G11C8_PREPARATION|$C8_PREPARATION_COMMIT|$C8_PREPARATION_TREE
          G11C8_PRECHECK_ACTIVATION|$C8_PRECHECK_ACTIVATION_COMMIT|$C8_PRECHECK_ACTIVATION_TREE
          G11C8_PRECHECK_RECEIPT_APPEND|$C8_PRECHECK_RECEIPT_APPEND_COMMIT|$C8_PRECHECK_RECEIPT_APPEND_TREE
          G11C8_TERMINAL_INVALIDATION_APPEND|$C8_TERMINAL_CHECKPOINT_COMMIT|$C8_TERMINAL_CHECKPOINT_TREE
          EOF

          while IFS='|' read -r role commit tree
          do
            test -n "$role"
            git merge-base --is-ancestor "$commit" "$EXPECTED_PREPARATION_PARENT_COMMIT"
          done <<EOF
          G11C1_PREPARATION|$INELIGIBLE_G11C1_PREPARATION_COMMIT|$INELIGIBLE_G11C1_PREPARATION_TREE
          G11C2_PREPARATION|$INVALIDATED_G11C2_PREPARATION_COMMIT|$INVALIDATED_G11C2_PREPARATION_TREE
          G11C2_PRECHECK_ACTIVATION|$INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT|$INVALIDATED_G11C2_PRECHECK_ACTIVATION_TREE
          G11C2_PRECHECK_RECEIPT_APPEND|$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT|$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_TREE
          G11C2_TERMINAL_CHECKPOINT|$INVALIDATED_G11C2_TERMINAL_CHECKPOINT_COMMIT|$INVALIDATED_G11C2_TERMINAL_CHECKPOINT_TREE
          G11C6_TERMINAL_RECEIPT_APPEND|$G11C6_TERMINAL_RECEIPT_APPEND_COMMIT|$G11C6_TERMINAL_RECEIPT_APPEND_TREE
          G11C7_PREPARATION|$C7_PREPARATION_COMMIT|$C7_PREPARATION_TREE
          G11C7_PRECHECK_ACTIVATION|$C7_PRECHECK_ACTIVATION_COMMIT|$C7_PRECHECK_ACTIVATION_TREE
          G11C7_PRECHECK_RECEIPT_APPEND|$C7_PRECHECK_RECEIPT_APPEND_COMMIT|$C7_PRECHECK_RECEIPT_APPEND_TREE
          G11C7_LIVE_ACTIVATION|$C7_LIVE_ACTIVATION_COMMIT|$C7_LIVE_ACTIVATION_TREE
          G11C7_TERMINAL_RECEIPT_APPEND|$C7_TERMINAL_RECEIPT_APPEND_COMMIT|$C7_TERMINAL_RECEIPT_APPEND_TREE
          G11C8_PREPARATION|$C8_PREPARATION_COMMIT|$C8_PREPARATION_TREE
          G11C8_PRECHECK_ACTIVATION|$C8_PRECHECK_ACTIVATION_COMMIT|$C8_PRECHECK_ACTIVATION_TREE
          G11C8_PRECHECK_RECEIPT_APPEND|$C8_PRECHECK_RECEIPT_APPEND_COMMIT|$C8_PRECHECK_RECEIPT_APPEND_TREE
          G11C8_TERMINAL_INVALIDATION_APPEND|$C8_TERMINAL_CHECKPOINT_COMMIT|$C8_TERMINAL_CHECKPOINT_TREE
          EOF

          test -f "$C6_TERMINAL_RECEIPT_PATH"
          test "$(git hash-object -- "$C6_TERMINAL_RECEIPT_PATH")" = "$C6_TERMINAL_RECEIPT_BLOB"
          test "$(sha256sum -- "$C6_TERMINAL_RECEIPT_PATH" | cut -d' ' -f1)" = "$C6_TERMINAL_RECEIPT_SHA256"
          test "$(wc -c < "$C6_TERMINAL_RECEIPT_PATH" | tr -d ' ')" = "$C6_TERMINAL_RECEIPT_BYTES"
          test "$(jq -r '.receipt_integrity.payload_sha256 // empty' "$C6_TERMINAL_RECEIPT_PATH")" = "$C6_TERMINAL_RECEIPT_PAYLOAD_SHA256"
          jq -e \
            --arg run "$C6_TERMINAL_RUN_ID" \
            --arg job "$C6_TERMINAL_JOB_ID" \
            --arg head "$C6_TERMINAL_EXECUTION_HEAD" \
            --arg tree "$C6_TERMINAL_EXECUTION_TREE" '
            .result == "FAIL_CLOSED" and
            .terminal_state == "TERMINAL_FAIL_CLOSED_G11C6_PRECHECK_PRE_OIDC_PREPARATION_COMMIT_MESSAGE_CASE_MISMATCH_EXPECTED_page100_ACTUAL_Page100_ZERO_EXTERNAL_EFFECT_NO_RERUN_LIVE_CLOSED" and
            (.github_run_id | tostring) == $run and
            (.github_job_id | tostring) == $job and
            .github_run_attempt == 1 and
            .execution_binding.head_sha == $head and
            .execution_binding.tree_sha == $tree and
            .execution_binding.workflow_conclusion == "failure" and
            .runner_result.verdict == "NOT_RUN" and
            .runner_result.entry_gate == "FAIL_CLOSED_PRE_OIDC_PREPARATION_COMMIT_MESSAGE_CASE_MISMATCH" and
            .runner_result.live_adapter_gate == "NOT_OBSERVED_RUNNER_SKIPPED" and
            .observed_effects.aws_calls == 0 and
            .observed_effects.sts_calls == 0 and
            .observed_effects.sts_assume_role_attempts == 0 and
            .observed_effects.sts_sessions_assumed == 0 and
            .observed_effects.sts_get_caller_identity_calls == 0 and
            .observed_effects.credentials_issued == 0 and
            .observed_effects.s3_calls == 0 and
            .observed_effects.finance_provider_api_calls == 0 and
            .observed_effects.provider_quota_reservations == 0 and
            .observed_effects.remote_custody_mutations == 0 and
            .observed_effects.effects_reconciled == true and
            .observed_effects.ambiguous_side_effects == false and
            .no_rerun.consumed_github_runs == [33272691259,33273146915,33401871715,33403101817,33414615913,33414695818,33465583987,33466306591,33469887723,33472741288,33473465774,33477019917,33479444941,33484842311] and
            .no_rerun.current_run_retry_authorized == false and
            .no_rerun.same_activation_reuse_authorized == false and
            .no_rerun.same_generation_reuse_authorized == false and
            .terminal.live_authorized == false and
            .terminal.precheck_technical_result == "NOT_RUN" and
            .terminal.rerun_authorized == false
          ' "$C6_TERMINAL_RECEIPT_PATH" >/dev/null

          test "$EXPECTED_PREPARATION_PARENT_COMMIT" = "$C8_TERMINAL_CHECKPOINT_COMMIT"
          test "$EXPECTED_PREPARATION_PARENT_TREE" = "$C8_TERMINAL_CHECKPOINT_TREE"
          test "$(git show -s --format=%P "$C7_TERMINAL_RECEIPT_APPEND_COMMIT")" = "$C7_LIVE_ACTIVATION_COMMIT"
          test "$(git diff-tree --no-commit-id --name-status -r "$C7_TERMINAL_RECEIPT_APPEND_COMMIT")" = "$(printf 'A\t%s' "$C7_TERMINAL_RECEIPT_PATH")"
          test "$(git ls-tree "$C7_TERMINAL_RECEIPT_APPEND_COMMIT" -- "$C7_TERMINAL_RECEIPT_PATH" | awk '{print $3}')" = "$C7_TERMINAL_RECEIPT_BLOB"
          test -f "$C7_TERMINAL_RECEIPT_PATH"
          test "$(git hash-object -- "$C7_TERMINAL_RECEIPT_PATH")" = "$C7_TERMINAL_RECEIPT_BLOB"
          test "$(sha256sum -- "$C7_TERMINAL_RECEIPT_PATH" | cut -d' ' -f1)" = "$C7_TERMINAL_RECEIPT_SHA256"
          test "$(wc -c < "$C7_TERMINAL_RECEIPT_PATH" | tr -d ' ')" = "$C7_TERMINAL_RECEIPT_BYTES"
          test "$(jq -r '.receipt_integrity.payload_sha256 // empty' "$C7_TERMINAL_RECEIPT_PATH")" = "$C7_TERMINAL_RECEIPT_PAYLOAD_SHA256"
          jq -e '
            .result == "FAIL_CLOSED" and
