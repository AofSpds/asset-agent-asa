      - name: Validate exact three-policy partition and focused tests before OIDC
        id: policies
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C PYTHONDONTWRITEBYTECODE=1

          validate_policy() {
            path="$1"
            expected_statements="$2"
            jq -e --argjson count "$expected_statements" '
              (has("Version") | not) and
              (.Statement | type == "array" and length == $count) and
              ((tostring | contains("${")) | not) and
              ([.Statement[].Resource] | flatten | all(. != "*"))
            ' "$path" >/dev/null
            compact="$(jq -c . "$path")"
            test -n "$compact"
            test "$(printf '%s' "$compact" | tr -d '\040-\176' | wc -c | tr -d ' ')" = '0'
            test "$(printf '%s' "$compact" | wc -c | tr -d ' ')" -le 2048
            test "$(printf '%s' "$compact" | jq -c .)" = "$compact"
          }
          validate_policy "$CHECKPOINT_POLICY_PATH" 1
          validate_policy "$RAW_POLICY_PATH" 1
          validate_policy "$FINAL_POLICY_PATH" 2

          observed_union="$(jq -S -c -s \
            '{Statement:[.[2].Statement[0],.[1].Statement[0],.[0].Statement[0],.[2].Statement[1]]}' \
            "$CHECKPOINT_POLICY_PATH" "$RAW_POLICY_PATH" "$FINAL_POLICY_PATH")"
          expected_union="$(jq -S -c -s '
            {Statement:[.[2].Statement[0],.[1].Statement[0],.[0].Statement[0],.[2].Statement[1]]} |
            walk(if type == "string"
                 then gsub("G11C7-20260901171500"; "G11C9-20260901200940")
                 else . end)
            ' "$C7_CHECKPOINT_POLICY_PATH" "$C7_RAW_POLICY_PATH" "$C7_FINAL_POLICY_PATH")"
          test "$observed_union" = "$expected_union"

          python "$TEST_PATH"
          python "$ADAPTER_TEST_PATH"

          checkpoint_json="$(jq -c . "$CHECKPOINT_POLICY_PATH")"
          raw_json="$(jq -c . "$RAW_POLICY_PATH")"
          final_json="$(jq -c . "$FINAL_POLICY_PATH")"
          printf 'checkpoint_json=%s\n' "$checkpoint_json" >> "$GITHUB_OUTPUT"
          printf 'raw_json=%s\n' "$raw_json" >> "$GITHUB_OUTPUT"
          printf 'final_json=%s\n' "$final_json" >> "$GITHUB_OUTPUT"
          printf 'STATIC_GATES_TESTS_AND_EXACT_POLICY_UNION_PASS\n'

      - name: Probe packed policy 1 of 3 checkpoint read exactly once
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c9-probe-checkpoint-${{ github.run_id }}
          role-duration-seconds: 900
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: false
          output-credentials: false
          unset-current-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.policies.outputs.checkpoint_json }}

      - name: Probe packed policy 2 of 3 raw four read exactly once
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c9-probe-raw-four-${{ github.run_id }}
          role-duration-seconds: 900
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: false
          output-credentials: false
          unset-current-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.policies.outputs.raw_json }}

      - name: Probe packed policy 3 of 3 final list write exactly once
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c9-probe-final-${{ github.run_id }}
          role-duration-seconds: 900
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: false
          output-credentials: false
          unset-current-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.policies.outputs.final_json }}

      - name: Run focused G11C9 PRECHECK after three successful STS probes
        shell: bash
        env:
          PRECHECK_OUTPUT: ${{ runner.temp }}/g11c9-focused-precheck-result.json
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test ! -e "$PRECHECK_OUTPUT"
          python "$RUNNER_PATH" \
            --mode precheck \
            --manifest "$MANIFEST_PATH" \
            --authority "$AUTHORITY_PATH" \
            --plan "$PLAN_PATH" \
            --seed "$SEED_PATH" \
            --pytest-file "$TEST_PATH" \
            --live-adapter "$LIVE_ADAPTER_PATH" \
            --adapter-test "$ADAPTER_TEST_PATH" \
            --sts-policy-probe-count 3 \
            --output "$PRECHECK_OUTPUT"

          test -f "$PRECHECK_OUTPUT"
          jq -e '
            .schema == "M3TOP3_FINANCE_CA_PAGE100_G11C9_FOCUSED_PRECHECK_RESULT_v1.0" and
            .verdict == "PASS" and
            .entry_gate == "FOCUSED_PRECHECK_PASS" and
            .live_adapter_gate == "READY" and
            .bundle.generation_id == "FINANCE-PAGE100-G11C9-20260901200940" and
            .tests.status == "PASS" and
            .observations.sts_policy_probe_count_verified == 3 and
            .observations.sts_policy_probe_roles == ["CHECKPOINT_READ","RAW_READ","FINAL_LIST_WRITE"] and
            .observations.required_no_rerun_runs == [33272691259,33273146915,33401871715,33403101817,33414615913,33414695818,33465583987,33466306591,33469887723,33472741288,33473465774,33477019917,33479444941,33484842311,33490803554,33492771321,33498757471] and
            .observations.active_prefix_rejection_regressions == ["G11","G11C1","G11C2","G11C3","G11C4","G11C5","G11C6","G11C7","G11C8"] and
            .effects.aws_calls == 6 and
            .effects.sts_calls == 6 and
            .effects.sts_assume_role_attempts == 3 and
            .effects.sts_sessions_assumed == 3 and
            .effects.sts_get_caller_identity_calls == 3 and
            .effects.credentials_issued == 3 and
            .effects.s3_calls == 0 and
            .effects.provider_calls == 0 and
            .effects.quota_reservations == 0 and
            .effects.remote_custody_mutations == 0 and
            .effects.repository_writes == 0 and
            .effects.normalization_actions == 0 and
            .effects.pit_actions == 0 and
            .effects.promotion_actions == 0 and
            .effects.release_actions == 0 and
            .effects.production_actions == 0
          ' "$PRECHECK_OUTPUT" >/dev/null

          result_sha="$(sha256sum -- "$PRECHECK_OUTPUT" | cut -d' ' -f1)"
          result_bytes="$(wc -c < "$PRECHECK_OUTPUT" | tr -d ' ')"
          printf '%s\n' 'G11C9_FOCUSED_PRECHECK_RESULT_BASE64_BEGIN'
          base64 -w 0 "$PRECHECK_OUTPUT"
          printf '\n%s\n' 'G11C9_FOCUSED_PRECHECK_RESULT_BASE64_END'
          jq -cn \
            --arg result_sha256 "$result_sha" \
            --argjson result_bytes "$result_bytes" \
            '{verdict:"PASS",entry_gate:"FOCUSED_PRECHECK_PASS",sts_policy_probe_count:3,aws_calls:6,sts_calls:6,sts_assume_role_attempts:3,sts_sessions_assumed:3,sts_get_caller_identity_calls:3,credentials_issued:3,s3_calls:0,provider_calls:0,quota_reservations:0,remote_custody_mutations:0,result_sha256:$result_sha256,result_bytes:$result_bytes}'

      - name: Confirm PRECHECK made no repository S3 provider or custody mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          printf '%s\n' 'PRECHECK_REPOSITORY_CLEAN_THREE_STS_SESSIONS_ZERO_S3_PROVIDER_QUOTA_CUSTODY_EFFECT'
