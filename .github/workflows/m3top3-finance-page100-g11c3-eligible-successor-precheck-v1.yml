  INELIGIBLE_G11C1_RECEIPT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_PREPARATION_AUDIT_TERMINAL_RECEIPT_20260901130250_v1.0.json
  EXPECTED_INELIGIBLE_G11C1_RECEIPT_BLOB: 8dbde6505e5cb0b130cd96e8495cd7f2d63703f7
