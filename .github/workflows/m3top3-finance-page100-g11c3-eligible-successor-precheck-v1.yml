  EXPECTED_INVALIDATED_G11C2_RECEIPT_BLOB: 46dc2cf1c7f422786f4365b94782cb8982a6bdb2
  EXPECTED_INVALIDATED_G11C2_RECEIPT_SHA256: b7e03464f1f2c53a7446901b88ccb2aa481f940c272970f24cccbb5be1523df6
  EXPECTED_INVALIDATED_G11C2_RECEIPT_PAYLOAD_SHA256: d94c512c53a2b83c4d8aae0fc54b0558d9d79f00ca699b684189d9831c5f990a
  EXPECTED_INVALIDATED_G11C2_RECEIPT_BYTES: '16182'
  EXPECTED_G11C3_RAW_PREFIX: raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_generation/runtime_lock_id=PMO-FINANCE-PAGE100-G11C3-20260901134119/pilot_run_id=FINANCE-PAGE100-PILOT-G11C3-20260901134119/
  EXPECTED_G11C3_CONTROL_PREFIX: raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G11C3-20260901134119/pilot_run_id=FINANCE-PAGE100-PILOT-G11C3-20260901134119/
  FAILURE_RECEIPT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11_ELIGIBLE_SUCCESSOR_LIVE_TERMINAL_RECEIPT_33466306591_v1.0.json
  EXPECTED_FAILURE_RECEIPT_BLOB: 00bd90fa57062e438bcddfdcc36be9a5694ef3d9
  EXPECTED_FAILURE_RECEIPT_SHA256: 0577dbbacefa40e60e402dcfb37dd0a85c621952ac29314b56a8481d5e2087d6
  EXPECTED_OWNER_DECISION_BLOB: 1a20b86b784c1c69b407a432e08fb476c60b496d
  EXPECTED_OWNER_DECISION_SHA256: 9efa622791a036c870ff4cded87bc4123cfae8089382c90a9ee2e804955ec6dd

jobs:
  focused-precheck:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      github.event.forced == false &&
      github.event.head_commit.message == 'Arm M3Top3 Finance Page100 G11C3 focused PRECHECK 20260901134119 v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fresh PRECHECK activation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 8
          persist-credentials: false

      - name: Fail closed on activation lineage or material drift
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$EVENT_REPOSITORY" = 'AofSpds/asset-agent-asa'
          test "$EVENT_ACTOR" = 'AofSpds'
          test "$EVENT_TRIGGERING_ACTOR" = 'AofSpds'
          test "$EVENT_REF" = 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828'
          test "$EVENT_RUN_ATTEMPT" = '1'
          test "$(TZ=Asia/Seoul date +%F)" = '2026-09-01'
          test "$(git rev-parse HEAD)" = "$EVENT_AFTER"
          test "$(git rev-parse HEAD^)" = "$EVENT_BEFORE"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B HEAD)" = "$EXPECTED_MESSAGE"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$ACTIVATION_PATH")"

          preparation_commit="$(git rev-parse HEAD^)"
          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          test "$(git log -1 --pretty=%B "$preparation_commit")" = "$EXPECTED_PREPARATION_MESSAGE"
          test "$(git rev-parse "${preparation_commit}^")" = "$EXPECTED_PREPARATION_PARENT_COMMIT"
          test "$(git rev-parse "${preparation_commit}^^{tree}")" = "$EXPECTED_PREPARATION_PARENT_TREE"
          test "$preparation_commit" != "$INELIGIBLE_G11C1_PREPARATION_COMMIT"
          test "$(git rev-parse "${INELIGIBLE_G11C1_PREPARATION_COMMIT}^{tree}")" = "$INELIGIBLE_G11C1_PREPARATION_TREE"
          git merge-base --is-ancestor "$INELIGIBLE_G11C1_PREPARATION_COMMIT" "$EXPECTED_PREPARATION_PARENT_COMMIT"
          test -f "$INELIGIBLE_G11C1_RECEIPT_PATH"
          test "$(git hash-object -- "$INELIGIBLE_G11C1_RECEIPT_PATH")" = "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BLOB"
          test "$(sha256sum -- "$INELIGIBLE_G11C1_RECEIPT_PATH" | cut -d' ' -f1)" = "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_SHA256"
          test "$(wc -c < "$INELIGIBLE_G11C1_RECEIPT_PATH" | tr -d ' ')" = "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BYTES"
          test "$(jq -r '.receipt_integrity.payload_sha256 // empty' "$INELIGIBLE_G11C1_RECEIPT_PATH")" = "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_PAYLOAD_SHA256"
          test "$preparation_commit" != "$INVALIDATED_G11C2_PREPARATION_COMMIT"
          test "$(git rev-parse "${INVALIDATED_G11C2_PREPARATION_COMMIT}^{tree}")" = "$INVALIDATED_G11C2_PREPARATION_TREE"
          test "$(git rev-parse "${INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT}^{tree}")" = "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_TREE"
          test "$(git rev-parse "${INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT}^{tree}")" = "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_TREE"
          git merge-base --is-ancestor "$INVALIDATED_G11C2_PREPARATION_COMMIT" "$EXPECTED_PREPARATION_PARENT_COMMIT"
          git merge-base --is-ancestor "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT" "$EXPECTED_PREPARATION_PARENT_COMMIT"
          git merge-base --is-ancestor "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT" "$EXPECTED_PREPARATION_PARENT_COMMIT"
          test -f "$INVALIDATED_G11C2_RECEIPT_PATH"
          test "$(git hash-object -- "$INVALIDATED_G11C2_RECEIPT_PATH")" = "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BLOB"
          test "$(sha256sum -- "$INVALIDATED_G11C2_RECEIPT_PATH" | cut -d' ' -f1)" = "$EXPECTED_INVALIDATED_G11C2_RECEIPT_SHA256"
          test "$(wc -c < "$INVALIDATED_G11C2_RECEIPT_PATH" | tr -d ' ')" = "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BYTES"
          test "$(jq -r '.receipt_integrity.payload_sha256 // empty' "$INVALIDATED_G11C2_RECEIPT_PATH")" = "$EXPECTED_INVALIDATED_G11C2_RECEIPT_PAYLOAD_SHA256"
          test -f "$FAILURE_RECEIPT_PATH"
          test "$(git hash-object -- "$FAILURE_RECEIPT_PATH")" = "$EXPECTED_FAILURE_RECEIPT_BLOB"
          test "$(sha256sum -- "$FAILURE_RECEIPT_PATH" | cut -d' ' -f1)" = "$EXPECTED_FAILURE_RECEIPT_SHA256"

          for path in \
            "$AUTHORITY_PATH" \
            "$PLAN_PATH" \
            "$SEED_PATH" \
            "$MANIFEST_PATH" \
            "$OWNER_DECISION_PATH" \
            "$INELIGIBLE_G11C1_RECEIPT_PATH" \
            "$INVALIDATED_G11C2_RECEIPT_PATH" \
            "$ACTIVATION_PATH" \
            "$RUNNER_PATH" \
            "$TEST_PATH" \
            "$LIVE_ADAPTER_PATH" \
            "$ADAPTER_TEST_PATH" \
            "$PRECHECK_POLICY_PATH" \
            "$LIVE_POLICY_PATH" \
            "$RECEIPT_SCHEMA_PATH" \
            "$RECEIPT_GENERATOR_PATH" \
            "$PRECHECK_WORKFLOW_PATH" \
            "$LIVE_WORKFLOW_PATH"
          do
            test -f "$path"
          done

          test "$(git hash-object -- "$OWNER_DECISION_PATH")" = "$EXPECTED_OWNER_DECISION_BLOB"
          test "$(sha256sum -- "$OWNER_DECISION_PATH" | cut -d' ' -f1)" = "$EXPECTED_OWNER_DECISION_SHA256"

          manifest_sha="$(sha256sum -- "$MANIFEST_PATH" | cut -d' ' -f1)"
          manifest_blob="$(git hash-object -- "$MANIFEST_PATH")"
          activation_preparation_commit="$(jq -r '.activation_binding.preparation_commit // empty' "$ACTIVATION_PATH")"
          activation_preparation_tree="$(jq -r '.activation_binding.preparation_tree // empty' "$ACTIVATION_PATH")"
          activation_manifest_sha="$(jq -r '.material_bindings.manifest_sha256 // empty' "$ACTIVATION_PATH")"
          activation_manifest_blob="$(jq -r '.material_bindings.manifest_git_blob // empty' "$ACTIVATION_PATH")"
          test "$activation_preparation_commit" = "$preparation_commit"
          test "$activation_preparation_tree" = "$preparation_tree"
          test "$activation_manifest_sha" = "$manifest_sha"
          test "$activation_manifest_blob" = "$manifest_blob"

          verify_manifest_file() {
            role="$1"
            expected_path="$2"
            bound_path="$(jq -r --arg role "$role" '.files[$role].path // empty' "$MANIFEST_PATH")"
            bound_sha="$(jq -r --arg role "$role" '.files[$role].sha256 // empty' "$MANIFEST_PATH")"
            bound_blob="$(jq -r --arg role "$role" '.files[$role].git_blob // empty' "$MANIFEST_PATH")"
            test "$bound_path" = "$expected_path"
            test -f "$bound_path"
            test "$(sha256sum -- "$bound_path" | cut -d' ' -f1)" = "$bound_sha"
            test "$(git hash-object -- "$bound_path")" = "$bound_blob"
          }
          verify_manifest_file authority "$AUTHORITY_PATH"
          verify_manifest_file plan "$PLAN_PATH"
          verify_manifest_file seed "$SEED_PATH"
          verify_manifest_file runner "$RUNNER_PATH"
          verify_manifest_file tests "$TEST_PATH"
          verify_manifest_file live_adapter "$LIVE_ADAPTER_PATH"
          verify_manifest_file adapter_tests "$ADAPTER_TEST_PATH"
          verify_manifest_file precheck_session_policy "$PRECHECK_POLICY_PATH"
          verify_manifest_file live_session_policy "$LIVE_POLICY_PATH"
          verify_manifest_file precheck_workflow "$PRECHECK_WORKFLOW_PATH"
          verify_manifest_file live_workflow "$LIVE_WORKFLOW_PATH"
          verify_manifest_file precheck_receipt_schema "$RECEIPT_SCHEMA_PATH"
          verify_manifest_file precheck_receipt_generator "$RECEIPT_GENERATOR_PATH"
          while IFS=$'\t' read -r role bound_path; do
            case "$bound_path" in
              ''|/*|../*|*/../*|*/..) exit 1 ;;
            esac
            verify_manifest_file "$role" "$bound_path"
          done < <(jq -r '.files | to_entries[] | [.key,.value.path] | @tsv' "$MANIFEST_PATH")

          expected_preparation_paths="$({
            printf '%s\n' "$MANIFEST_PATH"
            jq -r '.files | to_entries[].value.path' "$MANIFEST_PATH"
          } | LC_ALL=C sort -u)"
          observed_preparation_paths="$(
            git diff-tree --no-commit-id --name-only -r "$preparation_commit" |
              LC_ALL=C sort -u
          )"
          test "$observed_preparation_paths" = "$expected_preparation_paths"

          # OA-F01 is a hard authority correction: only the five already sealed
          # occurrences are excluded. A future selector match is raw-custodied
          # first and then terminates the run fail-closed.
          jq -e '
            .artifact == "M3TOP3_FINANCE_CA_PAGE100_G11_DOWNSTREAM_OWNER_DECISION_RECEIPT_v1.1" and
            .correction_id == "OA-F01" and
            .selector_continuation_semantics.sealed_exclusion_scope == [36,37,38,39,40] and
            .selector_continuation_semantics.future_selector_match == "RAW_CUSTODY_THEN_FAIL_CLOSED" and
            .selector_continuation_semantics.future_selector_match_auto_excluded == false and
            .no_rerun.consumed_g10_precheck_run == 33272691259
          ' "$OWNER_DECISION_PATH" >/dev/null

          jq -e \
            --arg ineligible_commit "$INELIGIBLE_G11C1_PREPARATION_COMMIT" \
            --arg ineligible_tree "$INELIGIBLE_G11C1_PREPARATION_TREE" \
            --arg ineligible_receipt_path "$INELIGIBLE_G11C1_RECEIPT_PATH" \
            --arg ineligible_receipt_sha "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_SHA256" \
            --arg ineligible_receipt_blob "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BLOB" \
            --arg ineligible_receipt_payload "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_PAYLOAD_SHA256" \
            --argjson ineligible_receipt_bytes "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BYTES" \
            --arg invalidated_preparation_commit "$INVALIDATED_G11C2_PREPARATION_COMMIT" \
            --arg invalidated_preparation_tree "$INVALIDATED_G11C2_PREPARATION_TREE" \
            --arg invalidated_precheck_commit "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT" \
            --arg invalidated_precheck_tree "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_TREE" \
            --arg invalidated_append_commit "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT" \
            --arg invalidated_append_tree "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_TREE" \
            --arg invalidated_receipt_path "$INVALIDATED_G11C2_RECEIPT_PATH" \
            --arg invalidated_receipt_sha "$EXPECTED_INVALIDATED_G11C2_RECEIPT_SHA256" \
            --arg invalidated_receipt_blob "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BLOB" \
            --arg invalidated_receipt_payload "$EXPECTED_INVALIDATED_G11C2_RECEIPT_PAYLOAD_SHA256" \
            --argjson invalidated_receipt_bytes "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BYTES" \
            --arg expected_raw_prefix "$EXPECTED_G11C3_RAW_PREFIX" \
            --arg expected_control_prefix "$EXPECTED_G11C3_CONTROL_PREFIX" '
            .selector_continuation_semantics.sealed_exclusion_scope == [36,37,38,39,40] and
            .selector_continuation_semantics.future_selector_match == "RAW_CUSTODY_THEN_FAIL_CLOSED" and
            .selector_continuation_semantics.future_selector_match_auto_excluded == false and
            .predecessor_ineligible_preparation_binding.preparation_commit == $ineligible_commit and
            .predecessor_ineligible_preparation_binding.preparation_tree == $ineligible_tree and
            .predecessor_ineligible_preparation_binding.terminal_receipt_path == $ineligible_receipt_path and
            .predecessor_ineligible_preparation_binding.terminal_receipt_sha256 == $ineligible_receipt_sha and
            .predecessor_ineligible_preparation_binding.terminal_receipt_git_blob == $ineligible_receipt_blob and
            .predecessor_ineligible_preparation_binding.terminal_receipt_payload_sha256 == $ineligible_receipt_payload and
            .predecessor_ineligible_preparation_binding.terminal_receipt_bytes == $ineligible_receipt_bytes and
            .predecessor_ineligible_preparation_binding.precheck_activation_created == false and
            .predecessor_ineligible_preparation_binding.live_activation_created == false and
            .predecessor_ineligible_preparation_binding.precheck_run_created == false and
            .predecessor_ineligible_preparation_binding.live_run_created == false and
            .predecessor_ineligible_preparation_binding.reuse_authorized == false and
            .predecessor_invalidated_g11c2_binding.preparation_commit == $invalidated_preparation_commit and
            .predecessor_invalidated_g11c2_binding.preparation_tree == $invalidated_preparation_tree and
            .predecessor_invalidated_g11c2_binding.precheck_activation_commit == $invalidated_precheck_commit and
            .predecessor_invalidated_g11c2_binding.precheck_activation_tree == $invalidated_precheck_tree and
            .predecessor_invalidated_g11c2_binding.precheck_terminal_receipt_append_commit == $invalidated_append_commit and
            .predecessor_invalidated_g11c2_binding.precheck_terminal_receipt_append_tree == $invalidated_append_tree and
            .predecessor_invalidated_g11c2_binding.precheck_run_id == 33469887723 and
            .predecessor_invalidated_g11c2_binding.terminal_receipt_path == $invalidated_receipt_path and
            .predecessor_invalidated_g11c2_binding.terminal_receipt_sha256 == $invalidated_receipt_sha and
            .predecessor_invalidated_g11c2_binding.terminal_receipt_git_blob == $invalidated_receipt_blob and
            .predecessor_invalidated_g11c2_binding.terminal_receipt_payload_sha256 == $invalidated_receipt_payload and
            .predecessor_invalidated_g11c2_binding.terminal_receipt_bytes == $invalidated_receipt_bytes and
            .predecessor_invalidated_g11c2_binding.terminal_checkpoint_commit == env.EXPECTED_PREPARATION_PARENT_COMMIT and
            .predecessor_invalidated_g11c2_binding.terminal_checkpoint_tree == env.EXPECTED_PREPARATION_PARENT_TREE and
            .predecessor_invalidated_g11c2_binding.live_activation_created == false and
            .predecessor_invalidated_g11c2_binding.live_run_created == false and
            .predecessor_invalidated_g11c2_binding.reuse_authorized == false and
            .custody_boundary.g11_raw_prefix == $expected_raw_prefix and
            .custody_boundary.g11_control_prefix == $expected_control_prefix and
            ([.custody_boundary.g11_raw_prefix,.custody_boundary.g11_control_prefix] | all(
              (contains("PMO-FINANCE-PAGE100-G11-20260901110618") | not) and
              (contains("PMO-FINANCE-PAGE100-G11C1-20260901123521") | not) and
              (contains("PMO-FINANCE-PAGE100-G11C2-20260901130250") | not) and
              (contains("FINANCE-PAGE100-PILOT-G11-20260901110618") | not) and
              (contains("FINANCE-PAGE100-PILOT-G11C1-20260901123521") | not) and
              (contains("FINANCE-PAGE100-PILOT-G11C2-20260901130250") | not))) and
            .entry_gate.live_session_policy_ascii_and_size_ceiling_verified == true and
            .entry_gate.live_session_policy_constraints.encoding == "ASCII" and
            .entry_gate.live_session_policy_constraints.maximum_bytes == 2048 and
            .entry_gate.live_session_policy_constraints.focused_precheck_validates_exact_bytes == true and
