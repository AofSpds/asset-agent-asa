  EXPECTED_INELIGIBLE_G11C1_RECEIPT_PAYLOAD_SHA256: a41f3fa41413ed89a30a84867624b3ea52de5813903da033dd48ac023fdc15df
  EXPECTED_INELIGIBLE_G11C1_RECEIPT_BYTES: '11695'
  INVALIDATED_G11C2_PREPARATION_COMMIT: 203a11baf838955b69a5cc4b7509aff38dbf271b
