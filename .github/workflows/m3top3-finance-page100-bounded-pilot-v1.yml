              observed = 0
              while True:
                  remaining_timeout = final_remaining_timeout()
                  final_set_stream_timeout(response, remaining_timeout)
                  remaining_bytes = 10_000_001 - observed
                  if remaining_bytes <= 0:
                      raise SystemExit("LIVE_FINAL_GITHUB_RESPONSE_TOO_LARGE")
                  read_size = min(65_536, remaining_bytes)
                  read_one = getattr(response, "read1", None)
                  reader = read_one if callable(read_one) else response.read
                  chunk = reader(read_size)
                  if not isinstance(chunk, bytes):
                      raise SystemExit("LIVE_FINAL_GITHUB_NON_BYTE_RESPONSE")
                  if not chunk:
                      return b"".join(chunks)
                  chunks.append(chunk)
                  observed += len(chunk)
                  if observed > 10_000_000:
                      raise SystemExit("LIVE_FINAL_GITHUB_RESPONSE_TOO_LARGE")
          def final_get_json(path):
              if not path.startswith("/repos/AofSpds/asset-agent-asa/"):
                  raise SystemExit("LIVE_FINAL_GITHUB_PATH_OUT_OF_SCOPE")
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + gh_token,
                      "User-Agent": "AAA-M3Top3-Finance-Live-Final-Gate/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with final_opener.open(
                      request, timeout=final_remaining_timeout()
                  ) as response:
                      if int(response.status) != 200:
                          raise SystemExit("LIVE_FINAL_GITHUB_NON_200")
                      body = final_read_body(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit("LIVE_FINAL_GITHUB_HTTP_" + str(exc.code)) from None
              except (urllib.error.URLError, TimeoutError, OSError):
                  raise SystemExit("LIVE_FINAL_GITHUB_TRANSPORT_BLOCKED") from None
              try:
                  return json.loads(body, object_pairs_hook=final_pairs)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("LIVE_FINAL_GITHUB_INVALID_JSON") from None
          final_active = {}
          for status in ("queued", "in_progress", "waiting", "requested", "pending"):
              page = 1
              observed = 0
              expected_total = None
              while True:
                  query = urllib.parse.urlencode({
                      "status": status, "per_page": 100, "page": page,
                  })
                  payload = final_get_json(
                      "/repos/AofSpds/asset-agent-asa/actions/runs?" + query
                  )
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("LIVE_FINAL_ACTIVE_RUNS_INVALID")
                  if expected_total is None:
                      expected_total = int(payload.get("total_count", 0))
                  observed += len(runs)
                  for run in runs:
                      run_id = int(run.get("id", 0))
                      if run_id <= 0:
                          raise SystemExit("LIVE_FINAL_ACTIVE_RUN_ID_INVALID")
                      final_active[run_id] = run
                  if len(runs) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise SystemExit("LIVE_FINAL_ACTIVE_RUN_PAGINATION_LIMIT")
              if observed < int(expected_total or 0):
                  raise SystemExit("LIVE_FINAL_ACTIVE_RUNS_INCOMPLETE")
          current_run_id = int(os.environ.get("GITHUB_RUN_ID", "0"))
          if set(final_active) != {current_run_id}:
              raise SystemExit("LIVE_FINAL_REPOSITORY_RUN_NOT_SOLE_ACTIVE")
          final_current = final_active[current_run_id]
          if (
              final_current.get("path")
                 != ".github/workflows/m3top3-finance-page100-bounded-pilot-v1.yml"
              or final_current.get("head_sha") != os.environ.get("GITHUB_SHA")
              or final_current.get("event") != "push"
              or int(final_current.get("run_attempt", 0)) != 1
              or final_current.get("actor", {}).get("login") != "AofSpds"
              or final_current.get("triggering_actor", {}).get("login") != "AofSpds"
              or final_current.get("repository", {}).get("full_name")
                 != "AofSpds/asset-agent-asa"
          ):
              raise SystemExit("LIVE_FINAL_REPOSITORY_RUN_IDENTITY_MISMATCH")

          # Revalidate every live-start reserve after AWS and GitHub readbacks.
          final_now_epoch = int(time.time())
          final_elapsed = final_now_epoch - int(anchor_text)
          if not 0 <= final_elapsed <= 900:
              raise SystemExit("LIVE_FINAL_PREFLIGHT_EXCEEDED_15_MINUTE_BUDGET")
          final_now_utc = datetime.now(timezone.utc)
          final_now_kst = final_now_utc.astimezone(kst)
          final_next_midnight = (final_now_kst + timedelta(days=1)).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          if final_now_kst.date().isoformat() != "2026-08-30":
              raise SystemExit("LIVE_FINAL_QUOTA_DAY_MISMATCH")
          if int((final_next_midnight - final_now_kst).total_seconds()) < 21600:
              raise SystemExit("LIVE_FINAL_MIDNIGHT_RESERVE_INSUFFICIENT")
          if int((not_after - final_now_utc).total_seconds()) < 19800:
              raise SystemExit("LIVE_FINAL_TERMINAL_RESERVE_INSUFFICIENT")
          if time.monotonic() >= live_preflight_deadline:
              raise SystemExit("LIVE_FINAL_MONOTONIC_BUDGET_EXHAUSTED")

          value = os.environ.get("DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY", "")
          if not value:
              raise SystemExit("MISSING_FINANCE_SERVICE_SECRET")
          if value != value.strip() or any(ch.isspace() for ch in value):
              raise SystemExit("INVALID_FINANCE_SERVICE_SECRET_FORMAT")
          if re.search(r"%[0-9A-Fa-f]{2}", value):
              raise SystemExit("FINANCE_SERVICE_SECRET_MUST_BE_DECODED")
          variants = {value, urllib.parse.quote(value, safe=""), urllib.parse.quote_plus(value, safe="")}
          for variant in variants:
              escaped = variant.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PY

          set +e
          python -m tools.m3top3.finance_page100_pilot \
            --authority control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_AUTHORITY_v1.0.json \
            --plan control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_PLAN_v1.0.json \
            --latch control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_LATCH_v1.0.json \
            --checkpoint live_out/checkpoint.json \
            --quota-ledger live_out/quota-ledger.jsonl \
            --raw-index live_out/raw-index.jsonl \
            --report live_out/report.json
          runner_rc=$?

          contract_rc=0
          if [ "$runner_rc" -eq 0 ]; then
            python - <<'PY' || contract_rc=$?
          import json
          import os
          from pathlib import Path

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise SystemExit("DUPLICATE_RUNNER_OUTPUT_JSON_KEY")
                  result[key] = value
              return result

          root = Path("live_out")
          required = {
              "checkpoint": root / "checkpoint.json",
              "report": root / "report.json",
              "quota": root / "quota-ledger.jsonl",
              "raw": root / "raw-index.jsonl",
          }
          if any(not path.is_file() for path in required.values()):
              raise SystemExit("SUCCESSFUL_RUNNER_MISSING_REQUIRED_OUTPUT")
          checkpoint = json.loads(
              required["checkpoint"].read_text(encoding="utf-8"),
              object_pairs_hook=pairs,
          )
          report = json.loads(
              required["report"].read_text(encoding="utf-8"),
              object_pairs_hook=pairs,
          )
          expected_writer = (
              "github-run:" + os.environ["GITHUB_RUN_ID"]
              + ":attempt:" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          claim = checkpoint.get("execution_claim", {})
          if (
              checkpoint.get("state") != "COMPLETE"
              or checkpoint.get("runtime_lock_id") != "PMO-FINANCE-PAGE100-G6-20260829221500"
              or checkpoint.get("pilot_run_id") != "FINANCE-PAGE100-PILOT-G6-20260829221500"
              or checkpoint.get("completed_dates") != [
                  "20240102", "20240131", "20240329", "20240628", "20240808",
                  "20240809", "20240812", "20240930", "20241231", "20250115",
                  "20250331", "20250630", "20251231", "20260115", "20260331",
                  "20260630", "20260814",
              ]
              or claim.get("writer_id") != expected_writer
              or claim.get("object_key")
                 != "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-08-30/execution-claim.json"
              or claim.get("server_side_encryption") != "AES256"
              or claim.get("write_precondition") != "IF_NONE_MATCH_STAR"
              or not claim.get("version_id")
              or not claim.get("etag")
          ):
              raise SystemExit("SUCCESSFUL_RUNNER_CHECKPOINT_CONTRACT_MISMATCH")
          result = report.get("result", {})
          if (
              report.get("runtime_lock_id") != checkpoint.get("runtime_lock_id")
              or report.get("pilot_run_id") != checkpoint.get("pilot_run_id")
              or result.get("checkpoint_state") != "COMPLETE"
              or result.get("completed_date_count") != 17
              or result.get("all_primary_dates_completed") is not True
              or report.get("validation_claim") != "NONE"
              or report.get("gate_effect") != "NONE"
          ):
              raise SystemExit("SUCCESSFUL_RUNNER_REPORT_CONTRACT_MISMATCH")
          quota_baseline = Path(os.environ["FINANCE_BASELINE_QUOTA_PATH"]).read_bytes()
          raw_baseline = Path(os.environ["FINANCE_BASELINE_RAW_INDEX_PATH"]).read_bytes()
          if not required["quota"].read_bytes().startswith(quota_baseline):
              raise SystemExit("SUCCESSOR_QUOTA_LEDGER_DID_NOT_PRESERVE_PREDECESSOR_PREFIX")
          if not required["raw"].read_bytes().startswith(raw_baseline):
              raise SystemExit("SUCCESSOR_RAW_INDEX_DID_NOT_PRESERVE_PREDECESSOR_PREFIX")
          PY
          fi

          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.parse
          from pathlib import Path

          root = Path("live_out")
          secret = os.environ["DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY"].encode("utf-8")
          variants = {
              secret,
              urllib.parse.quote(secret.decode("utf-8"), safe="").encode("utf-8"),
              urllib.parse.quote_plus(secret.decode("utf-8"), safe="").encode("utf-8"),
          }
          leaked = False
          if root.exists():
              for path in root.rglob("*"):
                  if path.is_file():
                      data = path.read_bytes()
                      if any(value and value in data for value in variants):
                          leaked = True
                          break
          if leaked:
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              root.joinpath("exact-secret-scan.json").write_text(
                  json.dumps({
                      "artifact": "M3TOP3_FINANCE_CA_PAGE100_EXACT_SECRET_SCAN_v1.0",
                      "state": "BLOCKED_OUTPUT_REMOVED",
                      "matched_value_persisted": False,
                  }, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(86)
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("exact-secret-scan.json").write_text(
              json.dumps({
                  "artifact": "M3TOP3_FINANCE_CA_PAGE100_EXACT_SECRET_SCAN_v1.0",
                  "state": "PASS",
                  "matched_value_persisted": False,
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          scan_rc=$?
          set -e
          if [ "$scan_rc" -ne 0 ]; then
            exit "$scan_rc"
          fi
          if [ "$contract_rc" -ne 0 ]; then
            exit "$contract_rc"
          fi
          exit "$runner_rc"

      - name: Leak-scan and build sanitized evidence bundle
        if: always()
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          source = Path("live_out")
          target = Path("sanitized_out")
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True, exist_ok=True)
          allowed = {
              "preflight.json": "json",
              "aws-precheck.json": "json",
              "predecessor-readback.json": "json",
              "aws-readonly-diagnostic.json": "json",
              "github-readback.json": "json",
              "checkpoint.json": "json",
              "quota-ledger.jsonl": "jsonl",
              "raw-index.jsonl": "jsonl",
              "report.json": "json",
              "exact-secret-scan.json": "json",
          }
          ignored_zero_byte_locks = {
              ".checkpoint.json.lock",
              ".quota-ledger.jsonl.lock",
              ".raw-index.jsonl.lock",
              ".report.json.lock",
          }
          byte_patterns = (
              re.compile(br"serviceKey", re.IGNORECASE),
              re.compile(br"(?:X-Amz-Credential|X-Amz-Signature|X-Amz-Security-Token)", re.IGNORECASE),
              re.compile(br"Authorization\s*:", re.IGNORECASE),
              re.compile(br"(?:AKIA|ASIA)[A-Z0-9]{16}"),
              re.compile(br"https?://[^\s\"']*[?&](?:serviceKey|X-Amz-[A-Za-z]+)=", re.IGNORECASE),
              re.compile(br"DATA_GO_KR_(?:FINANCE|KSD)", re.IGNORECASE),
              re.compile(br"M3TOP3-KSD", re.IGNORECASE),
          )
          prohibited_key_fragments = (
              "servicekey", "credential_value", "credential_hash", "credential_prefix",
              "authenticated_url", "request_headers", "authorization_header",
              "secret_value", "aws_access_key", "aws_secret", "aws_session_token",
          )

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise ValueError("DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def inspect(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {"authenticated_url_persisted", "secret_persisted"}:
                          if child is not False:
                              raise ValueError("PERSISTENCE_NEGATIVE_EVIDENCE_MUST_BE_FALSE")
                          continue
                      folded = str(key).replace("_", "").lower()
                      if any(fragment.replace("_", "") in folded for fragment in prohibited_key_fragments):
                          raise ValueError("PROHIBITED_OUTPUT_FIELD")
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str):
                  if value == "KSD":
                      raise ValueError("KSD_OUTPUT_VALUE_PROHIBITED")
                  encoded = value.encode("utf-8")
                  if any(pattern.search(encoded) for pattern in byte_patterns):
                      raise ValueError("PROHIBITED_OUTPUT_VALUE")

          state = "PASS"
          copied = []
          try:
              if source.exists():
                  ignored = [
                      path for path in source.rglob("*")
                      if path.is_file() and path.name in ignored_zero_byte_locks
                  ]
                  if any(path.stat().st_size != 0 for path in ignored):
                      raise ValueError("NONEMPTY_LOCK_FILE")
                  unexpected = [
                      path for path in source.rglob("*")
                      if path.is_file()
                      and path.name not in allowed
                      and path.name not in ignored_zero_byte_locks
                  ]
                  if unexpected:
                      raise ValueError("UNEXPECTED_OUTPUT_FILE")
                  for name, kind in allowed.items():
                      path = source / name
                      if not path.exists():
                          continue
                      data = path.read_bytes()
                      if len(data) > 25_000_000:
                          raise ValueError("OUTPUT_FILE_TOO_LARGE")
                      if any(pattern.search(data) for pattern in byte_patterns):
                          raise ValueError("PROHIBITED_OUTPUT_BYTES")
                      rows = []
                      if kind == "json":
                          rows = [json.loads(data.decode("utf-8"), object_pairs_hook=pairs)]
                      else:
                          for line in data.decode("utf-8").splitlines():
                              if line.strip():
                                  rows.append(json.loads(line, object_pairs_hook=pairs))
                      if name == "quota-ledger.jsonl":
                          if any(row.get("provider") not in {"FINANCE", "KSD"} for row in rows):
                              raise ValueError("UNKNOWN_QUOTA_PROVIDER")
                          rows = [row for row in rows if row.get("provider") == "FINANCE"]
                      for row in rows:
                          inspect(row)
                      rendered = "".join(
                          json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"
                          for row in rows
                      )
                      target.joinpath(name).write_text(rendered, encoding="utf-8")
                      copied.append(name)
          except Exception:
              state = "BLOCKED_UNSAFE_OR_MALFORMED_OUTPUT_NOT_COPIED"
              shutil.rmtree(target, ignore_errors=True)
              target.mkdir(parents=True, exist_ok=True)
              copied = []

          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_PAGE100_SANITIZED_BUNDLE_RECEIPT_v1.0",
              "state": state,
              "copied_files": sorted(copied),
              "raw_entities_in_actions_artifact": 0,
              "secret_values_persisted": False,
              "authenticated_urls_persisted": False,
              "ksd_material_present": False,
          }
          target.joinpath("sanitization-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          if state != "PASS":
              raise SystemExit(87)
          PY

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3top3-finance-page100-bounded-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: sanitized_out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
