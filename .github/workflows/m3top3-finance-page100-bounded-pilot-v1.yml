          require(inherited.get("raw_object_count_reused") == 9, "CHECKPOINT_REUSED_RAW_COUNT_MISMATCH")
          require(inherited.get("raw_entity_bytes_reused") == 40423, "CHECKPOINT_REUSED_RAW_BYTES_MISMATCH")
          current_seed_date = checkpoint.get("current_date", {})
          require(current_seed_date.get("basDt") == "20240131", "CHECKPOINT_CURRENT_DATE_MISMATCH")
          partial = current_seed_date.get("predecessor_page_1_reference", {})
          require(partial.get("basDt") == "20240131" and partial.get("page_no") == 1, "CHECKPOINT_PARTIAL_PAGE_MISMATCH")
          require(partial.get("entity_bytes") == 4642, "CHECKPOINT_PARTIAL_PAGE_BYTES_MISMATCH")
          require(partial.get("entity_sha256") == "2e97f391bcf833db568de2c8638c5ff6d297ea07be21efc3fca6d05cd266c309", "CHECKPOINT_PARTIAL_PAGE_DIGEST_MISMATCH")
          require(partial.get("s3_version_id") == "avNHRa6z6kooy0MEG0rB3H2Ify2dWSjq", "CHECKPOINT_PARTIAL_PAGE_VERSION_MISMATCH")
          require(inherited.get("network_attempts_recounted_as_successor") == 0, "CHECKPOINT_PREDECESSOR_NETWORK_RECOUNT_PROHIBITED")
          require(inherited.get("raw_entities_rewritten") == 0, "CHECKPOINT_PREDECESSOR_REWRITE_PROHIBITED")
          require(inherited.get("predecessor_rerun") is False, "CHECKPOINT_PREDECESSOR_RERUN_PROHIBITED")

          # Immutable predecessor terminal evidence is the successor's only
          # resume source.  Normalize only transport-added trailing blank lines.
          require(terminal_sha256(PREDECESSOR_CHECKPOINT_PATH) == "9a18edaf66b9f03b2202dbef11c0f86472340695c0c245f0a8ca958e3cfce55d", "PREDECESSOR_CHECKPOINT_TERMINAL_HASH_MISMATCH")
          require(terminal_sha256(PREDECESSOR_REPORT_PATH) == "78c4e659f02b0a206129474219db681b50756e58f2492dbe4c1a689733fa6b2a", "PREDECESSOR_REPORT_TERMINAL_HASH_MISMATCH")
          require(terminal_sha256(PREDECESSOR_RUN_RECEIPT_PATH) == "f42af57c62f65a8dd1e31b6b4f825ae067c0f9c6290a5efc104dcca5337d5a8b", "PREDECESSOR_RECEIPT_TERMINAL_HASH_MISMATCH")
          require(terminal_sha256(BASELINE_QUOTA_PATH) == "b04e0d5434dff371ece950b568b545076a1833db078a5e40f85ebf704a436c49", "PREDECESSOR_QUOTA_TERMINAL_HASH_MISMATCH")
          require(terminal_sha256(BASELINE_RAW_INDEX_PATH) == "c78f29fa90e7648df1ef1513df539d021b26aeac19e6b5cc3e701c90d5fcc9ad", "PREDECESSOR_RAW_INDEX_TERMINAL_HASH_MISMATCH")

          predecessor_checkpoint = strict_json(PREDECESSOR_CHECKPOINT_PATH)
          require(predecessor_checkpoint.get("state") == "BLOCKED", "PREDECESSOR_CHECKPOINT_NOT_TERMINAL_BLOCKED")
          require(predecessor_checkpoint.get("runtime_lock_id") == EXPECTED_PREDECESSOR_RUNTIME, "PREDECESSOR_CHECKPOINT_RUNTIME_MISMATCH")
          require(predecessor_checkpoint.get("pilot_run_id") == EXPECTED_PREDECESSOR_PILOT, "PREDECESSOR_CHECKPOINT_PILOT_MISMATCH")
          require(predecessor_checkpoint.get("next_date_index") == 1, "PREDECESSOR_CHECKPOINT_INDEX_MISMATCH")
          require(predecessor_checkpoint.get("completed_dates") == ["20240102"], "PREDECESSOR_CHECKPOINT_COMPLETED_DATE_MISMATCH")
          require(predecessor_checkpoint.get("quota_reservations") == 9, "PREDECESSOR_CHECKPOINT_QUOTA_MISMATCH")
          require(predecessor_checkpoint.get("network_attempts_started_conservative") == 9, "PREDECESSOR_CHECKPOINT_NETWORK_MISMATCH")
          require(predecessor_checkpoint.get("response_entities_received") == 9, "PREDECESSOR_CHECKPOINT_ENTITY_COUNT_MISMATCH")
          require(predecessor_checkpoint.get("raw_entity_bytes") == 40423, "PREDECESSOR_CHECKPOINT_BYTES_MISMATCH")

          predecessor_report = strict_json(PREDECESSOR_REPORT_PATH)
          require(predecessor_report.get("state") == "STOP_NO_PROMOTION_PILOT_BLOCKED", "PREDECESSOR_REPORT_STATE_MISMATCH")
          require(predecessor_report.get("runtime_lock_id") == EXPECTED_PREDECESSOR_RUNTIME, "PREDECESSOR_REPORT_RUNTIME_MISMATCH")
          require(predecessor_report.get("pilot_run_id") == EXPECTED_PREDECESSOR_PILOT, "PREDECESSOR_REPORT_PILOT_MISMATCH")
          require(predecessor_report.get("completed_date_count") == 1, "PREDECESSOR_REPORT_COMPLETED_COUNT_MISMATCH")
          require(predecessor_report.get("total_items") == 76, "PREDECESSOR_REPORT_ITEM_COUNT_MISMATCH")

          predecessor_receipt = strict_json(PREDECESSOR_RUN_RECEIPT_PATH)
          require(predecessor_receipt.get("state") == "STOP_NO_PROMOTION_PILOT_BLOCKED", "PREDECESSOR_RECEIPT_STATE_MISMATCH")
          require(predecessor_receipt.get("workflow_run_id") == EXPECTED_PREDECESSOR_RUN_ID, "PREDECESSOR_RECEIPT_RUN_MISMATCH")
          require(predecessor_receipt.get("workflow_job_id") == EXPECTED_PREDECESSOR_JOB_ID, "PREDECESSOR_RECEIPT_JOB_MISMATCH")
          require(predecessor_receipt.get("run_attempt") == 1, "PREDECESSOR_RECEIPT_ATTEMPT_MISMATCH")
          require(predecessor_receipt.get("historical_failed_run_rerun") is False, "PREDECESSOR_RECEIPT_RERUN_STATE_MISMATCH")
          require(predecessor_receipt.get("quota_reservations") == 9, "PREDECESSOR_RECEIPT_QUOTA_MISMATCH")
          require(predecessor_receipt.get("provider_api_network_attempts") == 9, "PREDECESSOR_RECEIPT_NETWORK_MISMATCH")
          require(predecessor_receipt.get("raw_s3_entities") == 9, "PREDECESSOR_RECEIPT_RAW_COUNT_MISMATCH")
          require(predecessor_receipt.get("raw_entity_bytes") == 40423, "PREDECESSOR_RECEIPT_BYTES_MISMATCH")
          require(predecessor_receipt.get("exact_resume_instruction", "").startswith("DO_NOT_RERUN_33195472310;"), "PREDECESSOR_RECEIPT_DO_NOT_RERUN_MISSING")
          execution_claim = predecessor_receipt.get("execution_claim", {})
          require(execution_claim.get("version_id") == "sYrxA7bgF.ElY95G1xOYzjKCLWbknHVZ", "PREDECESSOR_EXECUTION_CLAIM_VERSION_MISMATCH")
          require(execution_claim.get("server_side_encryption") == "AES256", "PREDECESSOR_EXECUTION_CLAIM_ENCRYPTION_MISMATCH")
          require(execution_claim.get("write_precondition") == "IF_NONE_MATCH_STAR", "PREDECESSOR_EXECUTION_CLAIM_PRECONDITION_MISMATCH")
          artifact = predecessor_receipt.get("github_actions_artifact", {})
          require(artifact.get("artifact_id") == 9695626442, "PREDECESSOR_ARTIFACT_ID_MISMATCH")
          require(artifact.get("zip_sha256") == "0665c599163a9b72bfcb22b009bd8c2f34462de7638c35b6ed4079a47201146c", "PREDECESSOR_ARTIFACT_DIGEST_MISMATCH")

          quota_rows = strict_jsonl(BASELINE_QUOTA_PATH)
          raw_rows = strict_jsonl(BASELINE_RAW_INDEX_PATH)
          require(len(quota_rows) == 16, "PREDECESSOR_QUOTA_LEDGER_ROW_COUNT_MISMATCH")
          require(len(raw_rows) == 10, "PREDECESSOR_RAW_INDEX_ROW_COUNT_MISMATCH")
          predecessor_quota_rows = [row for row in quota_rows if row.get("pilot_run_id") == EXPECTED_PREDECESSOR_PILOT]
          require(len(predecessor_quota_rows) == 9, "PREDECESSOR_QUOTA_ROW_COUNT_MISMATCH")
          require([row.get("ordinal") for row in predecessor_quota_rows] == list(range(1, 10)), "PREDECESSOR_QUOTA_ORDINAL_SEQUENCE_MISMATCH")
          predecessor_raw_rows = [row for row in raw_rows if row.get("pilot_run_id") == EXPECTED_PREDECESSOR_PILOT]
          require(len(predecessor_raw_rows) == 9, "PREDECESSOR_RAW_ROW_COUNT_MISMATCH")
          actual_objects = tuple(
              (
                  row.get("basDt"), row.get("page_no"), row.get("s3_object_key"),
                  row.get("s3_version_id"), row.get("entity_bytes"),
                  row.get("entity_sha256"), row.get("s3_etag"),
              )
              for row in predecessor_raw_rows
          )
          require(actual_objects == EXPECTED_PREDECESSOR_OBJECTS, "PREDECESSOR_RAW_OBJECT_MANIFEST_MISMATCH")
          for row in predecessor_raw_rows:
              require(row.get("github_run_id") == EXPECTED_PREDECESSOR_RUN_ID, "PREDECESSOR_RAW_RUN_MISMATCH")
              require(row.get("run_attempt") == 1, "PREDECESSOR_RAW_RUN_ATTEMPT_MISMATCH")
              require(row.get("runtime_lock_id") == EXPECTED_PREDECESSOR_RUNTIME, "PREDECESSOR_RAW_RUNTIME_MISMATCH")
              require(row.get("http_status") == 200, "PREDECESSOR_RAW_HTTP_STATUS_MISMATCH")
              require(row.get("server_side_encryption") == "AES256", "PREDECESSOR_RAW_ENCRYPTION_MISMATCH")
              require(row.get("remote_readback_bytes") == row.get("entity_bytes"), "PREDECESSOR_RAW_READBACK_BYTES_MISMATCH")
              require(row.get("remote_readback_sha256") == row.get("entity_sha256"), "PREDECESSOR_RAW_READBACK_DIGEST_MISMATCH")
          require(sum(row[4] for row in EXPECTED_PREDECESSOR_OBJECTS) == 40423, "PREDECESSOR_OBJECT_MANIFEST_TOTAL_BYTES_MISMATCH")

          hard = latch.get("hard_prohibitions", {})
          for key in (
              "fallback_dates", "full_date_range_expansion", "historical_2019_canary_expansion",
              "ksd_api_or_secret_use", "ksd_search_or_api_expansion", "bulk_acquisition",
              "normalized_release", "model_semantic_change", "pit_semantic_change",
              "automatic_normalized_model_pit_promotion", "automatic_promotion",
              "secret_persistence", "authenticated_url_persistence",
              "execution_token_original_persistence",
          ):
              require(hard.get(key) in {"NOT_AUTHORIZED", "PROHIBITED"}, "HARD_PROHIBITION_MISMATCH:" + key)
          require(latch.get("s2_ksd_blocker_waiver") is False, "KSD_BLOCKER_WAIVER_PROHIBITED")
          require(latch.get("bulk_acquisition_authorized") is False, "BULK_AUTHORITY_PROHIBITED")
          require(latch.get("production_authorized") is False, "PRODUCTION_AUTHORITY_PROHIBITED")
          require(latch.get("model_semantic_change_authorized") is False, "MODEL_CHANGE_PROHIBITED")
          require(latch.get("pit_semantic_change_authorized") is False, "PIT_CHANGE_PROHIBITED")
          require(latch.get("validation_claim") == "NONE", "VALIDATION_CLAIM_MISMATCH")
          require(latch.get("gate_effect") == "NONE", "GATE_EFFECT_MISMATCH")

          role_arn = os.environ.get("ROLE_ARN", "")
          expected_role_arn = "arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter"
          require(role_arn == expected_role_arn, "AWS_ROLE_ARN_EXACT_MISMATCH")
          expected_role_binding_state = (
              "EXACT_ROLE_ARN_BOUND_PENDING_PRECHECK"
              if mode == "PRECHECK_ARMED"
              else "PASS_EXACT_ROLE_ARN_OIDC_STS_READ_ONLY_PRECHECK"
          )
          require(remote.get("aws_role_arn_binding_state") == expected_role_binding_state, "AWS_ROLE_BINDING_STATE_MISMATCH")
          require(remote.get("aws_role_arn_expected") == expected_role_arn, "LATCH_AWS_ROLE_ARN_MISMATCH")
          require(remote.get("aws_role_path_expected") == "M3Top3GitHubOIDCRawWriter", "LATCH_AWS_ROLE_PATH_MISMATCH")

          Path("live_out").mkdir(parents=True, exist_ok=True)
          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_PAGE100_PILOT_PREFLIGHT_v1.0",
              "state": "PASS_NO_PROVIDER_CALL",
              "mode": mode,
              "runtime_lock_id": EXPECTED_RUNTIME,
              "pilot_run_id": EXPECTED_RUN_ID,
              "owner_cap_spec_sha256": EXPECTED_OWNER_SPEC,
              "primary_date_count": 17,
              "request_page_size": 10,
              "max_pages_per_date": 100,
              "max_primary_page_acquisitions": 1700,
              "max_network_attempts_total": 2000,
              "max_attempts_per_page": 2,
              "quota_day_kst_gate": EXPECTED_QUOTA_DAY_KST if mode == "LIVE_ARMED" else "NOT_APPLICABLE_PRECHECK",
              "predecessor_terminal_head_sha": EXPECTED_PREDECESSOR_HEAD,
              "predecessor_workflow_run_id": EXPECTED_PREDECESSOR_RUN_ID,
              "predecessor_object_manifest_count": 9,
              "predecessor_raw_entity_bytes": 40423,
              "completed_dates_reused": ["20240102"],
              "completed_page_count_reused": 8,
              "completed_item_count_reused": 76,
              "successor_raw_write_prefix": raw_write_prefix,
              "control_prefix": control_prefix,
              "global_writer_claim_uri": writer_claim_uri,
              "self_deadline_seconds": int(os.environ["FINANCE_SELF_DEADLINE_SECONDS"]),
              "static_material_sha256": {
                  "checkpoint_seed": bindings["checkpoint_seed_sha256"],
                  "baseline_quota_ledger": bindings["baseline_quota_ledger_sha256"],
                  "baseline_raw_index": bindings["baseline_raw_index_sha256"],
                  "predecessor_checkpoint": bindings["predecessor_checkpoint_sha256"],
                  "predecessor_report": bindings["predecessor_report_sha256"],
                  "predecessor_run_receipt": bindings["predecessor_run_receipt_sha256"],
                  "runner": bindings["runner_sha256"],
                  "source_admission": bindings["source_admission_sha256"],
                  "workflow": bindings["workflow_sha256"],
              },
              "aws_role_arn_shape": "PASS_EXACT_EQUALITY",
              "aws_role_arn_sha256": hashlib.sha256(role_arn.encode("utf-8")).hexdigest(),
              "provider_api_network_attempts": 0,
              "quota_reservations": 0,
              "remote_s3_writes": 0,
              "remote_raw_custody_writes": 0,
              "validation_claim": "NONE",
              "gate_effect": "NONE",
          }
          Path("live_out/preflight.json").write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("mode=" + mode + "\n")
              handle.write("control_prefix=" + control_prefix + "\n")
              handle.write("raw_write_prefix=" + raw_write_prefix + "\n")
              handle.write("writer_claim_prefix=" + writer_claim_prefix + "\n")
              handle.write("writer_claim_key=" + writer_claim_prefix + "execution-claim.json\n")
              if mode == "LIVE_ARMED":
                  fresh = latch["fresh_precheck_binding"]
                  handle.write("precheck_run_id=" + str(fresh["workflow_run_id"]) + "\n")
                  handle.write("precheck_head_sha=" + fresh["head_sha"] + "\n")
                  handle.write("precheck_artifact_id=" + str(fresh["artifact_id"]) + "\n")
                  handle.write("precheck_artifact_digest_sha256=" + fresh["artifact_digest_sha256"] + "\n")
          PY

      - name: Verify GitHub OIDC claims without persisting token
        if: steps.preflight.outputs.mode == 'PRECHECK_ARMED'
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "sub": "repo:AofSpds@87963280/asset-agent-asa@1334403184:environment:m3top3-source-admission",
              "repository": "AofSpds/asset-agent-asa",
              "repository_owner": "AofSpds",
              "ref": "refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828",
              "actor": "AofSpds",
              "environment": "m3top3-source-admission",
          }
          if (
              os.environ.get("EXPECTED_REPOSITORY") != expected["repository"]
              or os.environ.get("EXPECTED_REF") != expected["ref"]
              or os.environ.get("EXPECTED_ACTOR") != expected["actor"]
          ):
              raise SystemExit("OIDC_EVENT_CONTEXT_MISMATCH")
          expected_sha = os.environ.get("EXPECTED_SHA", "")
          if len(expected_sha) != 40 or any(ch not in "0123456789abcdef" for ch in expected_sha):
              raise SystemExit("OIDC_EVENT_SHA_INVALID")

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          parsed = urllib.parse.urlsplit(request_url)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or not parsed.hostname.endswith(".actions.githubusercontent.com")
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
          ):
              raise SystemExit("OIDC_REQUEST_URL_CONTEXT_INVALID")
          if not request_token or any(ch.isspace() for ch in request_token):
              raise SystemExit("OIDC_REQUEST_TOKEN_CONTEXT_INVALID")
          query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
          query = [(key, value) for key, value in query if key != "audience"]
          query.append(("audience", "sts.amazonaws.com"))
          audience_url = urllib.parse.urlunsplit(
              (parsed.scheme, parsed.netloc, parsed.path, urllib.parse.urlencode(query), "")
          )
          request = urllib.request.Request(
              audience_url,
              headers={
                  "Authorization": "Bearer " + request_token,
                  "Accept": "application/json",
                  "User-Agent": "AAA-M3Top3-OIDC-Claims-Precheck/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if int(response.status) != 200:
                  raise SystemExit("OIDC_TOKEN_ENDPOINT_NON_200")
              body = response.read(100_001)
          if len(body) > 100_000:
              raise SystemExit("OIDC_TOKEN_RESPONSE_TOO_LARGE")
          token = json.loads(body).get("value")
          if not isinstance(token, str) or token.count(".") != 2:
              raise SystemExit("OIDC_TOKEN_RESPONSE_INVALID")

          def decode(segment):
              padding = "=" * ((4 - len(segment) % 4) % 4)
              return json.loads(base64.urlsafe_b64decode(segment + padding))

          header_segment, payload_segment, _ = token.split(".")
          header = decode(header_segment)
          claims = decode(payload_segment)
          if header.get("alg") != "RS256" or header.get("typ") != "JWT":
              raise SystemExit("OIDC_JWT_HEADER_MISMATCH")
          audience = claims.get("aud")
          if audience != "sts.amazonaws.com" and not (
              isinstance(audience, list) and "sts.amazonaws.com" in audience
          ):
              raise SystemExit("OIDC_AUDIENCE_MISMATCH")
          actual_subject = claims.get("sub")
          if (
              not isinstance(actual_subject, str)
              or not 1 <= len(actual_subject) <= 500
              or any(
                  ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._:/@%-"
                  for ch in actual_subject
              )
          ):
              raise SystemExit("OIDC_SUBJECT_UNSAFE_OR_INVALID")
          if actual_subject != expected["sub"]:
              receipt_path = Path("live_out/preflight.json")
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              receipt["github_oidc_claims"] = {
                  "state": "BLOCKED_SUBJECT_MISMATCH_NO_TOKEN_PERSISTED",
                  "issuer": expected["iss"],
                  "audience": "sts.amazonaws.com",
                  "expected_subject": expected["sub"],
                  "actual_subject": actual_subject,
                  "repository": claims.get("repository"),
                  "ref": claims.get("ref"),
                  "sha": claims.get("sha"),
                  "actor": claims.get("actor"),
                  "environment": claims.get("environment"),
                  "token_persisted": False,
                  "authenticated_url_persisted": False,
              }
              receipt_path.write_text(
                  json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              token = None
              request_token = None
              audience_url = None
              raise SystemExit("OIDC_CLAIM_MISMATCH:sub")
          for key, value in expected.items():
              if claims.get(key) != value:
                  raise SystemExit("OIDC_CLAIM_MISMATCH:" + key)
          if claims.get("sha") != expected_sha:
              raise SystemExit("OIDC_SHA_CLAIM_MISMATCH")
          now = int(time.time())
          if (
              type(claims.get("iat")) is not int
              or type(claims.get("exp")) is not int
              or not claims["iat"] - 120 <= now < claims["exp"]
          ):
              raise SystemExit("OIDC_TOKEN_TIME_WINDOW_INVALID")

          receipt_path = Path("live_out/preflight.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          receipt["github_oidc_claims"] = {
              "state": "PASS_EXPECTED_ENVIRONMENT_SUBJECT_NO_TOKEN_PERSISTED",
              "issuer": expected["iss"],
              "audience": "sts.amazonaws.com",
              "subject": expected["sub"],
              "repository": expected["repository"],
              "repository_owner": expected["repository_owner"],
              "ref": expected["ref"],
              "sha": expected_sha,
              "actor": expected["actor"],
              "environment": expected["environment"],
              "token_persisted": False,
              "authenticated_url_persisted": False,
          }
          receipt_path.write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          token = None
          request_token = None
          audience_url = None
          PY

      - name: Configure read-only AWS OIDC precheck session
        if: steps.preflight.outputs.mode == 'PRECHECK_ARMED'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: m3top3-finance-precheck-${{ github.run_id }}
          role-duration-seconds: 900
          retry-max-attempts: 1
          disable-retry: true
          output-credentials: false
          mask-aws-account-id: true
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "ExactBucketMetadata",
                  "Effect": "Allow",
                  "Action": ["s3:GetBucketLocation", "s3:GetBucketVersioning"],
                  "Resource": "arn:aws:s3:::semi-data-plane-aofspds-20260815"
                },
                {
                  "Sid": "ExactFinancePrefixList",
                  "Effect": "Allow",
                  "Action": ["s3:ListBucket", "s3:ListBucketVersions"],
                  "Resource": "arn:aws:s3:::semi-data-plane-aofspds-20260815",
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": [
                        "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/",
                        "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/*"
                      ]
                    }
                  }
                },
                {
                  "Sid": "FinanceReadOnlyNoWriteCapability",
                  "Effect": "Allow",
                  "Action": ["s3:GetObject", "s3:GetObjectVersion"],
                  "Resource": "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/*"
                }
              ]
            }

      - name: Configure bounded AWS OIDC live writer session
        if: steps.preflight.outputs.mode == 'LIVE_ARMED'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: m3top3-finance-live-${{ github.run_id }}
