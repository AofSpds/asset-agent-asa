              payload = aws_json(
                  "s3api", "list-object-versions", "--bucket", BUCKET,
                  "--prefix", prefix, "--max-keys", "1",
                  "--expected-bucket-owner", OWNER,
              )
              require(not payload.get("Versions"), code + "_VERSIONS")
              require(not payload.get("DeleteMarkers"), code + "_DELETE_MARKERS")

