              object_pairs_hook=pairs,
          )
          report = json.loads(
              required["report"].read_text(encoding="utf-8"),
              object_pairs_hook=pairs,
          )
          expected_writer = (
              "github-run:" + os.environ["GITHUB_RUN_ID"]
              + ":attempt:" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          claim = checkpoint.get("execution_claim", {})
          if (
              checkpoint.get("state") != "COMPLETE"
              or checkpoint.get("runtime_lock_id") != "PMO-FINANCE-PAGE100-20260829041623"
              or checkpoint.get("pilot_run_id") != "FINANCE-PAGE100-PILOT-20260829041623"
              or checkpoint.get("completed_dates") != [
                  "20240102", "20240131", "20240329", "20240628", "20240808",
                  "20240809", "20240812", "20240930", "20241231", "20250115",
                  "20250331", "20250630", "20251231", "20260115", "20260331",
                  "20260630", "20260814",
              ]
              or claim.get("writer_id") != expected_writer
              or claim.get("object_key")
                 != "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-08-29/execution-claim.json"
              or claim.get("server_side_encryption") != "AES256"
              or claim.get("write_precondition") != "IF_NONE_MATCH_STAR"
              or not claim.get("version_id")
              or not claim.get("etag")
          ):
              raise SystemExit("SUCCESSFUL_RUNNER_CHECKPOINT_CONTRACT_MISMATCH")
          result = report.get("result", {})
          if (
              report.get("runtime_lock_id") != checkpoint.get("runtime_lock_id")
              or report.get("pilot_run_id") != checkpoint.get("pilot_run_id")
              or result.get("checkpoint_state") != "COMPLETE"
              or result.get("completed_date_count") != 17
              or result.get("all_primary_dates_completed") is not True
              or report.get("validation_claim") != "NONE"
              or report.get("gate_effect") != "NONE"
          ):
              raise SystemExit("SUCCESSFUL_RUNNER_REPORT_CONTRACT_MISMATCH")
          quota_baseline = Path(os.environ["FINANCE_BASELINE_QUOTA_PATH"]).read_bytes()
          raw_baseline = Path(os.environ["FINANCE_BASELINE_RAW_INDEX_PATH"]).read_bytes()
          if not required["quota"].read_bytes().startswith(quota_baseline):
              raise SystemExit("SUCCESSOR_QUOTA_LEDGER_DID_NOT_PRESERVE_PREDECESSOR_PREFIX")
          if not required["raw"].read_bytes().startswith(raw_baseline):
              raise SystemExit("SUCCESSOR_RAW_INDEX_DID_NOT_PRESERVE_PREDECESSOR_PREFIX")
          PY
          fi

          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.parse
          from pathlib import Path

          root = Path("live_out")
          secret = os.environ["DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY"].encode("utf-8")
          variants = {
              secret,
              urllib.parse.quote(secret.decode("utf-8"), safe="").encode("utf-8"),
              urllib.parse.quote_plus(secret.decode("utf-8"), safe="").encode("utf-8"),
          }
          leaked = False
          if root.exists():
              for path in root.rglob("*"):
                  if path.is_file():
                      data = path.read_bytes()
                      if any(value and value in data for value in variants):
                          leaked = True
                          break
          if leaked:
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              root.joinpath("exact-secret-scan.json").write_text(
                  json.dumps({
                      "artifact": "M3TOP3_FINANCE_CA_PAGE100_EXACT_SECRET_SCAN_v1.0",
                      "state": "BLOCKED_OUTPUT_REMOVED",
                      "matched_value_persisted": False,
                  }, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(86)
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("exact-secret-scan.json").write_text(
              json.dumps({
                  "artifact": "M3TOP3_FINANCE_CA_PAGE100_EXACT_SECRET_SCAN_v1.0",
                  "state": "PASS",
                  "matched_value_persisted": False,
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          scan_rc=$?
          set -e
          if [ "$scan_rc" -ne 0 ]; then
            exit "$scan_rc"
          fi
          if [ "$contract_rc" -ne 0 ]; then
            exit "$contract_rc"
          fi
          exit "$runner_rc"

      - name: Leak-scan and build sanitized evidence bundle
        if: always()
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          source = Path("live_out")
          target = Path("sanitized_out")
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True, exist_ok=True)
          allowed = {
              "preflight.json": "json",
              "aws-precheck.json": "json",
              "predecessor-readback.json": "json",
              "aws-readonly-diagnostic.json": "json",
              "github-readback.json": "json",
              "checkpoint.json": "json",
              "quota-ledger.jsonl": "jsonl",
              "raw-index.jsonl": "jsonl",
              "report.json": "json",
              "exact-secret-scan.json": "json",
          }
          ignored_zero_byte_locks = {
              ".checkpoint.json.lock",
              ".quota-ledger.jsonl.lock",
              ".raw-index.jsonl.lock",
              ".report.json.lock",
          }
          byte_patterns = (
              re.compile(br"serviceKey", re.IGNORECASE),
              re.compile(br"(?:X-Amz-Credential|X-Amz-Signature|X-Amz-Security-Token)", re.IGNORECASE),
              re.compile(br"Authorization\s*:", re.IGNORECASE),
              re.compile(br"(?:AKIA|ASIA)[A-Z0-9]{16}"),
              re.compile(br"https?://[^\s\"']*[?&](?:serviceKey|X-Amz-[A-Za-z]+)=", re.IGNORECASE),
              re.compile(br"DATA_GO_KR_(?:FINANCE|KSD)", re.IGNORECASE),
              re.compile(br"M3TOP3-KSD", re.IGNORECASE),
          )
          prohibited_key_fragments = (
              "servicekey", "credential_value", "credential_hash", "credential_prefix",
              "authenticated_url", "request_headers", "authorization_header",
              "secret_value", "aws_access_key", "aws_secret", "aws_session_token",
          )

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise ValueError("DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def inspect(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {"authenticated_url_persisted", "secret_persisted"}:
                          if child is not False:
                              raise ValueError("PERSISTENCE_NEGATIVE_EVIDENCE_MUST_BE_FALSE")
                          continue
                      folded = str(key).replace("_", "").lower()
                      if any(fragment.replace("_", "") in folded for fragment in prohibited_key_fragments):
                          raise ValueError("PROHIBITED_OUTPUT_FIELD")
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str):
                  if value == "KSD":
                      raise ValueError("KSD_OUTPUT_VALUE_PROHIBITED")
                  encoded = value.encode("utf-8")
                  if any(pattern.search(encoded) for pattern in byte_patterns):
                      raise ValueError("PROHIBITED_OUTPUT_VALUE")

          state = "PASS"
          copied = []
          try:
              if source.exists():
                  ignored = [
                      path for path in source.rglob("*")
                      if path.is_file() and path.name in ignored_zero_byte_locks
                  ]
                  if any(path.stat().st_size != 0 for path in ignored):
                      raise ValueError("NONEMPTY_LOCK_FILE")
                  unexpected = [
                      path for path in source.rglob("*")
                      if path.is_file()
                      and path.name not in allowed
                      and path.name not in ignored_zero_byte_locks
                  ]
                  if unexpected:
                      raise ValueError("UNEXPECTED_OUTPUT_FILE")
                  for name, kind in allowed.items():
                      path = source / name
                      if not path.exists():
                          continue
                      data = path.read_bytes()
                      if len(data) > 25_000_000:
                          raise ValueError("OUTPUT_FILE_TOO_LARGE")
                      if any(pattern.search(data) for pattern in byte_patterns):
                          raise ValueError("PROHIBITED_OUTPUT_BYTES")
                      rows = []
                      if kind == "json":
                          rows = [json.loads(data.decode("utf-8"), object_pairs_hook=pairs)]
                      else:
                          for line in data.decode("utf-8").splitlines():
                              if line.strip():
                                  rows.append(json.loads(line, object_pairs_hook=pairs))
                      if name == "quota-ledger.jsonl":
                          if any(row.get("provider") not in {"FINANCE", "KSD"} for row in rows):
                              raise ValueError("UNKNOWN_QUOTA_PROVIDER")
                          rows = [row for row in rows if row.get("provider") == "FINANCE"]
                      for row in rows:
                          inspect(row)
                      rendered = "".join(
                          json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"
                          for row in rows
                      )
                      target.joinpath(name).write_text(rendered, encoding="utf-8")
                      copied.append(name)
          except Exception:
              state = "BLOCKED_UNSAFE_OR_MALFORMED_OUTPUT_NOT_COPIED"
              shutil.rmtree(target, ignore_errors=True)
              target.mkdir(parents=True, exist_ok=True)
              copied = []

          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_PAGE100_SANITIZED_BUNDLE_RECEIPT_v1.0",
              "state": state,
              "copied_files": sorted(copied),
              "raw_entities_in_actions_artifact": 0,
              "secret_values_persisted": False,
              "authenticated_urls_persisted": False,
              "ksd_material_present": False,
          }
          target.joinpath("sanitization-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          if state != "PASS":
              raise SystemExit(87)
          PY

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3top3-finance-page100-bounded-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: sanitized_out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
