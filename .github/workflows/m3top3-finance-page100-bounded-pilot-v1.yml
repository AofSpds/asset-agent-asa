name: M3Top3 Finance Page100 Bounded Pilot v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_LATCH_v1.0.json

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  # Deliberately shared with the predecessor Finance writer so the two
  # workflows cannot execute concurrently even if the retired latch moves.
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

jobs:
  finance-page100-bounded-pilot:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      (github.event.head_commit.message == 'Arm M3Top3 Finance page100 precheck v1.0' ||
       github.event.head_commit.message == 'Arm M3Top3 Finance page100 bounded live pilot v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: m3top3-source-admission
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      AWS_PAGER: ""
      FINANCE_SELF_DEADLINE_SECONDS: "19800"
      FINANCE_LATCH_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_LATCH_v1.0.json
      FINANCE_AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_AUTHORITY_v1.0.json
      FINANCE_PLAN_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_PLAN_v1.0.json
      FINANCE_CHECKPOINT_SEED_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_CHECKPOINT_SEED_v1.0.json
      FINANCE_BASELINE_QUOTA_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_QUOTA_LEDGER_v1.0.jsonl
      FINANCE_BASELINE_RAW_INDEX_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_RAW_CUSTODY_INDEX_v1.0.jsonl
      FINANCE_PREDECESSOR_CHECKPOINT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_ACQUISITION_CHECKPOINT_v1.0.json
      FINANCE_PREDECESSOR_REPORT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_REPORT_v1.0.json
      FINANCE_PREDECESSOR_RUN_RECEIPT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_RUN_RECEIPT_33195472310_v1.0.json
      FINANCE_RUNNER_PATH: tools/m3top3/finance_page100_pilot.py
      FINANCE_SOURCE_ADMISSION_PATH: tools/m3top3/source_admission.py
      FINANCE_WORKFLOW_PATH: .github/workflows/m3top3-finance-page100-bounded-pilot-v1.yml

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail-closed authority and latch preflight
        id: preflight
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ROLE_ARN: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          EXPECTED_REPOSITORY = "AofSpds/asset-agent-asa"
          EXPECTED_ACTOR = "AofSpds"
