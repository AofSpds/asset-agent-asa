          versioning = aws_json(
              "s3api", "get-bucket-versioning", "--bucket", BUCKET,
              "--expected-bucket-owner", OWNER,
          )
          require(versioning.get("Status") == "Enabled", "AWS_BUCKET_VERSIONING_NOT_ENABLED")

