              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(commit_count == "1", "ARM_PUSH_MUST_BE_EXACTLY_ONE_COMMIT")
          parent = subprocess.run(
              ["git", "rev-parse", after + "^"],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(parent == before, "ARM_COMMIT_PARENT_MUST_EQUAL_EVENT_BEFORE")
          after_parents = subprocess.run(
              ["git", "rev-list", "--parents", "-n", "1", after],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.split()
          require(after_parents == [after, before], "ARM_COMMIT_MUST_HAVE_EXACTLY_ONE_PARENT")
          changed = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", before, after],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()
          require(changed == [str(LATCH_PATH)], "PUSH_MUST_CHANGE_EXACTLY_LATCH_PATH")
          name_status = subprocess.run(
              ["git", "diff", "--name-status", "--no-renames", before, after],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.splitlines()
          require(name_status == ["M\t" + str(LATCH_PATH)], "LATCH_MUST_PREEXIST_AND_BE_MODIFIED_ONLY")

          for path in (
              LATCH_PATH, AUTHORITY_PATH, PLAN_PATH, CHECKPOINT_PATH,
              BASELINE_QUOTA_PATH, BASELINE_RAW_INDEX_PATH,
              PREDECESSOR_CHECKPOINT_PATH, PREDECESSOR_REPORT_PATH,
              PREDECESSOR_RUN_RECEIPT_PATH, RUNNER_PATH,
              SOURCE_ADMISSION_PATH, WORKFLOW_PATH,
              REMEDIATION_RECEIPT_PATH, EFFECTIVE_WRITER_POLICY_PATH, MAX_SESSION_RECEIPT_PATH,
          ):
              require(path.is_file(), "REQUIRED_FILE_MISSING:" + str(path))

          latch = strict_json(LATCH_PATH)
          mode = latch.get("mode")
          require(mode in {"PRECHECK_ARMED", "LIVE_ARMED"}, "LATCH_NOT_ARMED")
          require(latch.get("state") == "ARMED", "LATCH_STATE_NOT_ARMED")
          activation = latch.get("activation_modes", {}).get(mode, {})
