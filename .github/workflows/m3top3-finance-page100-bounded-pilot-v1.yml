          def run_aws(*args, check=True):
              completed = subprocess.run(
                  ["aws", *args],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if check and completed.returncode != 0:
                  Path("live_out").mkdir(parents=True, exist_ok=True)
                  Path("live_out/aws-readonly-diagnostic.json").write_text(
                      json.dumps({
                          "artifact": "M3TOP3_FINANCE_CA_PAGE100_AWS_READONLY_DIAGNOSTIC_v1.0",
