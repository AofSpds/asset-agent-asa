              return subprocess.run(
                  ["aws", *args],
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )

          def aws_json(*args):
              completed = run_aws(*args, "--output", "json")
              try:
                  return json.loads(completed.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("AWS_CLI_INVALID_JSON") from None

          def require(condition, code):
              if not condition:
                  raise SystemExit(code)

          require(os.environ["CONTROL_PREFIX"] == EXPECTED_CONTROL_PREFIX, "AWS_CONTROL_PREFIX_MISMATCH")
          require(os.environ["RAW_WRITE_PREFIX"] == EXPECTED_RAW_WRITE_PREFIX, "AWS_RAW_WRITE_PREFIX_MISMATCH")
          require(os.environ["WRITER_CLAIM_KEY"] == EXPECTED_WRITER_CLAIM_KEY, "AWS_WRITER_CLAIM_KEY_MISMATCH")

          model = aws_json("s3api", "put-object", "--generate-cli-skeleton", "input")
