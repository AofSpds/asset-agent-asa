name: M3Top3 Finance Page100 Bounded Pilot v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_LATCH_v1.0.json

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  # Deliberately shared with the predecessor Finance writer so the two
  # workflows cannot execute concurrently even if the retired latch moves.
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

jobs:
  finance-page100-bounded-pilot:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      (github.event.head_commit.message == 'Arm M3Top3 Finance page100 G6 precheck 20260829221500 v1.0' ||
       github.event.head_commit.message == 'Arm M3Top3 Finance page100 G6 bounded live pilot 20260829221500 v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: m3top3-source-admission
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      AWS_PAGER: ""
      FINANCE_SELF_DEADLINE_SECONDS: "18000"
      FINANCE_LIVE_NOT_AFTER_UTC: "2026-08-30T14:30:00Z"
      FINANCE_LATCH_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_LATCH_v1.0.json
      FINANCE_AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_PILOT_AUTHORITY_v1.0.json
