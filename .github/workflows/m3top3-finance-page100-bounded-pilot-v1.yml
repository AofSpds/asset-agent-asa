                  "objects": readbacks,
                  "object_count": 9,
                  "raw_entity_bytes": 40423,
                  "raw_entities_in_actions_artifact": 0,
                  "provider_api_network_attempts": 0,
                  "quota_reservations": 0,
                  "remote_raw_custody_writes": 0,
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          preflight_path = Path("live_out/preflight.json")
          preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
          preflight.update({
              "predecessor_object_readbacks": 9,
              "predecessor_raw_entity_bytes": 40423,
