              raise SystemExit("GLOBAL_WRITER_CLAIM_ABSENCE_NOT_PROVABLE")

          readbacks = []
          with tempfile.TemporaryDirectory(prefix="finance-predecessor-readback-") as temp_dir:
              temp_root = Path(temp_dir)
              for index, (bas_dt, page_no, key, version_id, expected_bytes, expected_sha, expected_etag) in enumerate(PREDECESSOR_OBJECTS, 1):
                  head = aws_json(
                      "s3api", "head-object", "--bucket", BUCKET, "--key", key,
