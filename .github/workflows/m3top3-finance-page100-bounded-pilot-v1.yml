              require(claim_response.get("ETag") == PREDECESSOR_CLAIM["etag"], "PREDECESSOR_EXECUTION_CLAIM_ETAG_MISMATCH")
              require(claim_response.get("ServerSideEncryption") == "AES256", "PREDECESSOR_EXECUTION_CLAIM_ENCRYPTION_MISMATCH")
              claim_payload = json.loads(claim_bytes)
              require(claim_payload.get("writer_id") == PREDECESSOR_CLAIM["writer_id"], "PREDECESSOR_EXECUTION_CLAIM_WRITER_MISMATCH")

          require(len(readbacks) == 9, "PREDECESSOR_READBACK_COUNT_MISMATCH")
          require(sum(item["entity_bytes"] for item in readbacks) == 40423, "PREDECESSOR_READBACK_TOTAL_BYTES_MISMATCH")
          expected_slots = [("20240102", page) for page in range(1, 9)] + [("20240131", 1)]
