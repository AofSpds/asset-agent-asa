          if os.environ.get("EXPECTED_TRIGGERING_ACTOR") != ACTOR:
              raise SystemExit("GITHUB_TRIGGERING_ACTOR_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REPOSITORY") != REPOSITORY:
              raise SystemExit("GITHUB_REPOSITORY_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REF") != REF:
              raise SystemExit("GITHUB_REF_RECHECK_MISMATCH")
          expected_sha = os.environ.get("EXPECTED_SHA", "")
          expected_run_id = int(os.environ.get("EXPECTED_RUN_ID", "0"))
          expected_run_attempt = int(os.environ.get("EXPECTED_RUN_ATTEMPT", "0"))
          if expected_run_attempt != 1:
              raise SystemExit("WORKFLOW_RERUN_PROHIBITED")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise SystemExit("GITHUB_API_DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def get_json(path):
              if not path.startswith("/repos/AofSpds/asset-agent-asa/"):
                  raise SystemExit("GITHUB_API_PATH_OUT_OF_SCOPE")
              request = urllib.request.Request(
                  API_ROOT + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "AAA-M3Top3-Finance-Page100-Readback/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      if int(response.status) != 200:
                          raise SystemExit("GITHUB_API_NON_200")
                      data = response.read(10_000_001)
              except urllib.error.HTTPError as exc:
                  raise SystemExit("GITHUB_API_HTTP_" + str(exc.code)) from None
              except (urllib.error.URLError, TimeoutError, OSError):
                  raise SystemExit("GITHUB_API_TRANSPORT_BLOCKED") from None
              if len(data) > 10_000_000:
                  raise SystemExit("GITHUB_API_RESPONSE_TOO_LARGE")
              try:
                  return json.loads(data, object_pairs_hook=pairs)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("GITHUB_API_INVALID_JSON") from None

          encoded_branch = urllib.parse.quote(BRANCH, safe="")
          branch = get_json("/repos/" + REPOSITORY + "/branches/" + encoded_branch)
          if branch.get("name") != BRANCH or branch.get("commit", {}).get("sha") != expected_sha:
              raise SystemExit("CURRENT_BRANCH_HEAD_NOT_GITHUB_SHA")

          # Discover checked-in Finance/S3 writers and include known legacy
          # writers even if their content changes on another branch.
          finance_writer_paths = {
              WORKFLOW_PATH,
              PREDECESSOR_WORKFLOW_PATH,
              ".github/workflows/m3top3-s3-raw-custody-single-canary-v1.yml",
          }
          workflow_root = Path(".github/workflows")
          if workflow_root.is_dir():
              for candidate in tuple(workflow_root.glob("*.yml")) + tuple(workflow_root.glob("*.yaml")):
                  body = candidate.read_text(encoding="utf-8", errors="strict")
                  folded = body.lower()
                  if (
                      "m3top3-finance-stock-rights-v1" in folded
                      and (
                          "s3:putobject" in folded
                          or "put-object" in folded
                          or "finance_live_pilot" in folded
                          or "finance_page100_pilot" in folded
                      )
                  ):
                      finance_writer_paths.add(candidate.as_posix())

          active_by_id = {}
          for status in ACTIVE_STATES:
              page = 1
              observed = 0
              expected_total = None
              while True:
                  query = urllib.parse.urlencode({
                      "status": status,
                      "per_page": 100,
                      "page": page,
                  })
                  payload = get_json("/repos/" + REPOSITORY + "/actions/runs?" + query)
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUNS_INVALID")
                  if expected_total is None:
                      expected_total = int(payload.get("total_count", 0))
                  observed += len(runs)
                  for run in runs:
                      run_id = int(run.get("id", 0))
                      if run_id <= 0:
                          raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUN_ID_INVALID")
                      active_by_id[run_id] = run
                  if len(runs) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise SystemExit("GITHUB_ACTIVE_WORKFLOW_PAGINATION_LIMIT")
              if observed < int(expected_total or 0):
                  raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUNS_INCOMPLETE")

          active_finance_writers = [
              run for run in active_by_id.values()
              if str(run.get("path", "")) in finance_writer_paths
              or "m3top3-finance" in str(run.get("path", "")).lower()
              or "m3top3-s3-raw-custody" in str(run.get("path", "")).lower()
          ]
          if len(active_finance_writers) != 1:
              raise SystemExit("COMPETING_OR_MISSING_REPOSITORY_FINANCE_WRITER")
          current = active_finance_writers[0]
          if int(current.get("id", 0)) != expected_run_id:
              raise SystemExit("CURRENT_FINANCE_WRITER_NOT_SOLE_ACTIVE_WRITER")
          if current.get("path") != WORKFLOW_PATH:
              raise SystemExit("CURRENT_WORKFLOW_PATH_MISMATCH")
          if current.get("head_sha") != expected_sha or current.get("event") != "push":
              raise SystemExit("CURRENT_WORKFLOW_RUN_IDENTITY_MISMATCH")
          if int(current.get("run_attempt", 0)) != 1:
              raise SystemExit("CURRENT_WORKFLOW_RUN_ATTEMPT_MISMATCH")
          if current.get("actor", {}).get("login") != ACTOR:
              raise SystemExit("CURRENT_WORKFLOW_RUN_ACTOR_MISMATCH")
          if current.get("triggering_actor", {}).get("login") != ACTOR:
              raise SystemExit("CURRENT_WORKFLOW_RUN_TRIGGERING_ACTOR_MISMATCH")
          if current.get("repository", {}).get("full_name") != REPOSITORY:
              raise SystemExit("CURRENT_WORKFLOW_RUN_REPOSITORY_MISMATCH")

          predecessor = get_json(
              "/repos/" + REPOSITORY + "/actions/runs/" + str(PREDECESSOR_RUN_ID)
          )
          if (
              predecessor.get("status") != "completed"
              or predecessor.get("conclusion") != "failure"
              or predecessor.get("event") != "push"
              or predecessor.get("path") != PREDECESSOR_WORKFLOW_PATH
              or predecessor.get("head_sha") != PREDECESSOR_HEAD_SHA
              or int(predecessor.get("run_attempt", 0)) != 1
          ):
              raise SystemExit("PREDECESSOR_RUN_TERMINAL_IDENTITY_MISMATCH")
          predecessor_jobs = get_json(
              "/repos/" + REPOSITORY + "/actions/runs/" + str(PREDECESSOR_RUN_ID)
              + "/jobs?filter=all&per_page=100"
          )
          jobs = predecessor_jobs.get("jobs", [])
          if not isinstance(jobs, list) or not any(
              int(job.get("id", 0)) == PREDECESSOR_JOB_ID for job in jobs
          ):
              raise SystemExit("PREDECESSOR_JOB_TERMINAL_IDENTITY_MISMATCH")

          precheck_verified = False
          precheck_run_id = None
          precheck_artifact_id = None
          if os.environ["PILOT_MODE"] == "LIVE_ARMED":
              precheck_run_id = int(os.environ.get("PRECHECK_RUN_ID", "0"))
              precheck_head_sha = os.environ.get("PRECHECK_HEAD_SHA", "")
              precheck_artifact_id = int(os.environ.get("PRECHECK_ARTIFACT_ID", "0"))
              precheck_digest = os.environ.get("PRECHECK_ARTIFACT_DIGEST_SHA256", "")
              prior = get_json(
                  "/repos/" + REPOSITORY + "/actions/runs/" + str(precheck_run_id)
              )
              if (
                  prior.get("status") != "completed"
                  or prior.get("conclusion") != "success"
                  or prior.get("event") != "push"
                  or prior.get("path") != WORKFLOW_PATH
                  or prior.get("head_sha") != precheck_head_sha
                  or int(prior.get("run_attempt", 0)) != 1
                  or prior.get("actor", {}).get("login") != ACTOR
                  or prior.get("triggering_actor", {}).get("login") != ACTOR
                  or prior.get("head_commit", {}).get("message")
                     != "Arm M3Top3 Finance page100 precheck v1.0"
              ):
                  raise SystemExit("FRESH_PRECHECK_WORKFLOW_RUN_MISMATCH")
              artifacts = get_json(
                  "/repos/" + REPOSITORY + "/actions/runs/" + str(precheck_run_id)
                  + "/artifacts?per_page=100"
              )
              candidates = [
                  item for item in artifacts.get("artifacts", [])
                  if int(item.get("id", 0)) == precheck_artifact_id
              ]
              if len(candidates) != 1:
                  raise SystemExit("FRESH_PRECHECK_ARTIFACT_ID_MISMATCH")
              artifact = candidates[0]
              if (
                  artifact.get("name")
                  != "m3top3-finance-page100-bounded-pilot-"
                     + str(precheck_run_id) + "-1"
                  or artifact.get("expired") is not False
                  or artifact.get("digest") != "sha256:" + precheck_digest
                  or int(artifact.get("workflow_run", {}).get("id", 0))
                     != precheck_run_id
              ):
                  raise SystemExit("FRESH_PRECHECK_ARTIFACT_BINDING_MISMATCH")
              precheck_verified = True

          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_PAGE100_GITHUB_READBACK_v1.0",
              "state": "PASS_BRANCH_PREDECESSOR_AND_REPOSITORY_WIDE_SOLE_FINANCE_WRITER",
              "mode": os.environ["PILOT_MODE"],
              "repository": REPOSITORY,
              "actor": ACTOR,
              "triggering_actor": ACTOR,
              "branch": BRANCH,
              "head_sha": expected_sha,
              "workflow_run_id": expected_run_id,
              "workflow_run_attempt": 1,
              "active_repository_run_count": len(active_by_id),
              "active_finance_writer_count": 1,
              "finance_writer_paths_checked": sorted(finance_writer_paths),
              "predecessor_workflow_run_id": PREDECESSOR_RUN_ID,
              "predecessor_workflow_job_id": PREDECESSOR_JOB_ID,
              "predecessor_terminal_state": "COMPLETED_FAILURE_ATTEMPT_1_DO_NOT_RERUN",
              "fresh_precheck_verified": precheck_verified,
              "fresh_precheck_run_id": precheck_run_id,
              "fresh_precheck_artifact_id": precheck_artifact_id,
              "github_token_logged": False,
              "github_token_persisted": False,
              "provider_api_network_attempts": 0,
              "quota_reservations": 0,
              "remote_raw_custody_writes": 0,
          }
          Path("live_out/github-readback.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute Finance-only bounded live pilot once
        if: steps.preflight.outputs.mode == 'LIVE_ARMED'
        shell: bash
        env:
          DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY: ${{ secrets.DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY }}
