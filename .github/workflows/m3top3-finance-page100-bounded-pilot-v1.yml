                  require(len(data) == expected_bytes, "PREDECESSOR_GET_BYTES_MISMATCH")
                  require(actual_sha == expected_sha, "PREDECESSOR_GET_DIGEST_MISMATCH")
                  require(response.get("VersionId") == version_id, "PREDECESSOR_GET_VERSION_MISMATCH")
                  require(response.get("ETag") == expected_etag, "PREDECESSOR_GET_ETAG_MISMATCH")
                  require(response.get("ServerSideEncryption") == "AES256", "PREDECESSOR_GET_ENCRYPTION_MISMATCH")
