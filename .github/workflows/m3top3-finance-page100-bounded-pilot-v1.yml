          EXPECTED_BRANCH = "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828"
          EXPECTED_RUNTIME = "PMO-FINANCE-PAGE100-20260829041623"
          EXPECTED_RUN_ID = "FINANCE-PAGE100-PILOT-20260829041623"
          EXPECTED_TOKEN_HASH = "763c3e1a57f270efcec8ca9be1ee2565a131bf0e4501343e68670fd7f5d32d0d"
          EXPECTED_OWNER_SPEC = "9e972a94e24c1a20213fd42e04e6daa895e3afd8179f093fdf8a9f904f870444"
          EXPECTED_PREDECESSOR_HEAD = "31d1bc2a23b97c34adb851ab73394145994ddb6e"
          EXPECTED_PREDECESSOR_TREE = "172f65ce29b565792cc64519a3c5d431028ec537"
          EXPECTED_PREDECESSOR_RUN_ID = 33195472310
          EXPECTED_PREDECESSOR_JOB_ID = 98931365000
          EXPECTED_PREDECESSOR_RUNTIME = "PMO-API-SRC-ADMIT-20260828192737"
          EXPECTED_PREDECESSOR_PILOT = "FINANCE-LIVE-PILOT-20260828192737"
          EXPECTED_QUOTA_DAY_KST = "2026-08-29"
          EXPECTED_PREDECESSOR_QUOTA_ORDINAL_BASE = 9
          EXPECTED_DATE_HASH = "920b118d7d7abaa10f69e93169698ed380db7162ac3c5024756a07702a7065f6"
          EXPECTED_DATES = (
              "20240102", "20240131", "20240329", "20240628", "20240808",
              "20240809", "20240812", "20240930", "20241231", "20250115",
              "20250331", "20250630", "20251231", "20260115", "20260331",
              "20260630", "20260814",
          )
          EXPECTED_PREDECESSOR_OBJECTS = (
              ("20240102", 1, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=d33797605e0c26ae522952cc4bb30c08b6e5df664c6fb0dc0ad1fcdb03ddcd08/attempt=1/sha256=9ae1972c806552eea241e1f9fdff1beb5640ead731a9afd907974af4c8937e86.entity", "DSSDileXVAbVA_5qGyIhY9HyeNMEjKz6", 4609, "9ae1972c806552eea241e1f9fdff1beb5640ead731a9afd907974af4c8937e86", "\"ccb4606be66bec50fc83b435c63ed578\""),
              ("20240102", 2, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=70dcfbd8ee61944a5d1d89ba154ced3c359f6371ae45cc0599a9358790cfd0b0/attempt=1/sha256=bc6941e170dd478d2a82c6902a1d4bcbf7279c165fa5691b37cf96bbcc2557dd.entity", "eojCYd2M1CRuDYUAmH3YCf5m1ZF.DXdE", 4623, "bc6941e170dd478d2a82c6902a1d4bcbf7279c165fa5691b37cf96bbcc2557dd", "\"68f8089d91b129e97c6752b5139f8c44\""),
              ("20240102", 3, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=0a8280b1911b1757fafb8a2e015d7d93ac08dfe38537ec3edcca5a09a89b505a/attempt=1/sha256=a650aab45904c982a126ee5a66035e3e7f8f5d26494729ec216d2e7313c5fcdc.entity", "rj8.2G7po2sIniQuahEY7zT.U3.ohWso", 4887, "a650aab45904c982a126ee5a66035e3e7f8f5d26494729ec216d2e7313c5fcdc", "\"23840a521a3a902056aac06dc0edfe98\""),
              ("20240102", 4, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=136967392bd657b047e6518d69c8a35b190897df03ba73231d907fe3a257aa1e/attempt=1/sha256=c72ab1b18be543b257091690855e47555f0794da36bfa126b6826ce74c1183ab.entity", "G2QrD9tI8Qa9SbktghJ9KYg4c1AU28As", 4761, "c72ab1b18be543b257091690855e47555f0794da36bfa126b6826ce74c1183ab", "\"f6ea8a6739d5d665f307bb0d19493825\""),
              ("20240102", 5, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=bcf0ad2e685b75c6696482084c45e962ee858f7c0b0cca6a8781abd58581a348/attempt=1/sha256=d7b8d94452393a2c6d65b32f9f3286e2e64f910671984c73a637a35594d89891.entity", "HSVA_3fPluU4qmtqlU7qN.jbsZSBmtRY", 4738, "d7b8d94452393a2c6d65b32f9f3286e2e64f910671984c73a637a35594d89891", "\"64179218e7ad72f84f9787d73c2a77dc\""),
              ("20240102", 6, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=4954fa52697f075e90ef5650714b742ced08a2afd6cc2f8d685bdd7d51e77a54/attempt=1/sha256=9b808f879f548ba7d97fe612dee1800bdc800afb00a27d1b1c4111cdb2c1dceb.entity", "3LU73fHs2z3YvCqJCTAWqGiMWGw5XzaM", 4720, "9b808f879f548ba7d97fe612dee1800bdc800afb00a27d1b1c4111cdb2c1dceb", "\"23b283034f5deec1e34d272d0ae88914\""),
              ("20240102", 7, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=22e0eb5b6f2d4c989028bbd780169c8cc4315a3b32e9ebe71b4b953e248da599/attempt=1/sha256=e439958f7339b5749d83e2d6944c1ae96def5610e4c3e1a3c52ad79d3c04f0a3.entity", "phrNPpMB1GDv.ZYdbO3Ez8yWmmN6_yi6", 4629, "e439958f7339b5749d83e2d6944c1ae96def5610e4c3e1a3c52ad79d3c04f0a3", "\"b8bc81831802c6ad225331d0f0b69b2a\""),
              ("20240102", 8, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=859ad56eadad1d5ef356ce16c45381898b232f71e5cd4d55531f00ef0fefabb5/attempt=1/sha256=4393f5565bb99b2a6a9b2914039b539a00571d72ab4ef3beb43258cfb91fe959.entity", "orAIUhf.yVs1whYuqyEoKak7BebuG3_U", 2814, "4393f5565bb99b2a6a9b2914039b539a00571d72ab4ef3beb43258cfb91fe959", "\"b709a91de0f03336fc20608eb765feec\""),
              ("20240131", 1, "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/getRighExerReasSche_V2/quota_day_kst=2026-08-29/request_id=2336abe1c81d4c86f90fef6575e204d0455367d4d5e8ed6cce103a752f0330da/attempt=1/sha256=2e97f391bcf833db568de2c8638c5ff6d297ea07be21efc3fca6d05cd266c309.entity", "avNHRa6z6kooy0MEG0rB3H2Ify2dWSjq", 4642, "2e97f391bcf833db568de2c8638c5ff6d297ea07be21efc3fca6d05cd266c309", "\"f53c31679b7985d17c59e9bed7006f04\""),
          )
          LATCH_PATH = Path(os.environ["FINANCE_LATCH_PATH"])
          AUTHORITY_PATH = Path(os.environ["FINANCE_AUTHORITY_PATH"])
          PLAN_PATH = Path(os.environ["FINANCE_PLAN_PATH"])
          CHECKPOINT_PATH = Path(os.environ["FINANCE_CHECKPOINT_SEED_PATH"])
          BASELINE_QUOTA_PATH = Path(os.environ["FINANCE_BASELINE_QUOTA_PATH"])
          BASELINE_RAW_INDEX_PATH = Path(os.environ["FINANCE_BASELINE_RAW_INDEX_PATH"])
          PREDECESSOR_CHECKPOINT_PATH = Path(os.environ["FINANCE_PREDECESSOR_CHECKPOINT_PATH"])
          PREDECESSOR_REPORT_PATH = Path(os.environ["FINANCE_PREDECESSOR_REPORT_PATH"])
          PREDECESSOR_RUN_RECEIPT_PATH = Path(os.environ["FINANCE_PREDECESSOR_RUN_RECEIPT_PATH"])
          RUNNER_PATH = Path(os.environ["FINANCE_RUNNER_PATH"])
          SOURCE_ADMISSION_PATH = Path(os.environ["FINANCE_SOURCE_ADMISSION_PATH"])
          WORKFLOW_PATH = Path(os.environ["FINANCE_WORKFLOW_PATH"])
          ZERO_HASH = "0" * 64
          HEX64 = re.compile(r"^[0-9a-f]{64}$")

          class Blocked(RuntimeError):
              pass

          def require(condition, code):
              if not condition:
                  raise Blocked(code)

          def strict_json(path):
              def pairs(values):
                  result = {}
                  for key, value in values:
                      if key in result:
                          raise Blocked("DUPLICATE_JSON_KEY:" + str(path))
                      result[key] = value
                  return result
              try:
                  return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs)
              except Blocked:
                  raise
              except Exception as exc:
                  raise Blocked("INVALID_JSON:" + str(path)) from exc

          def strict_jsonl(path):
              rows = []
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      rows.append(json.loads(line, object_pairs_hook=lambda values: _strict_pairs(values, path, line_number)))
                  except Blocked:
                      raise
                  except Exception as exc:
                      raise Blocked("INVALID_JSONL:" + str(path) + ":" + str(line_number)) from exc
              return rows

          def _strict_pairs(values, path, line_number):
              result = {}
              for key, value in values:
                  if key in result:
                      raise Blocked("DUPLICATE_JSON_KEY:" + str(path) + ":" + str(line_number))
                  result[key] = value
              return result

          def sha256_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def terminal_sha256(path):
              # Workspace/bootstrap copies may contain one transport-added blank
              # line. Terminal evidence is bound to exactly one final newline.
              return hashlib.sha256(path.read_bytes().rstrip(b"\n") + b"\n").hexdigest()

          def canonical_sha256(value):
              payload = (json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ) + "\n").encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          require(os.environ.get("EVENT_REPOSITORY") == EXPECTED_REPOSITORY, "REPOSITORY_MISMATCH")
          require(os.environ.get("EVENT_ACTOR") == EXPECTED_ACTOR, "OWNER_ACTOR_MISMATCH")
          require(os.environ.get("EVENT_TRIGGERING_ACTOR") == EXPECTED_ACTOR, "OWNER_TRIGGERING_ACTOR_MISMATCH")
          require(os.environ.get("EVENT_REF") == EXPECTED_REF, "TASK_BRANCH_MISMATCH")
          require(os.environ.get("EVENT_FORCED", "false").lower() == "false", "FORCED_PUSH_PROHIBITED")
          require(os.environ.get("EVENT_RUN_ATTEMPT") == "1", "WORKFLOW_RERUN_PROHIBITED")
          require(bool(HEX64.fullmatch(EXPECTED_OWNER_SPEC)), "OWNER_SPEC_HASH_PLACEHOLDER_NOT_FINALIZED")

          before = os.environ.get("EVENT_BEFORE", "")
          after = os.environ.get("EVENT_AFTER", "")
          require(bool(re.fullmatch(r"[0-9a-f]{40}", before)), "INVALID_BEFORE_SHA")
          require(bool(re.fullmatch(r"[0-9a-f]{40}", after)), "INVALID_AFTER_SHA")
          require(before != "0" * 40, "NEW_BRANCH_PUSH_PROHIBITED")
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(head == after and os.environ.get("GITHUB_SHA") == after, "CHECKED_OUT_HEAD_EVENT_AFTER_MISMATCH")
          commit_count = subprocess.run(
              ["git", "rev-list", "--count", before + ".." + after],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(commit_count == "1", "ARM_PUSH_MUST_BE_EXACTLY_ONE_COMMIT")
          parent = subprocess.run(
              ["git", "rev-parse", after + "^"],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(parent == before, "ARM_COMMIT_PARENT_MUST_EQUAL_EVENT_BEFORE")
          changed = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", before, after],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()
          require(changed == [str(LATCH_PATH)], "PUSH_MUST_CHANGE_EXACTLY_LATCH_PATH")
          name_status = subprocess.run(
              ["git", "diff", "--name-status", "--no-renames", before, after],
              check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.splitlines()
          require(name_status == ["M\t" + str(LATCH_PATH)], "LATCH_MUST_PREEXIST_AND_BE_MODIFIED_ONLY")

          for path in (
              LATCH_PATH, AUTHORITY_PATH, PLAN_PATH, CHECKPOINT_PATH,
              BASELINE_QUOTA_PATH, BASELINE_RAW_INDEX_PATH,
              PREDECESSOR_CHECKPOINT_PATH, PREDECESSOR_REPORT_PATH,
              PREDECESSOR_RUN_RECEIPT_PATH, RUNNER_PATH,
              SOURCE_ADMISSION_PATH, WORKFLOW_PATH,
          ):
              require(path.is_file(), "REQUIRED_FILE_MISSING:" + str(path))

          latch = strict_json(LATCH_PATH)
          mode = latch.get("mode")
          require(mode in {"PRECHECK_ARMED", "LIVE_ARMED"}, "LATCH_NOT_ARMED")
          require(latch.get("state") == "ARMED", "LATCH_STATE_NOT_ARMED")
          activation = latch.get("activation_modes", {}).get(mode, {})
          expected_message = activation.get("exact_commit_message")
          require(expected_message in {
              "Arm M3Top3 Finance page100 precheck v1.0",
              "Arm M3Top3 Finance page100 bounded live pilot v1.0",
          }, "UNKNOWN_ACTIVATION_MESSAGE")
          require(os.environ.get("EVENT_HEAD_MESSAGE") == expected_message, "ACTIVATION_MESSAGE_MISMATCH")
          require(latch.get("activation_commit_message") == expected_message, "LATCH_MESSAGE_MISMATCH")
          require(latch.get("repository") == EXPECTED_REPOSITORY, "LATCH_REPOSITORY_MISMATCH")
          require(latch.get("owner_actor") == EXPECTED_ACTOR, "LATCH_ACTOR_MISMATCH")
          require(latch.get("branch") == EXPECTED_BRANCH, "LATCH_BRANCH_MISMATCH")
          require(latch.get("runtime_lock_id") == EXPECTED_RUNTIME, "LATCH_RUNTIME_MISMATCH")
          require(latch.get("pilot_run_id") == EXPECTED_RUN_ID, "LATCH_RUN_ID_MISMATCH")
          require(latch.get("execution_token_sha256") == EXPECTED_TOKEN_HASH, "EXECUTION_TOKEN_HASH_MISMATCH")
          require(latch.get("owner_cap_spec_sha256") == EXPECTED_OWNER_SPEC, "OWNER_SPEC_HASH_MISMATCH")
          preparation = latch.get("preparation_commit", {})
          preparation_tree = subprocess.run(
              ["git", "rev-parse", before + "^{tree}"], check=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          preparation_parent = subprocess.run(
              ["git", "rev-parse", before + "^"], check=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(preparation.get("head_sha") == before, "PREPARATION_HEAD_BINDING_MISMATCH")
          require(preparation.get("tree_sha") == preparation_tree, "PREPARATION_TREE_BINDING_MISMATCH")
          require(preparation.get("parent_sha") == preparation_parent, "PREPARATION_PARENT_BINDING_MISMATCH")
          bindings = latch.get("authority_bindings", {})
          require(bindings.get("bindings_finalized") is True, "HASH_BINDINGS_NOT_FINALIZED")
          predecessor = latch.get("predecessor_terminal", {})
          require(predecessor.get("head_sha") == EXPECTED_PREDECESSOR_HEAD, "PREDECESSOR_HEAD_BINDING_MISMATCH")
          require(predecessor.get("tree_sha") == EXPECTED_PREDECESSOR_TREE, "PREDECESSOR_TREE_BINDING_MISMATCH")
          require(predecessor.get("workflow_run_id") == EXPECTED_PREDECESSOR_RUN_ID, "PREDECESSOR_RUN_BINDING_MISMATCH")
          require(predecessor.get("workflow_job_id") == EXPECTED_PREDECESSOR_JOB_ID, "PREDECESSOR_JOB_BINDING_MISMATCH")
          require(predecessor.get("do_not_rerun") is True, "PREDECESSOR_DO_NOT_RERUN_BINDING_MISSING")
          if mode == "PRECHECK_ARMED":
              require(preparation_parent == EXPECTED_PREDECESSOR_HEAD, "PRECHECK_PREPARATION_PARENT_MISMATCH")
              require(activation.get("provider_api_calls_authorized") is False, "PRECHECK_PROVIDER_CALL_MUST_BE_FALSE")
              require(activation.get("remote_raw_custody_writes_authorized") is False, "PRECHECK_REMOTE_WRITE_MUST_BE_FALSE")
          else:
              require(activation.get("provider_api_calls_authorized") is True, "LIVE_PROVIDER_CALL_AUTHORITY_MISMATCH")
              require(activation.get("remote_raw_custody_writes_authorized") is True, "LIVE_REMOTE_WRITE_AUTHORITY_MISMATCH")
              kst_day = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).date().isoformat()
              require(kst_day == EXPECTED_QUOTA_DAY_KST, "LIVE_QUOTA_DAY_KST_MISMATCH")
              fresh = latch.get("fresh_precheck_binding", {})
              require(fresh.get("state") == "PASS_FRESH_PRECHECK_ZERO_SIDE_EFFECT", "LIVE_FRESH_PRECHECK_PASS_BINDING_MISSING")
              require(fresh.get("runtime_lock_id") == EXPECTED_RUNTIME, "LIVE_PRECHECK_RUNTIME_MISMATCH")
              require(fresh.get("pilot_run_id") == EXPECTED_RUN_ID, "LIVE_PRECHECK_PILOT_MISMATCH")
              require(type(fresh.get("workflow_run_id")) is int and fresh.get("workflow_run_id") > 0, "LIVE_PRECHECK_RUN_ID_INVALID")
              require(type(fresh.get("artifact_id")) is int and fresh.get("artifact_id") > 0, "LIVE_PRECHECK_ARTIFACT_ID_INVALID")
