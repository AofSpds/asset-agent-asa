      FINANCE_BASELINE_RAW_INDEX_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_RAW_CUSTODY_INDEX_v1.0.jsonl
      FINANCE_PREDECESSOR_CHECKPOINT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_ACQUISITION_CHECKPOINT_v1.0.json
      FINANCE_PREDECESSOR_REPORT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_REPORT_v1.0.json
