          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source_pairs = (
              (Path(os.environ["FINANCE_BASELINE_QUOTA_PATH"]), Path("live_out/quota-ledger.jsonl")),
              (Path(os.environ["FINANCE_BASELINE_RAW_INDEX_PATH"]), Path("live_out/raw-index.jsonl")),
          )
          Path("live_out").mkdir(parents=True, exist_ok=True)
          for source, target in source_pairs:
              if not source.is_file() or target.exists():
                  raise SystemExit("GOVERNED_MIRROR_STAGING_BLOCKED")
              shutil.copyfile(source, target)
          PY

      - name: Reconfirm branch, fresh precheck, and repo-wide sole Finance writer
        if: >-
          steps.preflight.outputs.mode == 'PRECHECK_ARMED' ||
          steps.preflight.outputs.mode == 'LIVE_ARMED'
        shell: bash
        env:
          PILOT_MODE: ${{ steps.preflight.outputs.mode }}
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_ACTOR: ${{ github.actor }}
          EXPECTED_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRECHECK_RUN_ID: ${{ steps.preflight.outputs.precheck_run_id }}
          PRECHECK_HEAD_SHA: ${{ steps.preflight.outputs.precheck_head_sha }}
          PRECHECK_ARTIFACT_ID: ${{ steps.preflight.outputs.precheck_artifact_id }}
          PRECHECK_ARTIFACT_DIGEST_SHA256: ${{ steps.preflight.outputs.precheck_artifact_digest_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          REPOSITORY = "AofSpds/asset-agent-asa"
          ACTOR = "AofSpds"
          BRANCH = "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828"
          REF = "refs/heads/" + BRANCH
          WORKFLOW_PATH = ".github/workflows/m3top3-finance-page100-bounded-pilot-v1.yml"
          PREDECESSOR_WORKFLOW_PATH = ".github/workflows/m3top3-finance-bounded-live-pilot-v1.yml"
          PREDECESSOR_RUN_ID = 33195472310
          PREDECESSOR_JOB_ID = 98931365000
          PREDECESSOR_HEAD_SHA = "f0918e170a662867caf57ced28d68c82e79cdb0a"
          FAILED_RUN_ID = 33253477005
          FAILED_JOB_ID = 99103056660
          FAILED_HEAD_SHA = "ee7cd5f6f48c9f13ad43071b8c7c3648c9bdd1d0"
          FAILED_ARTIFACT_ID = 9715080560
          FAILED_ARTIFACT_DIGEST = "sha256:05853717a7b9af6f107bd8747a7c44a6fd817a5fd5b123059898d092fc639be4"
          FAILED_ARTIFACT_SIZE = 344
          G4_PRECHECK_RUN_ID = 33225643741
          G4_PRECHECK_JOB_ID = 99028755766
          G4_PRECHECK_HEAD_SHA = "784e9eea008b5eea57132e2e341a3c63982951cc"
          G4_PRECHECK_ARTIFACT_ID = 9706754794
          G4_PRECHECK_ARTIFACT_DIGEST = "sha256:b32f5fb3b94adeb7b6202af07700b6fdb9b80c828f31e55ddfe78a2de7296b24"
          G4_PRECHECK_ARTIFACT_SIZE = 5309
          API_ROOT = "https://api.github.com"
          ACTIVE_STATES = ("queued", "in_progress", "waiting", "requested", "pending")
          token = os.environ.get("GH_API_TOKEN", "")
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit("GITHUB_TOKEN_MISSING_OR_INVALID")
          if os.environ.get("EXPECTED_ACTOR") != ACTOR:
              raise SystemExit("GITHUB_ACTOR_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_TRIGGERING_ACTOR") != ACTOR:
              raise SystemExit("GITHUB_TRIGGERING_ACTOR_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REPOSITORY") != REPOSITORY:
              raise SystemExit("GITHUB_REPOSITORY_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REF") != REF:
              raise SystemExit("GITHUB_REF_RECHECK_MISMATCH")
          expected_sha = os.environ.get("EXPECTED_SHA", "")
          expected_run_id = int(os.environ.get("EXPECTED_RUN_ID", "0"))
          expected_run_attempt = int(os.environ.get("EXPECTED_RUN_ATTEMPT", "0"))
          if expected_run_attempt != 1:
              raise SystemExit("WORKFLOW_RERUN_PROHIBITED")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise SystemExit("GITHUB_API_DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def get_json(path):
              if not path.startswith("/repos/AofSpds/asset-agent-asa/"):
                  raise SystemExit("GITHUB_API_PATH_OUT_OF_SCOPE")
              request = urllib.request.Request(
                  API_ROOT + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "AAA-M3Top3-Finance-Page100-Readback/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      if int(response.status) != 200:
                          raise SystemExit("GITHUB_API_NON_200")
                      data = response.read(10_000_001)
              except urllib.error.HTTPError as exc:
                  raise SystemExit("GITHUB_API_HTTP_" + str(exc.code)) from None
              except (urllib.error.URLError, TimeoutError, OSError):
                  raise SystemExit("GITHUB_API_TRANSPORT_BLOCKED") from None
              if len(data) > 10_000_000:
                  raise SystemExit("GITHUB_API_RESPONSE_TOO_LARGE")
              try:
                  return json.loads(data, object_pairs_hook=pairs)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("GITHUB_API_INVALID_JSON") from None

          encoded_branch = urllib.parse.quote(BRANCH, safe="")
          branch = get_json("/repos/" + REPOSITORY + "/branches/" + encoded_branch)
          if branch.get("name") != BRANCH or branch.get("commit", {}).get("sha") != expected_sha:
              raise SystemExit("CURRENT_BRANCH_HEAD_NOT_GITHUB_SHA")

          # Discover checked-in Finance/S3 writers and include known legacy
          # writers even if their content changes on another branch.
          finance_writer_paths = {
              WORKFLOW_PATH,
              PREDECESSOR_WORKFLOW_PATH,
              ".github/workflows/m3top3-s3-raw-custody-single-canary-v1.yml",
          }
          workflow_root = Path(".github/workflows")
          if workflow_root.is_dir():
              for candidate in tuple(workflow_root.glob("*.yml")) + tuple(workflow_root.glob("*.yaml")):
                  body = candidate.read_text(encoding="utf-8", errors="strict")
                  folded = body.lower()
                  if (
                      "m3top3-finance-stock-rights-v1" in folded
                      and (
                          "s3:putobject" in folded
                          or "put-object" in folded
                          or "finance_live_pilot" in folded
                          or "finance_page100_pilot" in folded
                      )
                  ):
                      finance_writer_paths.add(candidate.as_posix())

          active_by_id = {}
          for status in ACTIVE_STATES:
              page = 1
              observed = 0
              expected_total = None
              while True:
                  query = urllib.parse.urlencode({
                      "status": status,
                      "per_page": 100,
                      "page": page,
                  })
                  payload = get_json("/repos/" + REPOSITORY + "/actions/runs?" + query)
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUNS_INVALID")
                  if expected_total is None:
                      expected_total = int(payload.get("total_count", 0))
                  observed += len(runs)
                  for run in runs:
                      run_id = int(run.get("id", 0))
                      if run_id <= 0:
                          raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUN_ID_INVALID")
                      active_by_id[run_id] = run
                  if len(runs) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise SystemExit("GITHUB_ACTIVE_WORKFLOW_PAGINATION_LIMIT")
              if observed < int(expected_total or 0):
