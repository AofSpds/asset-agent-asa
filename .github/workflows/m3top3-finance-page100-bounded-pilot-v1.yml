                  require(head.get("ETag") == expected_etag, "PREDECESSOR_ETAG_MISMATCH")
                  require(head.get("ServerSideEncryption") == "AES256", "PREDECESSOR_ENCRYPTION_MISMATCH")
                  target = temp_root / ("raw-" + str(index) + ".entity")
                  response = aws_json(
                      "s3api", "get-object", "--bucket", BUCKET, "--key", key,
                      "--version-id", version_id, "--expected-bucket-owner", OWNER,
                      str(target),
