name: M3Top3 Finance Bounded Live Pilot v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_LATCH_v1.0.json

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

jobs:
  finance-bounded-pilot:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      (github.event.head_commit.message == 'Arm M3Top3 Finance precheck v1.0' ||
       github.event.head_commit.message == 'Arm M3Top3 Finance bounded live pilot v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: m3top3-source-admission
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      AWS_PAGER: ""
      FINANCE_LATCH_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_LATCH_v1.0.json
      FINANCE_AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_SOURCE_ADMISSION_CONTRACT_v1.0.json
      FINANCE_PLAN_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_SOURCE_ADMISSION_PLAN_v1.0.json
      FINANCE_CHECKPOINT_SEED_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_ACQUISITION_CHECKPOINT_v1.0.json
      FINANCE_BASELINE_QUOTA_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_QUOTA_LEDGER_v1.0.jsonl
      FINANCE_BASELINE_RAW_INDEX_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_RAW_CUSTODY_INDEX_v1.0.jsonl
      FINANCE_RUNNER_PATH: tools/m3top3/finance_live_pilot.py
      FINANCE_SOURCE_ADMISSION_PATH: tools/m3top3/source_admission.py
      FINANCE_WORKFLOW_PATH: .github/workflows/m3top3-finance-bounded-live-pilot-v1.yml

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail-closed authority and latch preflight
        id: preflight
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ROLE_ARN: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          EXPECTED_REPOSITORY = "AofSpds/asset-agent-asa"
          EXPECTED_ACTOR = "AofSpds"
          EXPECTED_REF = "refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828"
          EXPECTED_BRANCH = "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828"
          EXPECTED_RUNTIME = "PMO-API-SRC-ADMIT-20260828192737"
          EXPECTED_RUN_ID = "FINANCE-LIVE-PILOT-20260828192737"
          EXPECTED_TOKEN_HASH = "9cda8bb429b3558e81e1ffcc4a232c78976c521186f13fbad5462c0312281f37"
          EXPECTED_OWNER_SPEC = "7b65152d8df10a6497d1656dbc5cc6d4bd253740f53a29480bb8d877b81b9f05"
          EXPECTED_DATE_HASH = "920b118d7d7abaa10f69e93169698ed380db7162ac3c5024756a07702a7065f6"
          EXPECTED_DATES = (
              "20240102", "20240131", "20240329", "20240628", "20240808",
              "20240809", "20240812", "20240930", "20241231", "20250115",
              "20250331", "20250630", "20251231", "20260115", "20260331",
              "20260630", "20260814",
          )
          LATCH_PATH = Path(os.environ["FINANCE_LATCH_PATH"])
          AUTHORITY_PATH = Path(os.environ["FINANCE_AUTHORITY_PATH"])
          PLAN_PATH = Path(os.environ["FINANCE_PLAN_PATH"])
          CHECKPOINT_PATH = Path(os.environ["FINANCE_CHECKPOINT_SEED_PATH"])
          BASELINE_QUOTA_PATH = Path(os.environ["FINANCE_BASELINE_QUOTA_PATH"])
          BASELINE_RAW_INDEX_PATH = Path(os.environ["FINANCE_BASELINE_RAW_INDEX_PATH"])
          RUNNER_PATH = Path(os.environ["FINANCE_RUNNER_PATH"])
          SOURCE_ADMISSION_PATH = Path(os.environ["FINANCE_SOURCE_ADMISSION_PATH"])
          WORKFLOW_PATH = Path(os.environ["FINANCE_WORKFLOW_PATH"])
          ZERO_HASH = "0" * 64
          HEX64 = re.compile(r"^[0-9a-f]{64}$")

          class Blocked(RuntimeError):
              pass

          def require(condition, code):
              if not condition:
                  raise Blocked(code)

          def strict_json(path):
              def pairs(values):
                  result = {}
                  for key, value in values:
                      if key in result:
                          raise Blocked("DUPLICATE_JSON_KEY:" + str(path))
                      result[key] = value
                  return result
              try:
                  return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs)
              except Blocked:
                  raise
              except Exception as exc:
                  raise Blocked("INVALID_JSON:" + str(path)) from exc

          def sha256_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical_sha256(value):
              payload = (json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ) + "\n").encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          require(os.environ.get("EVENT_REPOSITORY") == EXPECTED_REPOSITORY, "REPOSITORY_MISMATCH")
          require(os.environ.get("EVENT_ACTOR") == EXPECTED_ACTOR, "OWNER_ACTOR_MISMATCH")
          require(os.environ.get("EVENT_TRIGGERING_ACTOR") == EXPECTED_ACTOR, "OWNER_TRIGGERING_ACTOR_MISMATCH")
          require(os.environ.get("EVENT_REF") == EXPECTED_REF, "TASK_BRANCH_MISMATCH")
          require(os.environ.get("EVENT_FORCED", "false").lower() == "false", "FORCED_PUSH_PROHIBITED")

          before = os.environ.get("EVENT_BEFORE", "")
          after = os.environ.get("EVENT_AFTER", "")
          require(bool(re.fullmatch(r"[0-9a-f]{40}", before)), "INVALID_BEFORE_SHA")
          require(bool(re.fullmatch(r"[0-9a-f]{40}", after)), "INVALID_AFTER_SHA")
          require(before != "0" * 40, "NEW_BRANCH_PUSH_PROHIBITED")
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          ).stdout.strip()
          require(head == after and os.environ.get("GITHUB_SHA") == after, "CHECKED_OUT_HEAD_EVENT_AFTER_MISMATCH")
          changed = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", before, after],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          ).stdout.splitlines()
          require(changed == [str(LATCH_PATH)], "PUSH_MUST_CHANGE_EXACTLY_LATCH_PATH")

          for path in (LATCH_PATH, AUTHORITY_PATH, PLAN_PATH, CHECKPOINT_PATH, BASELINE_QUOTA_PATH, BASELINE_RAW_INDEX_PATH, RUNNER_PATH, SOURCE_ADMISSION_PATH, WORKFLOW_PATH):
              require(path.is_file(), "REQUIRED_FILE_MISSING:" + str(path))

          latch = strict_json(LATCH_PATH)
          mode = latch.get("mode")
          require(mode in {"PRECHECK_ARMED", "LIVE_ARMED"}, "LATCH_NOT_ARMED")
          require(latch.get("state") == "ARMED", "LATCH_STATE_NOT_ARMED")
          activation = latch.get("activation_modes", {}).get(mode, {})
          expected_message = activation.get("exact_commit_message")
          require(expected_message in {
              "Arm M3Top3 Finance precheck v1.0",
              "Arm M3Top3 Finance bounded live pilot v1.0",
          }, "UNKNOWN_ACTIVATION_MESSAGE")
          require(os.environ.get("EVENT_HEAD_MESSAGE") == expected_message, "ACTIVATION_MESSAGE_MISMATCH")
          require(latch.get("activation_commit_message") == expected_message, "LATCH_MESSAGE_MISMATCH")
          require(latch.get("repository") == EXPECTED_REPOSITORY, "LATCH_REPOSITORY_MISMATCH")
          require(latch.get("owner_actor") == EXPECTED_ACTOR, "LATCH_ACTOR_MISMATCH")
          require(latch.get("branch") == EXPECTED_BRANCH, "LATCH_BRANCH_MISMATCH")
          require(latch.get("runtime_lock_id") == EXPECTED_RUNTIME, "LATCH_RUNTIME_MISMATCH")
          require(latch.get("pilot_run_id") == EXPECTED_RUN_ID, "LATCH_RUN_ID_MISMATCH")
          require(latch.get("execution_token_sha256") == EXPECTED_TOKEN_HASH, "EXECUTION_TOKEN_HASH_MISMATCH")
          require(latch.get("owner_cap_spec_sha256") == EXPECTED_OWNER_SPEC, "OWNER_SPEC_HASH_MISMATCH")
          if mode == "PRECHECK_ARMED":
              require(activation.get("provider_api_calls_authorized") is False, "PRECHECK_PROVIDER_CALL_MUST_BE_FALSE")
              require(activation.get("remote_raw_custody_writes_authorized") is False, "PRECHECK_REMOTE_WRITE_MUST_BE_FALSE")
          else:
              require(activation.get("provider_api_calls_authorized") is True, "LIVE_PROVIDER_CALL_AUTHORITY_MISMATCH")
              require(activation.get("remote_raw_custody_writes_authorized") is True, "LIVE_REMOTE_WRITE_AUTHORITY_MISMATCH")
              kst_day = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).date().isoformat()
              require(kst_day == "2026-08-28", "LIVE_QUOTA_DAY_KST_MISMATCH")

          bindings = latch.get("authority_bindings", {})
          require(bindings.get("bindings_finalized") is True, "HASH_BINDINGS_NOT_FINALIZED")
          bound_paths = {
              "authority": ("authority_path", "authority_sha256", AUTHORITY_PATH),
              "plan": ("plan_path", "plan_sha256", PLAN_PATH),
              "checkpoint": ("checkpoint_seed_path", "checkpoint_seed_sha256", CHECKPOINT_PATH),
              "baseline_quota": ("baseline_quota_ledger_path", "baseline_quota_ledger_sha256", BASELINE_QUOTA_PATH),
              "baseline_raw_index": ("baseline_raw_index_path", "baseline_raw_index_sha256", BASELINE_RAW_INDEX_PATH),
              "runner": ("runner_path", "runner_sha256", RUNNER_PATH),
              "source_admission": ("source_admission_path", "source_admission_sha256", SOURCE_ADMISSION_PATH),
              "workflow": ("workflow_path", "workflow_sha256", WORKFLOW_PATH),
          }
          for label, (path_key, hash_key, expected_path) in bound_paths.items():
              require(bindings.get(path_key) == str(expected_path), label.upper() + "_PATH_MISMATCH")
              expected_hash = bindings.get(hash_key)
              require(isinstance(expected_hash, str) and HEX64.fullmatch(expected_hash), label.upper() + "_HASH_INVALID")
              require(expected_hash != ZERO_HASH, label.upper() + "_HASH_UNFINALIZED")
              require(sha256_file(expected_path) == expected_hash, label.upper() + "_HASH_MISMATCH")

          material = latch.get("execution_material")
          require(isinstance(material, dict), "EXECUTION_MATERIAL_MISSING")
          material_hash = latch.get("execution_material_sha256")
          require(isinstance(material_hash, str) and HEX64.fullmatch(material_hash), "EXECUTION_MATERIAL_HASH_INVALID")
          require(material_hash != ZERO_HASH, "EXECUTION_MATERIAL_HASH_UNFINALIZED")
          require(canonical_sha256(material) == material_hash, "EXECUTION_MATERIAL_HASH_MISMATCH")
          require(material.get("runtime_lock_id") == EXPECTED_RUNTIME, "MATERIAL_RUNTIME_MISMATCH")
          require(material.get("pilot_run_id") == EXPECTED_RUN_ID, "MATERIAL_RUN_ID_MISMATCH")
          require(material.get("execution_token_sha256") == EXPECTED_TOKEN_HASH, "MATERIAL_TOKEN_HASH_MISMATCH")
          require(material.get("owner_cap_spec_sha256") == EXPECTED_OWNER_SPEC, "MATERIAL_OWNER_SPEC_MISMATCH")
          require(material.get("authority_sha256") == bindings.get("authority_sha256"), "MATERIAL_AUTHORITY_HASH_MISMATCH")
          require(material.get("plan_sha256") == bindings.get("plan_sha256"), "MATERIAL_PLAN_HASH_MISMATCH")
          require(material.get("runner_sha256") == bindings.get("runner_sha256"), "MATERIAL_RUNNER_HASH_MISMATCH")
          require(material.get("source_admission_sha256") == bindings.get("source_admission_sha256"), "MATERIAL_SOURCE_ADMISSION_HASH_MISMATCH")
          require(material.get("checkpoint_template_sha256") == bindings.get("checkpoint_seed_sha256"), "MATERIAL_CHECKPOINT_HASH_MISMATCH")

          finance = latch.get("finance_spec", {})
          require(finance.get("source_id") == "M3TOP3-FINANCE-STOCK-RIGHTS-v1", "SOURCE_ID_MISMATCH")
          require(finance.get("operation") == "getRighExerReasSche_V2", "OPERATION_MISMATCH")
          require(tuple(finance.get("ordered_primary_dates", ())) == EXPECTED_DATES, "PRIMARY_DATE_SET_MISMATCH")
          require(finance.get("primary_date_count") == 17, "PRIMARY_DATE_COUNT_MISMATCH")
          require(canonical_sha256(list(EXPECTED_DATES)) == EXPECTED_DATE_HASH, "FROZEN_DATE_HASH_INTERNAL_MISMATCH")
          require(finance.get("ordered_primary_dates_sha256") == EXPECTED_DATE_HASH, "PRIMARY_DATE_HASH_MISMATCH")
          exact_caps = {
              "request_page_size": 10,
              "max_pages_per_date": 10,
              "max_primary_page_acquisitions": 170,
              "max_network_attempts_total": 200,
              "max_attempts_per_page": 2,
          }
          for key, expected in exact_caps.items():
              require(type(finance.get(key)) is int and finance.get(key) == expected, "CAP_MISMATCH:" + key)
          for key in (
              "fallback_dates_authorized",
              "full_date_range_expansion_authorized",
              "historical_2019_canary_expansion_authorized",
          ):
              require(finance.get(key) is False, "EXPANSION_PROHIBITION_MISMATCH:" + key)

          remote = latch.get("remote_custody", {})
          exact_uri = "s3://semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/"
          exact_prefix = "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/"
          control_prefix = (
              exact_prefix
              + "_pilot_control/runtime_lock_id=" + EXPECTED_RUNTIME
              + "/pilot_run_id=" + EXPECTED_RUN_ID + "/"
          )
          require(remote.get("authorized") is True, "REMOTE_CUSTODY_NOT_AUTHORIZED")
          require(remote.get("aws_account_id") == "956315449338", "AWS_ACCOUNT_BINDING_MISMATCH")
          require(remote.get("aws_region") == "ap-northeast-2", "AWS_REGION_BINDING_MISMATCH")
          require(remote.get("bucket") == "semi-data-plane-aofspds-20260815", "S3_BUCKET_BINDING_MISMATCH")
          require(remote.get("exact_source_prefix") == exact_prefix, "S3_PREFIX_BINDING_MISMATCH")
          require(remote.get("exact_source_uri") == exact_uri, "S3_URI_BINDING_MISMATCH")
          require(remote.get("control_prefix") == control_prefix, "S3_CONTROL_PREFIX_MISMATCH")
          control_uri = "s3://semi-data-plane-aofspds-20260815/" + control_prefix
          exact_control_uris = {
              "checkpoint_uri": control_uri + "checkpoint.json",
              "quota_ledger_uri": control_uri + "quota-ledger.jsonl",
              "raw_index_uri": control_uri + "raw-index.jsonl",
              "report_uri": control_uri + "report.json",
              "execution_claim_uri": control_uri + "execution-claim.json",
          }
          for key, expected in exact_control_uris.items():
              require(remote.get(key) == expected, "S3_CONTROL_URI_EXACT_MISMATCH:" + key)
          require(remote.get("materialization_state") == {
              "checkpoint_uri": "DURABLE_CAS_MATERIALIZED_BY_RUNNER",
              "execution_claim_uri": "CONDITIONAL_CREATE_MATERIALIZED_BY_RUNNER",
              "quota_ledger_uri": "RESERVED_NOT_MATERIALIZED",
              "raw_index_uri": "RESERVED_NOT_MATERIALIZED",
              "report_uri": "RESERVED_NOT_MATERIALIZED",
          }, "REMOTE_CONTROL_MATERIALIZATION_STATE_MISMATCH")
          require(remote.get("canonical_live_attempt_and_raw_telemetry") == "DURABLE_CHECKPOINT_INTERNAL", "CANONICAL_TELEMETRY_BINDING_MISMATCH")
          require(remote.get("post_run_sanitized_control_currentization") == "REPOSITORY_CAS_AFTER_ARTIFACT_READBACK", "POST_RUN_CURRENTIZATION_BINDING_MISMATCH")
          cas = remote.get("checkpoint_cas", {})
          require(cas.get("create_precondition") == "If-None-Match:*", "CAS_CREATE_PRECONDITION_MISMATCH")
          require(cas.get("update_precondition") == "If-Match:PRIOR_ETAG", "CAS_UPDATE_PRECONDITION_MISMATCH")
          require(cas.get("version_id_readback_required") is True, "CAS_VERSION_READBACK_REQUIRED")
          require(cas.get("single_writer_execution_claim_required_before_provider_call") is True, "EXECUTION_CLAIM_REQUIRED")

          authority = strict_json(AUTHORITY_PATH)
          require(authority.get("runtime_lock_id") == EXPECTED_RUNTIME, "AUTHORITY_RUNTIME_MISMATCH")
          require(authority.get("branch") == EXPECTED_BRANCH, "AUTHORITY_BRANCH_MISMATCH")
          current = authority.get("current_runtime_authority", {})
          require(current.get("provider_api_network_calls_authorized") is True, "AUTHORITY_PROVIDER_CALL_NOT_AUTHORIZED")
          require(current.get("provider_api_network_attempt_budget") == 200, "AUTHORITY_NETWORK_CAP_MISMATCH")
          require(current.get("quota_reservation_authorized") is True, "AUTHORITY_QUOTA_NOT_AUTHORIZED")
          require(current.get("live_multi_page_provider_run_authorized") is True, "AUTHORITY_LIVE_RUN_NOT_AUTHORIZED")
          require(current.get("remote_raw_custody_write_authorized") is True, "AUTHORITY_REMOTE_CUSTODY_NOT_AUTHORIZED")
          require(current.get("remote_raw_custody_prefix") == exact_uri, "AUTHORITY_REMOTE_CUSTODY_PREFIX_MISMATCH")
          for key in (
              "ksd_provider_calls_authorized", "ksd_document_search_authorized",
              "fallback_dates_authorized", "full_date_range_expansion_authorized",
              "historical_canary_2019_authorized", "bulk_acquisition_authorized",
              "production_authorized", "model_semantic_change_authorized",
              "pit_semantic_change_authorized", "normalized_release_authorized",
              "automatic_promotion_authorized",
          ):
              require(current.get(key) is False, "AUTHORITY_PROHIBITION_MISMATCH:" + key)
          require(current.get("validation_claim") == "NONE", "AUTHORITY_VALIDATION_CLAIM_MISMATCH")
          require(current.get("gate_effect") == "NONE", "AUTHORITY_GATE_EFFECT_MISMATCH")
          live_authority = authority.get("finance_live_pilot_authority", {})
          require(live_authority.get("pilot_run_id") == EXPECTED_RUN_ID, "AUTHORITY_RUN_ID_MISMATCH")
          require(live_authority.get("execution_token_sha256") == EXPECTED_TOKEN_HASH, "AUTHORITY_EXECUTION_TOKEN_HASH_MISMATCH")
          require(live_authority.get("owner_cap_spec_sha256") == EXPECTED_OWNER_SPEC, "AUTHORITY_OWNER_SPEC_MISMATCH")
          require(live_authority.get("durable_checkpoint_prefix") == "s3://semi-data-plane-aofspds-20260815/" + control_prefix, "AUTHORITY_CONTROL_PREFIX_MISMATCH")
          require(live_authority.get("remote_raw_custody_prefix") == exact_uri, "LIVE_AUTHORITY_REMOTE_CUSTODY_PREFIX_MISMATCH")
          require(live_authority.get("authorized_fallback_dates") == [], "LIVE_AUTHORITY_FALLBACK_DATE_SET_MISMATCH")
          for key in (
              "fallback_dates_authorized", "full_date_range_expansion_authorized",
              "historical_canary_2019_authorized", "bulk_acquisition_authorized",
              "production_authorized", "model_semantic_change_authorized",
              "pit_semantic_change_authorized", "normalized_release_authorized",
              "automatic_promotion_authorized", "ksd_blocker_waived",
          ):
              require(live_authority.get(key) is False, "LIVE_AUTHORITY_PROHIBITION_MISMATCH:" + key)
          if mode == "LIVE_ARMED":
              require(current.get("provider_api_network_calls_entry_gate") == "OPEN", "AUTHORITY_PROVIDER_ENTRY_GATE_NOT_OPEN")
              require(live_authority.get("authority_state") == "GRANTED_ENTRY_GATE_OPEN", "LIVE_AUTHORITY_STATE_NOT_OPEN")
              require(live_authority.get("live_entry_gate", {}).get("state") == "OPEN", "LIVE_ENTRY_GATE_NOT_OPEN")

          plan = strict_json(PLAN_PATH)
          require(plan.get("runtime_lock_id") == EXPECTED_RUNTIME, "PLAN_RUNTIME_MISMATCH")
          require(plan.get("pilot_run_id") == EXPECTED_RUN_ID, "PLAN_RUN_ID_MISMATCH")
          require(plan.get("branch") == EXPECTED_BRANCH, "PLAN_BRANCH_MISMATCH")
          for key in (
              "bulk_acquisition_authorized", "production_authorized",
              "normalized_release_authorized", "model_semantic_change_authorized",
              "pit_semantic_change_authorized", "automatic_promotion_authorized",
          ):
              require(plan.get(key) is False, "PLAN_PROHIBITION_MISMATCH:" + key)
          plan_binding = plan.get("authority_binding", {})
          require(plan_binding.get("owner_cap_spec_sha256") == EXPECTED_OWNER_SPEC, "PLAN_OWNER_SPEC_MISMATCH")
          require(plan_binding.get("execution_token_sha256") == EXPECTED_TOKEN_HASH, "PLAN_EXECUTION_TOKEN_HASH_MISMATCH")
          require(plan_binding.get("contract_content_sha256") == bindings.get("authority_sha256"), "PLAN_AUTHORITY_HASH_MISMATCH")
          pilot = plan.get("finance_pilot_plan", {})
          require(tuple(pilot.get("ordered_primary_dates", ())) == EXPECTED_DATES, "PLAN_DATE_SET_MISMATCH")
          require(pilot.get("ordered_primary_dates_sha256") == EXPECTED_DATE_HASH, "PLAN_DATE_HASH_MISMATCH")
          require(pilot.get("request_page_size") == 10, "PLAN_PAGE_SIZE_MISMATCH")
          require(pilot.get("max_pages_per_date") == 10, "PLAN_PAGE_CAP_MISMATCH")
          require(pilot.get("max_primary_page_acquisitions") == 170, "PLAN_ACQUISITION_CAP_MISMATCH")
          require(pilot.get("max_network_attempts_total") == 200, "PLAN_NETWORK_CAP_MISMATCH")
          require(pilot.get("max_attempts_per_logical_page") == 2, "PLAN_ATTEMPT_CAP_MISMATCH")
          require(pilot.get("authorized_fallback_dates") == [], "PLAN_FALLBACK_DATE_SET_MISMATCH")
          require(pilot.get("fallback_dates_authorized") is False, "PLAN_FALLBACK_MISMATCH")
          require(pilot.get("full_date_range_expansion_authorized") is False, "PLAN_RANGE_EXPANSION_MISMATCH")
          require(pilot.get("historical_canary_2019_authorized") is False, "PLAN_2019_EXPANSION_MISMATCH")
          require(pilot.get("automatic_promotion_authorized") is False, "PLAN_PROMOTION_MISMATCH")
          plan_gate = plan.get("execution_gate", {})
          durable = plan.get("durable_custody_plan", {})
