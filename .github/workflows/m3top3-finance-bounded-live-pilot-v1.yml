              raise SystemExit("GITHUB_TOKEN_MISSING_OR_INVALID")
          if os.environ.get("EXPECTED_ACTOR") != ACTOR:
              raise SystemExit("GITHUB_ACTOR_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_TRIGGERING_ACTOR") != ACTOR:
              raise SystemExit("GITHUB_TRIGGERING_ACTOR_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REPOSITORY") != REPOSITORY:
              raise SystemExit("GITHUB_REPOSITORY_RECHECK_MISMATCH")
          if os.environ.get("EXPECTED_REF") != REF:
              raise SystemExit("GITHUB_REF_RECHECK_MISMATCH")
          expected_sha = os.environ.get("EXPECTED_SHA", "")
          expected_run_id = int(os.environ.get("EXPECTED_RUN_ID", "0"))
          expected_run_attempt = int(os.environ.get("EXPECTED_RUN_ATTEMPT", "0"))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise SystemExit("GITHUB_API_DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def get_json(path):
              if not path.startswith("/repos/AofSpds/asset-agent-asa/"):
                  raise SystemExit("GITHUB_API_PATH_OUT_OF_SCOPE")
              request = urllib.request.Request(
                  API_ROOT + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "AAA-M3Top3-Finance-Live-Readback/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      if int(response.status) != 200:
                          raise SystemExit("GITHUB_API_NON_200")
                      data = response.read()
              except urllib.error.HTTPError as exc:
                  raise SystemExit("GITHUB_API_HTTP_" + str(exc.code)) from None
              except (urllib.error.URLError, TimeoutError, OSError):
                  raise SystemExit("GITHUB_API_TRANSPORT_BLOCKED") from None
              try:
                  return json.loads(data, object_pairs_hook=pairs)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit("GITHUB_API_INVALID_JSON") from None

          encoded_branch = urllib.parse.quote(BRANCH, safe="")
          branch = get_json("/repos/" + REPOSITORY + "/branches/" + encoded_branch)
          if branch.get("name") != BRANCH or branch.get("commit", {}).get("sha") != expected_sha:
              raise SystemExit("CURRENT_BRANCH_HEAD_NOT_GITHUB_SHA")

          active_states = ("queued", "in_progress", "waiting", "requested", "pending")
          active_by_id = {}
          for status in active_states:
              runs_path = (
                  "/repos/" + REPOSITORY + "/actions/runs?branch=" + encoded_branch
                  + "&status=" + status + "&per_page=100"
              )
              payload = get_json(runs_path)
              runs = payload.get("workflow_runs", [])
              if not isinstance(runs, list) or int(payload.get("total_count", 0)) > len(runs):
                  raise SystemExit("GITHUB_ACTIVE_WORKFLOW_RUNS_INCOMPLETE")
              for run in runs:
                  if (
                      run.get("head_branch") == BRANCH
                      and run.get("status") == status
                      and str(run.get("path", "")).startswith(".github/workflows/m3top3-")
                  ):
                      active_by_id[int(run.get("id", 0))] = run
          active = list(active_by_id.values())
          if len(active) != 1 or int(active[0].get("id", 0)) != expected_run_id:
              raise SystemExit("COMPETING_OR_MISSING_ACTIVE_WORKFLOW_RUN")
          current = active[0]
          if current.get("head_sha") != expected_sha or current.get("event") != "push":
              raise SystemExit("CURRENT_WORKFLOW_RUN_IDENTITY_MISMATCH")
          if int(current.get("run_attempt", 0)) != expected_run_attempt:
              raise SystemExit("CURRENT_WORKFLOW_RUN_ATTEMPT_MISMATCH")
          if current.get("actor", {}).get("login") != ACTOR:
              raise SystemExit("CURRENT_WORKFLOW_RUN_ACTOR_MISMATCH")
          if current.get("triggering_actor", {}).get("login") != ACTOR:
              raise SystemExit("CURRENT_WORKFLOW_RUN_TRIGGERING_ACTOR_MISMATCH")
          if current.get("repository", {}).get("full_name") != REPOSITORY:
              raise SystemExit("CURRENT_WORKFLOW_RUN_REPOSITORY_MISMATCH")

          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_GITHUB_LIVE_READBACK_v1.0",
              "state": "PASS_CURRENT_BRANCH_HEAD_AND_CURRENT_RUN_ONLY_NO_PROVIDER_CALL",
              "repository": REPOSITORY,
              "actor": ACTOR,
              "triggering_actor": ACTOR,
              "branch": BRANCH,
              "head_sha": expected_sha,
              "workflow_run_id": expected_run_id,
              "workflow_run_attempt": expected_run_attempt,
              "active_workflow_run_count": 1,
              "competing_run_scope": "ACTIVE_TASK_BRANCH_M3TOP3_WORKFLOWS",
              "github_token_logged": False,
              "github_token_persisted": False,
              "provider_api_network_attempts": 0,
          }
          Path("live_out/github-readback.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute Finance-only bounded live pilot once
        if: steps.preflight.outputs.mode == 'LIVE_ARMED'
        shell: bash
        env:
          DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY: ${{ secrets.DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import urllib.parse

          value = os.environ.get("DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY", "")
          if not value:
              raise SystemExit("MISSING_FINANCE_SERVICE_SECRET")
          if value != value.strip() or any(ch.isspace() for ch in value):
              raise SystemExit("INVALID_FINANCE_SERVICE_SECRET_FORMAT")
          if re.search(r"%[0-9A-Fa-f]{2}", value):
              raise SystemExit("FINANCE_SERVICE_SECRET_MUST_BE_DECODED")
          variants = {value, urllib.parse.quote(value, safe=""), urllib.parse.quote_plus(value, safe="")}
          for variant in variants:
              escaped = variant.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PY

          set +e
          python -m tools.m3top3.finance_live_pilot \
            --authority control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_SOURCE_ADMISSION_CONTRACT_v1.0.json \
            --plan control/m3top3/public-data-source-admission/v1.0/M3TOP3_PUBLIC_DATA_API_SOURCE_ADMISSION_PLAN_v1.0.json \
            --latch control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_LIVE_PILOT_LATCH_v1.0.json \
            --checkpoint live_out/checkpoint.json \
            --quota-ledger live_out/quota-ledger.jsonl \
            --raw-index live_out/raw-index.jsonl \
            --report live_out/report.json
          runner_rc=$?

          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.parse
          from pathlib import Path

          root = Path("live_out")
          secret = os.environ["DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY"].encode("utf-8")
          variants = {
              secret,
              urllib.parse.quote(secret.decode("utf-8"), safe="").encode("utf-8"),
              urllib.parse.quote_plus(secret.decode("utf-8"), safe="").encode("utf-8"),
          }
          leaked = False
          if root.exists():
              for path in root.rglob("*"):
                  if path.is_file():
                      data = path.read_bytes()
                      if any(value and value in data for value in variants):
                          leaked = True
                          break
          if leaked:
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              root.joinpath("exact-secret-scan.json").write_text(
                  json.dumps({
                      "artifact": "M3TOP3_FINANCE_CA_EXACT_SECRET_SCAN_v1.0",
                      "state": "BLOCKED_OUTPUT_REMOVED",
                      "matched_value_persisted": False,
                  }, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(86)
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("exact-secret-scan.json").write_text(
              json.dumps({
                  "artifact": "M3TOP3_FINANCE_CA_EXACT_SECRET_SCAN_v1.0",
                  "state": "PASS",
                  "matched_value_persisted": False,
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          scan_rc=$?
          set -e
          if [ "$scan_rc" -ne 0 ]; then
            exit "$scan_rc"
          fi
          exit "$runner_rc"

      - name: Leak-scan and build sanitized evidence bundle
        if: always()
        id: sanitize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          source = Path("live_out")
          target = Path("sanitized_out")
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True, exist_ok=True)
          allowed = {
              "preflight.json": "json",
              "aws-precheck.json": "json",
              "github-readback.json": "json",
              "checkpoint.json": "json",
              "quota-ledger.jsonl": "jsonl",
              "raw-index.jsonl": "jsonl",
              "report.json": "json",
              "exact-secret-scan.json": "json",
          }
          ignored_zero_byte_locks = {
              ".checkpoint.json.lock",
              ".quota-ledger.jsonl.lock",
              ".raw-index.jsonl.lock",
              ".report.json.lock",
          }
          byte_patterns = (
              re.compile(br"serviceKey", re.IGNORECASE),
              re.compile(br"(?:X-Amz-Credential|X-Amz-Signature|X-Amz-Security-Token)", re.IGNORECASE),
              re.compile(br"Authorization\s*:", re.IGNORECASE),
              re.compile(br"(?:AKIA|ASIA)[A-Z0-9]{16}"),
              re.compile(br"https?://[^\s\"']*[?&](?:serviceKey|X-Amz-[A-Za-z]+)=", re.IGNORECASE),
              re.compile(br"DATA_GO_KR_(?:FINANCE|KSD)", re.IGNORECASE),
              re.compile(br"M3TOP3-KSD", re.IGNORECASE),
          )
          prohibited_key_fragments = (
              "servicekey", "credential_value", "credential_hash", "credential_prefix",
              "authenticated_url", "request_headers", "authorization_header",
              "secret_value", "aws_access_key", "aws_secret", "aws_session_token",
          )

          def pairs(values):
              result = {}
              for key, value in values:
                  if key in result:
                      raise ValueError("DUPLICATE_JSON_KEY")
                  result[key] = value
              return result

          def inspect(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {"authenticated_url_persisted", "secret_persisted"}:
                          if child is not False:
                              raise ValueError("PERSISTENCE_NEGATIVE_EVIDENCE_MUST_BE_FALSE")
                          continue
                      folded = str(key).replace("_", "").lower()
                      if any(fragment.replace("_", "") in folded for fragment in prohibited_key_fragments):
                          raise ValueError("PROHIBITED_OUTPUT_FIELD")
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str):
                  if value == "KSD":
                      raise ValueError("KSD_OUTPUT_VALUE_PROHIBITED")
                  encoded = value.encode("utf-8")
                  if any(pattern.search(encoded) for pattern in byte_patterns):
                      raise ValueError("PROHIBITED_OUTPUT_VALUE")

          state = "PASS"
          copied = []
          try:
              if source.exists():
                  ignored = [
                      path for path in source.rglob("*")
                      if path.is_file() and path.name in ignored_zero_byte_locks
                  ]
                  if any(path.stat().st_size != 0 for path in ignored):
                      raise ValueError("NONEMPTY_LOCK_FILE")
                  unexpected = [
                      path for path in source.rglob("*")
                      if path.is_file()
                      and path.name not in allowed
                      and path.name not in ignored_zero_byte_locks
                  ]
                  if unexpected:
                      raise ValueError("UNEXPECTED_OUTPUT_FILE")
                  for name, kind in allowed.items():
                      path = source / name
                      if not path.exists():
                          continue
                      data = path.read_bytes()
                      if len(data) > 25_000_000:
                          raise ValueError("OUTPUT_FILE_TOO_LARGE")
                      if any(pattern.search(data) for pattern in byte_patterns):
                          raise ValueError("PROHIBITED_OUTPUT_BYTES")
                      rows = []
                      if kind == "json":
                          rows = [json.loads(data.decode("utf-8"), object_pairs_hook=pairs)]
                      else:
                          for line in data.decode("utf-8").splitlines():
                              if line.strip():
                                  rows.append(json.loads(line, object_pairs_hook=pairs))
                      if name == "quota-ledger.jsonl":
                          if any(row.get("provider") not in {"FINANCE", "KSD"} for row in rows):
                              raise ValueError("UNKNOWN_QUOTA_PROVIDER")
                          rows = [row for row in rows if row.get("provider") == "FINANCE"]
                      for row in rows:
                          inspect(row)
                      rendered = "".join(
                          json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"
                          for row in rows
                      )
                      target.joinpath(name).write_text(rendered, encoding="utf-8")
                      copied.append(name)
          except Exception:
              state = "BLOCKED_UNSAFE_OR_MALFORMED_OUTPUT_NOT_COPIED"
              shutil.rmtree(target, ignore_errors=True)
              target.mkdir(parents=True, exist_ok=True)
              copied = []

          receipt = {
              "artifact": "M3TOP3_FINANCE_CA_SANITIZED_BUNDLE_RECEIPT_v1.0",
              "state": state,
              "copied_files": sorted(copied),
              "raw_entities_in_actions_artifact": 0,
              "secret_values_persisted": False,
              "authenticated_urls_persisted": False,
              "ksd_material_present": False,
          }
          target.joinpath("sanitization-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          if state != "PASS":
              raise SystemExit(87)
          PY

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3top3-finance-bounded-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: sanitized_out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
