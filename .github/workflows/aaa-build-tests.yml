name: AAA build tests

on:
  push:
    branches:
      - 'aaa-*'
  pull_request:
    paths:
      - 'aaa/**'
      - 'control/aaa/**'
      - '.github/workflows/aaa-build-tests.yml'

jobs:
  deterministic-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AAA standard-library tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s aaa/tests -p 'test_*.py' -v

  owner-console-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve Owner Console dependencies and capture exact direct identities
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          echo 'AAA_RESOLVED_DIRECT_DEPENDENCIES_BEGIN'
          npm ls --depth=0 --json
          echo 'AAA_RESOLVED_DIRECT_DEPENDENCIES_END'
          test -f package-lock.json
          sha256sum package-lock.json
      - name: Build Owner Console
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm run build
