name: AAA build tests

on:
  push:
    branches:
      - 'aaa-*'
  pull_request:
    paths:
      - 'aaa/**'
      - 'control/aaa/**'
      - '.github/workflows/aaa-build-tests.yml'

jobs:
  deterministic-contract-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AAA standard-library tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s aaa/tests -p 'test_*.py' -v

  postgres-contract-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaa_t18
        options: >-
          --health-cmd "pg_isready -U postgres -d aaa_t18"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply T18 PostgreSQL migration and contract smoke
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:16-alpine/ {print $1; exit}')"
          test -n "$cid"
          docker exec -i "$cid" psql -v ON_ERROR_STOP=1 -U postgres -d aaa_t18 < aaa/db/migrations/0001_operational_execution_plane.sql
          docker exec -i "$cid" psql -v ON_ERROR_STOP=1 -U postgres -d aaa_t18 < aaa/db/tests/t18_contract_smoke.sql

  owner-console-build-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: aaa/web/package-lock.json
      - name: Verify Owner Console dependency lock identity
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          sha256sum package-lock.json
      - name: Install Owner Console dependencies from committed lock only
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Build Owner Console
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm run build
