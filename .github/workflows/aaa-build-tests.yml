name: AAA build tests

on:
  push:
    branches:
      - 'aaa-*'
  pull_request:
    paths:
      - 'aaa/**'
      - 'control/aaa/**'
      - '.github/workflows/aaa-build-tests.yml'

jobs:
  deterministic-contract-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AAA standard-library tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s aaa/tests -p 'test_*.py' -v

  owner-console-build-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: aaa/web/package-lock.json
      - name: Verify Owner Console dependency lock identity
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          sha256sum package-lock.json
      - name: Install Owner Console dependencies from committed lock only
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Build Owner Console
        working-directory: aaa/web
        shell: bash
        run: |
          set -euo pipefail
          npm run build
