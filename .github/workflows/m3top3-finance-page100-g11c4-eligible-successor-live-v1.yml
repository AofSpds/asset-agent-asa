      - name: Configure exact bounded G11C4 final-list-write OIDC session
        id: configure-final-list-write-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c4-final-${{ github.run_id }}
          role-duration-seconds: 21600
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: false
          output-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.live-policies.outputs.final_json }}

      - name: Run one bounded G11C4 LIVE generation without retry
        shell: bash
        env:
          G11C4_CHECKPOINT_READ_AWS_ACCESS_KEY_ID: ${{ steps.configure-checkpoint-read-aws.outputs.aws-access-key-id }}
          G11C4_CHECKPOINT_READ_AWS_SECRET_ACCESS_KEY: ${{ steps.configure-checkpoint-read-aws.outputs.aws-secret-access-key }}
          G11C4_CHECKPOINT_READ_AWS_SESSION_TOKEN: ${{ steps.configure-checkpoint-read-aws.outputs.aws-session-token }}
          G11C4_RAW_FOUR_READ_AWS_ACCESS_KEY_ID: ${{ steps.configure-raw-four-read-aws.outputs.aws-access-key-id }}
          G11C4_RAW_FOUR_READ_AWS_SECRET_ACCESS_KEY: ${{ steps.configure-raw-four-read-aws.outputs.aws-secret-access-key }}
          G11C4_RAW_FOUR_READ_AWS_SESSION_TOKEN: ${{ steps.configure-raw-four-read-aws.outputs.aws-session-token }}
          G11C4_FINAL_LIST_WRITE_AWS_ACCESS_KEY_ID: ${{ steps.configure-final-list-write-aws.outputs.aws-access-key-id }}
          G11C4_FINAL_LIST_WRITE_AWS_SECRET_ACCESS_KEY: ${{ steps.configure-final-list-write-aws.outputs.aws-secret-access-key }}
          G11C4_FINAL_LIST_WRITE_AWS_SESSION_TOKEN: ${{ steps.configure-final-list-write-aws.outputs.aws-session-token }}
          DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY: ${{ secrets.DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY }}
          G11C4_LIVE_HEAD_SHA: ${{ steps.live-lineage.outputs.head_sha }}
          G11C4_LIVE_HEAD_TREE: ${{ steps.live-lineage.outputs.head_tree }}
          LIVE_OUTPUT: ${{ runner.temp }}/g11c4-live-terminal-result.json
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          for credential_name in \
            G11C4_CHECKPOINT_READ_AWS_ACCESS_KEY_ID \
            G11C4_CHECKPOINT_READ_AWS_SECRET_ACCESS_KEY \
            G11C4_CHECKPOINT_READ_AWS_SESSION_TOKEN \
            G11C4_RAW_FOUR_READ_AWS_ACCESS_KEY_ID \
            G11C4_RAW_FOUR_READ_AWS_SECRET_ACCESS_KEY \
            G11C4_RAW_FOUR_READ_AWS_SESSION_TOKEN \
            G11C4_FINAL_LIST_WRITE_AWS_ACCESS_KEY_ID \
            G11C4_FINAL_LIST_WRITE_AWS_SECRET_ACCESS_KEY \
            G11C4_FINAL_LIST_WRITE_AWS_SESSION_TOKEN
          do
            test -n "${!credential_name:-}"
          done
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -n "$DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY"
          test "$G11C4_LIVE_HEAD_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$G11C4_LIVE_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$G11C4_LIVE_HEAD_TREE"
          test ! -e "$LIVE_OUTPUT"
          precheck_receipt_path="$(jq -r '.precheck_pass_binding.path // empty' "$ACTIVATION_PATH")"
          test -f "$precheck_receipt_path"

          live_result_emitted=0
          emit_live_result() {
            if test "$live_result_emitted" -eq 1; then
              return 0
            fi
            if test -f "$LIVE_OUTPUT"; then
              live_sha="$(sha256sum -- "$LIVE_OUTPUT" | cut -d' ' -f1)"
              live_bytes="$(wc -c < "$LIVE_OUTPUT" | tr -d ' ')"
              printf '%s\n' 'G11C4_LIVE_SANITIZED_TERMINAL_RESULT_BASE64_BEGIN'
              base64 -w 0 "$LIVE_OUTPUT"
              printf '\n%s\n' 'G11C4_LIVE_SANITIZED_TERMINAL_RESULT_BASE64_END'
              jq -cn \
                --arg terminal_sha256 "$live_sha" \
                --arg terminal_bytes "$live_bytes" \
                --arg runner_status "${runner_status:-NOT_STARTED}" \
                '{terminal_sha256:$terminal_sha256,terminal_bytes:($terminal_bytes|tonumber),runner_status:$runner_status}'
            else
              printf '%s\n' '{"terminal_result":"MISSING","disposition":"FAIL_CLOSED_NO_RETRY"}'
            fi
            live_result_emitted=1
          }
          finalize_live_log() {
            final_status="$?"
            trap - EXIT
            set +e
            emit_live_result
            exit "$final_status"
          }
          trap finalize_live_log EXIT

          set +e
          python "$RUNNER_PATH" \
            --mode live \
            --sts-policy-probe-count 3 \
            --manifest "$MANIFEST_PATH" \
            --authority "$AUTHORITY_PATH" \
            --plan "$PLAN_PATH" \
            --seed "$SEED_PATH" \
            --pytest-file "$TEST_PATH" \
            --activation "$ACTIVATION_PATH" \
            --precheck-receipt "$precheck_receipt_path" \
            --live-adapter "$LIVE_ADAPTER_PATH" \
            --adapter-test "$ADAPTER_TEST_PATH" \
            --owner-decision "$OWNER_DECISION_PATH" \
            --self-deadline-seconds 18000 \
            --output "$LIVE_OUTPUT"
          runner_status="$?"
          set -e

          test -f "$LIVE_OUTPUT"
          emit_live_result
          jq -e \
            --argjson acquisition_ceiling "$G11C4_PRIMARY_ACQUISITION_CEILING" \
            --argjson attempt_ceiling "$G11C4_NETWORK_ATTEMPT_CEILING" '
              .schema == "M3TOP3_FINANCE_CA_PAGE100_G11C4_LIVE_ENTRY_RESULT_v1.0" and
              (.entry_gate == "LIVE_NOT_ENTERED" or .entry_gate == "LIVE_ENTERED_ONCE") and
              .effects.primary_acquisitions >= 0 and
              .effects.primary_acquisitions <= $acquisition_ceiling and
              .effects.effective_primary_acquisitions == (4 + .effects.primary_acquisitions) and
              .effects.effective_primary_acquisitions <= 1700 and
              .effects.network_attempts >= 0 and
              .effects.network_attempts <= $attempt_ceiling and
              .effects.effective_network_attempts == (4 + .effects.network_attempts) and
              .effects.effective_network_attempts <= 2000 and
              .effects.primary_acquisitions <= .effects.network_attempts and
              .effects.network_attempts <= (2 * .effects.primary_acquisitions) and
              .effects.provider_calls >= 0 and
              .effects.provider_calls <= $attempt_ceiling and
              .effects.provider_calls <= .effects.network_attempts and
              .effects.finance_provider_api_calls == .effects.provider_calls and
              .effects.quota_reservations == .effects.network_attempts and
              .effects.quota_reservations <= $attempt_ceiling and
              .effects.provider_quota_reservations == .effects.quota_reservations and
              .effects.raw_writes >= 0 and
              .effects.raw_writes <= $acquisition_ceiling and
              .effects.raw_writes <= .effects.provider_calls and
              .effects.raw_objects_written == .effects.raw_writes and
              .effects.raw_index_appends == .effects.raw_writes and
              .effects.quota_ledger_appends == 0 and
              .effects.checkpoint_writes >= 0 and
              .effects.checkpoint_writes <= 8003 and
              .effects.checkpoint_writes <= ((.effects.network_attempts * 4) + 19) and
              .effects.execution_claim_writes >= 0 and
              .effects.execution_claim_writes <= 1 and
              .effects.terminal_receipt_writes >= 0 and
              .effects.terminal_receipt_writes <= 1 and
              .effects.terminal_receipt_put_attempts >= .effects.terminal_receipt_writes and
              .effects.terminal_receipt_put_attempts <= 1 and
              .effects.s3_get_calls >= 0 and
              .effects.s3_put_calls >= 0 and
              .effects.s3_delete_calls == 0 and
              .effects.s3_copy_calls == 0 and
              .effects.s3_tagging_mutation_calls == 0 and
              .effects.s3_other_calls >= 0 and
              .effects.s3_other_calls <= 3 and
              .effects.s3_get_attempts == .effects.s3_get_calls and
              .effects.s3_put_attempts == .effects.s3_put_calls and
              .effects.s3_other_read_calls == .effects.s3_other_calls and
              .effects.sts_calls == 6 and
              .effects.sts_assume_role_attempts == 3 and
              .effects.sts_sessions_assumed == 3 and
              .effects.sts_get_caller_identity_calls == 3 and
              .effects.credentials_issued == 3 and
              .effects.s3_calls ==
                (.effects.s3_get_calls + .effects.s3_put_calls + .effects.s3_other_calls) and
              .effects.aws_calls == (.effects.sts_calls + .effects.s3_calls) and
              .effects.remote_custody_mutations ==
                (.effects.raw_writes + .effects.checkpoint_writes +
                 .effects.execution_claim_writes + .effects.terminal_receipt_writes) and
              .effects.remote_custody_mutations <= .effects.s3_put_calls and
              .effects.successful_put_mutations == .effects.remote_custody_mutations and
              .effects.unconfirmed_or_failed_put_attempts ==
                (.effects.s3_put_attempts - .effects.successful_put_mutations) and
              .effects.normalization_actions == 0 and
              .effects.pit_actions == 0 and
              .effects.promotion_actions == 0 and
              .effects.release_actions == 0 and
              .effects.production_actions == 0 and
              .effects.company_master_mutations == 0 and
              .effects.universe_mutations == 0 and
              .effects.company_master_or_universe_mutations == 0 and
              .effects.repository_writes == 0 and
              .effects.repository_mutations_by_workflow == 0 and
              .effects.github_actions_artifacts_uploaded == 0 and
              .effects.effects_reconciled == true and
              .effects.ambiguous_side_effects == false and
              .effect_reconciliation.complete == true and
              .effect_reconciliation.ambiguous_side_effects == false and
              (if .entry_gate == "LIVE_ENTERED_ONCE"
               then (.effects.execution_claim_writes == 1 and
                     .effects.s3_other_calls == 3 and
                     .effects.s3_get_calls >= 5)
               else (.effects.execution_claim_writes == 0 and
                     .effects.provider_calls == 0 and
                     .effects.quota_reservations == 0 and
                     .effects.raw_writes == 0 and
                     .effects.checkpoint_writes == 0 and
                     .effects.terminal_receipt_writes == 0 and
                     .effects.terminal_receipt_put_attempts == 0 and
                     .effects.remote_custody_mutations == 0) end) and
              (if (.effects.remote_custody_mutations > 0 or
                   .effects.provider_calls > 0 or
                   .effects.quota_reservations > 0)
               then .effects.execution_claim_writes == 1
               else true end)
            ' "$LIVE_OUTPUT" >/dev/null
          if test "$runner_status" -ne 0; then
            jq -e '
              .verdict == "FAIL_CLOSED" and
              .no_rerun.same_run_retry_authorized == false and
              .no_rerun.same_activation_reuse_authorized == false and
              .no_rerun.same_latch_reuse_authorized == false
            ' "$LIVE_OUTPUT" >/dev/null
            exit "$runner_status"
          fi

          jq -e \
            --argjson acquisition_ceiling "$G11C4_PRIMARY_ACQUISITION_CEILING" \
            --argjson attempt_ceiling "$G11C4_NETWORK_ATTEMPT_CEILING" '
              .verdict == "PASS" and
              .entry_gate == "LIVE_ENTERED_ONCE" and
              .live_adapter_gate == "READY" and
              .execution_binding.head_sha == env.G11C4_LIVE_HEAD_SHA and
              .execution_binding.tree_sha == env.G11C4_LIVE_HEAD_TREE and
              .effects.primary_acquisitions >= 0 and
              .effects.primary_acquisitions <= $acquisition_ceiling and
              .effects.network_attempts >= 0 and
              .effects.network_attempts <= $attempt_ceiling and
              .effects.provider_calls >= 0 and
              .effects.provider_calls <= $attempt_ceiling and
              .effects.sts_calls == 6 and
              .effects.sts_assume_role_attempts == 3 and
              .effects.sts_sessions_assumed == 3 and
              .effects.sts_get_caller_identity_calls == 3 and
              .effects.credentials_issued == 3 and
              .effects.aws_calls == (.effects.sts_calls + .effects.s3_calls) and
              .effects.quota_reservations == .effects.network_attempts and
              .effects.raw_writes <= $acquisition_ceiling and
              .effects.checkpoint_writes <= 8003 and
              .effects.execution_claim_writes == 1 and
              .effects.terminal_receipt_writes == 1 and
              .effects.terminal_receipt_put_attempts == 1 and
              .effects.s3_other_calls == 3 and
              .effects.s3_put_calls == .effects.remote_custody_mutations and
              .effects.s3_get_calls >= (5 + .effects.remote_custody_mutations) and
              .effect_reconciliation.complete == true and
              .effect_reconciliation.ambiguous_side_effects == false and
              .execution_claim_binding.key ==
                "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-09-01/execution-claim.json" and
              (.execution_claim_binding.version_id | type == "string" and length > 0) and
              (.execution_claim_binding.etag | type == "string" and length > 0) and
              (.execution_claim_binding.sha256 | test("^[0-9a-f]{64}$")) and
              .execution_claim_binding.bytes > 0 and
              .execution_claim_binding.content_type == "application/json" and
              .execution_claim_binding.server_side_encryption == "AES256" and
              .checkpoint_binding.key ==
                "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G11C4-20260901143300/pilot_run_id=FINANCE-PAGE100-PILOT-G11C4-20260901143300/checkpoint.json" and
              (.checkpoint_binding.version_id | type == "string" and length > 0) and
              (.checkpoint_binding.etag | type == "string" and length > 0) and
              (.checkpoint_binding.sha256 | test("^[0-9a-f]{64}$")) and
              .checkpoint_binding.bytes > 0 and
              .checkpoint_binding.content_type == "application/json" and
              .checkpoint_binding.server_side_encryption == "AES256" and
              .terminal_receipt_binding.key ==
                "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G11C4-20260901143300/pilot_run_id=FINANCE-PAGE100-PILOT-G11C4-20260901143300/terminal-receipt.json" and
              .terminal_receipt_binding.attempted == true and
              .terminal_receipt_binding.put_attempts == 1 and
              .terminal_receipt_binding.confirmed == true and
              .terminal_receipt_binding.object.key == .terminal_receipt_binding.key and
              (.terminal_receipt_binding.object.version_id | type == "string" and length > 0) and
              (.terminal_receipt_binding.object.etag | type == "string" and length > 0) and
              (.terminal_receipt_binding.object.sha256 | test("^[0-9a-f]{64}$")) and
              .terminal_receipt_binding.object.bytes > 0 and
              .terminal_receipt_binding.object.content_type == "application/json" and
              .terminal_receipt_binding.object.server_side_encryption == "AES256" and
              .claim_ceiling.source_admission_verdict == "NOT_ADMITTED"
            ' "$LIVE_OUTPUT" >/dev/null

          jq -cn \
            --arg terminal_sha256 "$live_sha" \
            --arg terminal_bytes "$live_bytes" \
            --arg verdict "$(jq -r '.verdict' "$LIVE_OUTPUT")" \
            '{verdict:$verdict,terminal_sha256:$terminal_sha256,terminal_bytes:($terminal_bytes|tonumber),claim:"BOUNDED_G11C4_DATA_GENERATION_ONLY_SOURCE_NOT_ADMITTED"}'

      - name: Confirm workflow did not mutate the repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
