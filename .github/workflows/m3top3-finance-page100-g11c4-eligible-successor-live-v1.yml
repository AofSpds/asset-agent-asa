          printf 'head_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'head_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Require sealed executable adapter READY before credentials
        id: adapter-gate
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          # This is intentionally before OIDC configuration and before the
          # provider secret is placed in any step environment. The gate remains
          # closed unless the preparation manifest hash-binds reviewed code.
          test -f "$LIVE_ADAPTER_PATH"
          adapter_bound_path="$(jq -r '.files.live_adapter.path // empty' "$MANIFEST_PATH")"
          adapter_bound_blob="$(jq -r '.files.live_adapter.git_blob // empty' "$MANIFEST_PATH")"
          adapter_bound_sha="$(jq -r '.files.live_adapter.sha256 // empty' "$MANIFEST_PATH")"
          test "$adapter_bound_path" = "$LIVE_ADAPTER_PATH"
          test "$(git hash-object -- "$LIVE_ADAPTER_PATH")" = "$adapter_bound_blob"
          test "$(sha256sum -- "$LIVE_ADAPTER_PATH" | cut -d' ' -f1)" = "$adapter_bound_sha"

          jq -e --arg path "$LIVE_ADAPTER_PATH" '
              .live_adapter_gate == "READY" and
              .live_adapter.executable == true and
              .live_adapter.sealed == true and
              .live_adapter.ready == true and
              .live_adapter.path == $path and
              .safe_executable_adapter.ready == true and
              .safe_executable_adapter.runner_path == env.RUNNER_PATH and
              (.safe_executable_adapter.factory_symbol | type == "string" and length > 0) and
              (.safe_executable_adapter.factory_symbol | startswith("__") | not)
            ' "$MANIFEST_PATH" >/dev/null

          jq -e \
            --arg ineligible_commit "$INELIGIBLE_G11C1_PREPARATION_COMMIT" \
            --arg ineligible_tree "$INELIGIBLE_G11C1_PREPARATION_TREE" \
            --arg ineligible_receipt_path "$INELIGIBLE_G11C1_RECEIPT_PATH" \
            --arg ineligible_receipt_sha "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_SHA256" \
            --arg ineligible_receipt_blob "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BLOB" \
            --arg ineligible_receipt_payload "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_PAYLOAD_SHA256" \
            --argjson ineligible_receipt_bytes "$EXPECTED_INELIGIBLE_G11C1_RECEIPT_BYTES" \
            --arg invalidated_preparation_commit "$INVALIDATED_G11C2_PREPARATION_COMMIT" \
            --arg invalidated_preparation_tree "$INVALIDATED_G11C2_PREPARATION_TREE" \
            --arg invalidated_precheck_commit "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_COMMIT" \
            --arg invalidated_precheck_tree "$INVALIDATED_G11C2_PRECHECK_ACTIVATION_TREE" \
            --arg invalidated_append_commit "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_COMMIT" \
            --arg invalidated_append_tree "$INVALIDATED_G11C2_PRECHECK_RECEIPT_APPEND_TREE" \
            --arg invalidated_receipt_path "$INVALIDATED_G11C2_RECEIPT_PATH" \
            --arg invalidated_receipt_sha "$EXPECTED_INVALIDATED_G11C2_RECEIPT_SHA256" \
            --arg invalidated_receipt_blob "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BLOB" \
            --arg invalidated_receipt_payload "$EXPECTED_INVALIDATED_G11C2_RECEIPT_PAYLOAD_SHA256" \
            --argjson invalidated_receipt_bytes "$EXPECTED_INVALIDATED_G11C2_RECEIPT_BYTES" \
            --arg expected_raw_prefix "$EXPECTED_G11C4_RAW_PREFIX" \
            --arg expected_control_prefix "$EXPECTED_G11C4_CONTROL_PREFIX" '
              .entry_gate.live_adapter_gate == "READY" and
              .predecessor_ineligible_preparation_binding.preparation_commit == $ineligible_commit and
              .predecessor_ineligible_preparation_binding.preparation_tree == $ineligible_tree and
              .predecessor_ineligible_preparation_binding.terminal_receipt_path == $ineligible_receipt_path and
              .predecessor_ineligible_preparation_binding.terminal_receipt_sha256 == $ineligible_receipt_sha and
              .predecessor_ineligible_preparation_binding.terminal_receipt_git_blob == $ineligible_receipt_blob and
              .predecessor_ineligible_preparation_binding.terminal_receipt_payload_sha256 == $ineligible_receipt_payload and
              .predecessor_ineligible_preparation_binding.terminal_receipt_bytes == $ineligible_receipt_bytes and
              .predecessor_ineligible_preparation_binding.precheck_activation_created == false and
              .predecessor_ineligible_preparation_binding.live_activation_created == false and
              .predecessor_ineligible_preparation_binding.precheck_run_created == false and
              .predecessor_ineligible_preparation_binding.live_run_created == false and
              .predecessor_ineligible_preparation_binding.reuse_authorized == false and
              .predecessor_invalidated_g11c2_binding.preparation_commit == $invalidated_preparation_commit and
              .predecessor_invalidated_g11c2_binding.preparation_tree == $invalidated_preparation_tree and
              .predecessor_invalidated_g11c2_binding.precheck_activation_commit == $invalidated_precheck_commit and
              .predecessor_invalidated_g11c2_binding.precheck_activation_tree == $invalidated_precheck_tree and
              .predecessor_invalidated_g11c2_binding.precheck_terminal_receipt_append_commit == $invalidated_append_commit and
              .predecessor_invalidated_g11c2_binding.precheck_terminal_receipt_append_tree == $invalidated_append_tree and
              .predecessor_invalidated_g11c2_binding.precheck_run_id == 33469887723 and
              .predecessor_invalidated_g11c2_binding.terminal_receipt_path == $invalidated_receipt_path and
              .predecessor_invalidated_g11c2_binding.terminal_receipt_sha256 == $invalidated_receipt_sha and
              .predecessor_invalidated_g11c2_binding.terminal_receipt_git_blob == $invalidated_receipt_blob and
              .predecessor_invalidated_g11c2_binding.terminal_receipt_payload_sha256 == $invalidated_receipt_payload and
              .predecessor_invalidated_g11c2_binding.terminal_receipt_bytes == $invalidated_receipt_bytes and
              .predecessor_invalidated_g11c2_binding.terminal_checkpoint_commit == env.EXPECTED_PREPARATION_PARENT_COMMIT and
              .predecessor_invalidated_g11c2_binding.terminal_checkpoint_tree == env.EXPECTED_PREPARATION_PARENT_TREE and
              .predecessor_invalidated_g11c2_binding.live_activation_created == false and
              .predecessor_invalidated_g11c2_binding.live_run_created == false and
              .predecessor_invalidated_g11c2_binding.reuse_authorized == false and
              .custody_boundary.g11_raw_prefix == $expected_raw_prefix and
              .custody_boundary.g11_control_prefix == $expected_control_prefix and
              ([.custody_boundary.g11_raw_prefix,.custody_boundary.g11_control_prefix] | all(
                (contains("PMO-FINANCE-PAGE100-G11-20260901110618") | not) and
                (contains("PMO-FINANCE-PAGE100-G11C1-20260901123521") | not) and
                (contains("PMO-FINANCE-PAGE100-G11C2-20260901130250") | not) and
                (contains("FINANCE-PAGE100-PILOT-G11-20260901110618") | not) and
                (contains("FINANCE-PAGE100-PILOT-G11C1-20260901123521") | not) and
                (contains("FINANCE-PAGE100-PILOT-G11C2-20260901130250") | not))) and
              .entry_gate.live_session_policy_ascii_and_size_ceiling_verified == true and
              .entry_gate.live_session_policy_constraints.encoding == "ASCII" and
              .entry_gate.live_session_policy_constraints.maximum_bytes == 2048 and
              .entry_gate.live_session_policy_constraints.focused_precheck_validates_exact_bytes == true and
              .entry_gate.live_activation_precheck_pass_binding_contract.required_fields == ["receipt_append_commit","receipt_append_tree","execution_head_sha","execution_head_tree_sha"] and
              .entry_gate.live_activation_precheck_pass_binding_contract.legacy_ambiguous_commit_tree_fields_authorized == false and
              (.no_rerun.consumed_github_runs | index(33465583987)) != null and
              (.no_rerun.consumed_github_runs | index(33466306591)) != null and
              (.no_rerun.consumed_github_runs | index(33469887723)) != null and
              (.no_rerun.consumed_github_runs | index(33472741288)) != null and
              (.no_rerun.consumed_github_runs | index(33473465774)) != null and
              (.no_rerun.consumed_generation_ids | index("FINANCE-PAGE100-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_runtime_lock_ids | index("PMO-FINANCE-PAGE100-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_pilot_run_ids | index("FINANCE-PAGE100-PILOT-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_preparation_ids | index("FINANCE-PAGE100-G11C2-PREPARATION-20260901130250")) != null and
              (.no_rerun.consumed_precheck_act_ids | index("FINANCE-PAGE100-PRECHECK-ACT-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_live_act_ids | index("FINANCE-PAGE100-LIVE-ACT-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_latch_event_ids | index("FINANCE-PAGE100-LATCH-G11C2-20260901130250")) != null and
              (.no_rerun.consumed_generation_ids | index("FINANCE-PAGE100-G11C3-20260901134119")) != null and
              (.no_rerun.consumed_runtime_lock_ids | index("PMO-FINANCE-PAGE100-G11C3-20260901134119")) != null and
              (.no_rerun.consumed_pilot_run_ids | index("FINANCE-PAGE100-PILOT-G11C3-20260901134119")) != null and
              (.no_rerun.consumed_preparation_ids | index("FINANCE-PAGE100-G11C3-PREPARATION-20260901134119")) != null and
              (.no_rerun.consumed_precheck_act_ids | index("FINANCE-PAGE100-PRECHECK-ACT-G11C3-20260901134119")) != null and
              (.no_rerun.consumed_live_act_ids | index("FINANCE-PAGE100-LIVE-ACT-G11C3-20260901134119")) != null and
              (.no_rerun.consumed_latch_event_ids | index("FINANCE-PAGE100-LATCH-G11C3-20260901134119")) != null and
              .safe_executable_adapter.ready == true
            ' "$AUTHORITY_PATH" >/dev/null

          jq -e '
              .live_adapter_gate == "READY" and
              .precheck_pass_binding.live_adapter_gate == "READY" and
              .safe_executable_adapter.ready == true and
              .safe_executable_adapter.runner_path == env.RUNNER_PATH
            ' "$ACTIVATION_PATH" >/dev/null

          manifest_safe_adapter="$(jq -cS '.safe_executable_adapter' "$MANIFEST_PATH")"
          authority_safe_adapter="$(jq -cS '.safe_executable_adapter' "$AUTHORITY_PATH")"
          activation_safe_adapter="$(jq -cS '.safe_executable_adapter' "$ACTIVATION_PATH")"
          test "$authority_safe_adapter" = "$manifest_safe_adapter"
          test "$activation_safe_adapter" = "$manifest_safe_adapter"

          authority_order="$(jq -cS '.adapter_execution_order_binding' "$AUTHORITY_PATH")"
          manifest_order="$(jq -cS '.adapter_execution_order_binding' "$MANIFEST_PATH")"
          test "$authority_order" = "$manifest_order"
          jq -e '
              .adapter_execution_order_binding |
              .fixed_quota_day_kst == "2026-09-01" and
              .runtime_kst_date_equality_required_before_any_mutation == true and
              .exact_predecessor_get_object_version_reads == 5 and
              .ordered_read_roles == ["CHECKPOINT","RAW_PAGE_1","RAW_PAGE_2","RAW_PAGE_3","RAW_PAGE_4"] and
              .exact_live_list_bucket_versions_calls == 3 and
              .ordered_list_targets == ["FRESH_G11_GENERATION_PREFIX","FRESH_G11_CONTROL_PREFIX","EXACT_2026_09_01_EXECUTION_CLAIM_KEY"] and
              .all_reads_complete_before_execution_claim == true and
              .all_three_lists_complete_before_execution_claim == true and
              .execution_claim_create_precondition == "If-None-Match:*" and
              .execution_claim_created_before_provider_quota_or_other_write == true and
              .provider_quota_and_other_writes_before_claim == false and
              .precheck_performs_runtime_s3_reads == false and
              .live_head_object_calls == 0 and
              .live_predecessor_unversioned_get_object_calls == 0 and
              .fresh_g11_or_claim_unversioned_get_object_use == "UNCERTAIN_WRITE_RECONCILIATION_ONLY"
            ' "$AUTHORITY_PATH" >/dev/null

          jq -e '
              .runtime_quota_day_gate.required_value == "2026-09-01" and
              .execution_claim.fixed_quota_day_kst == "2026-09-01" and
              .execution_claim.all_five_predecessor_version_reads_required_before_create == true and
              .execution_claim.all_three_list_bucket_versions_reads_required_before_create == true and
              .execution_claim.prior_existence_read_authorized == true and
              .execution_claim.prior_existence_read_method == "BOUNDED_s3_ListBucketVersions_ONLY" and
              .execution_claim.prior_head_or_unversioned_get_authorized == false and
              .execution_claim.create_precondition == "If-None-Match:*" and
              .execution_claim.exact_version_readback_required == true
            ' "$ACTIVATION_PATH" >/dev/null

          jq -e '
            .artifact == "M3TOP3_FINANCE_CA_PAGE100_G11_DOWNSTREAM_OWNER_DECISION_RECEIPT_v1.1" and
            .correction_id == "OA-F01" and
            .selector_continuation_semantics.sealed_exclusion_scope == [36,37,38,39,40] and
            .selector_continuation_semantics.future_selector_match == "RAW_CUSTODY_THEN_FAIL_CLOSED" and
            .selector_continuation_semantics.future_selector_match_auto_excluded == false
          ' "$OWNER_DECISION_PATH" >/dev/null

          printf '%s\n' 'SEALED_EXECUTABLE_ADAPTER_READY_GATE_PASS'

      - name: Load three sealed non-expanding G11C4 session policies
        id: live-policies
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          jq -e '
            (has("Version") | not) and
            (keys == ["Statement"]) and
            (.Statement | length) == 1 and
            ((tostring | contains("${")) | not) and
            .Statement[0].Effect == "Allow" and
            .Statement[0].Action == "s3:GetObjectVersion" and
            .Statement[0].Resource ==
              "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/checkpoint.json" and
            .Statement[0].Condition.StringEquals["s3:VersionId"] ==
              "r3eu2mkgFklGzpZPyKq5xXrt50wa6JgU"
          ' "$CHECKPOINT_READ_POLICY_PATH" >/dev/null

          jq -e '
            (has("Version") | not) and
            (keys == ["Statement"]) and
            (.Statement | length) == 1 and
            ((tostring | contains("${")) | not) and
            .Statement[0].Effect == "Allow" and
            .Statement[0].Action == "s3:GetObjectVersion" and
            .Statement[0].Resource ==
              "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_generation/runtime_lock_id=PMO-FINANCE-PAGE100-G10-20260830044522/pilot_run_id=FINANCE-PAGE100-PILOT-G10-20260830044522/*" and
            .Statement[0].Condition.StringEquals["s3:VersionId"] == [
              "VdsI_D_jNujHIb9ff8loyRWtuAW737RI",
              "30whtf2xTpWQYXPmr.Kt5RBnK1Y_YDI4",
              "1dHYBfs4hg1tM7S6TckyUngOmfwWKZc2",
              "iBxAq9V.V7eA_doOM39JcVt_gtzAHskI"
            ]
          ' "$RAW_FOUR_READ_POLICY_PATH" >/dev/null

          jq -e '
            (has("Version") | not) and
            (keys == ["Statement"]) and
            (.Statement | length) == 2 and
            ((tostring | contains("${")) | not) and
            .Statement[0].Effect == "Allow" and
            .Statement[0].Action == "s3:ListBucketVersions" and
            .Statement[0].Resource == "arn:aws:s3:::semi-data-plane-aofspds-20260815" and
            .Statement[0].Condition.StringLike["s3:prefix"] == [
              "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_*/runtime_lock_id=PMO-FINANCE-PAGE100-G11C4-20260901143300/pilot_run_id=FINANCE-PAGE100-PILOT-G11C4-20260901143300/*",
              "raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-09-01/execution-claim.json"
            ] and
            .Statement[1].Effect == "Allow" and
            .Statement[1].Action == ["s3:PutObject","s3:GetObject","s3:GetObjectVersion"] and
            .Statement[1].Resource == [
              "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_generation/runtime_lock_id=PMO-FINANCE-PAGE100-G11C4-20260901143300/pilot_run_id=FINANCE-PAGE100-PILOT-G11C4-20260901143300/*",
              "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_pilot_control/runtime_lock_id=PMO-FINANCE-PAGE100-G11C4-20260901143300/pilot_run_id=FINANCE-PAGE100-PILOT-G11C4-20260901143300/*",
              "arn:aws:s3:::semi-data-plane-aofspds-20260815/raw/public-data-api/M3TOP3-FINANCE-STOCK-RIGHTS-v1/_writer_claims/quota_day_kst=2026-09-01/execution-claim.json"
            ]
          ' "$FINAL_LIST_WRITE_POLICY_PATH" >/dev/null

          mechanically_rotated_c3="$(jq -c '
            walk(if type == "string"
                 then gsub("G11C3-20260901134119"; "G11C4-20260901143300")
                 else . end)
          ' "$G11C3_LIVE_POLICY_PATH")"
          partitioned_in_c3_order="$(jq -cn \
            --slurpfile checkpoint "$CHECKPOINT_READ_POLICY_PATH" \
            --slurpfile raw_four "$RAW_FOUR_READ_POLICY_PATH" \
            --slurpfile final "$FINAL_LIST_WRITE_POLICY_PATH" \
            '{Statement:[
              $final[0].Statement[0],
              $raw_four[0].Statement[0],
              $checkpoint[0].Statement[0],
              $final[0].Statement[1]
            ]}')"
          test "$(printf '%s' "$partitioned_in_c3_order" | jq -cS .)" = \
            "$(printf '%s' "$mechanically_rotated_c3" | jq -cS .)"

          combined_statements="$(jq -cns \
            --slurpfile checkpoint "$CHECKPOINT_READ_POLICY_PATH" \
            --slurpfile raw_four "$RAW_FOUR_READ_POLICY_PATH" \
            --slurpfile final "$FINAL_LIST_WRITE_POLICY_PATH" \
            '$checkpoint[0].Statement + $raw_four[0].Statement + $final[0].Statement')"
          test "$(printf '%s' "$combined_statements" | jq 'length')" = '4'
          test "$(printf '%s' "$combined_statements" | jq -r '[.[].Action] | flatten | sort | @json')" = \
            '["s3:GetObject","s3:GetObjectVersion","s3:GetObjectVersion","s3:GetObjectVersion","s3:ListBucketVersions","s3:PutObject"]'
          for consumed_identity in \
            PMO-FINANCE-PAGE100-G11-20260901110618 \
            PMO-FINANCE-PAGE100-G11C1-20260901123521 \
            PMO-FINANCE-PAGE100-G11C2-20260901130250 \
            PMO-FINANCE-PAGE100-G11C3-20260901134119
          do
            case "$combined_statements" in *"$consumed_identity"*) exit 1 ;; esac
          done

          emit_policy() {
            output_name="$1"
            policy_path="$2"
            inline_policy="$(jq -c . "$policy_path")"
            test -n "$inline_policy"
            case "$inline_policy" in *'${'*) exit 1 ;; esac
            test "$(printf '%s' "$inline_policy" | tr -d '\040-\176' | wc -c | tr -d ' ')" = '0'
            inline_policy_chars="$(printf '%s' "$inline_policy" | wc -c | tr -d ' ')"
            test "$inline_policy_chars" -le 2048
            test "$(printf '%s' "$inline_policy" | jq -c .)" = "$inline_policy"
            printf '%s=%s\n' "$output_name" "$inline_policy" >> "$GITHUB_OUTPUT"
          }
          emit_policy checkpoint_json "$CHECKPOINT_READ_POLICY_PATH"
          emit_policy raw_four_json "$RAW_FOUR_READ_POLICY_PATH"
          emit_policy final_json "$FINAL_LIST_WRITE_POLICY_PATH"

      - name: Configure exact bounded G11C4 checkpoint-read OIDC session
        id: configure-checkpoint-read-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c4-checkpoint-${{ github.run_id }}
          role-duration-seconds: 21600
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: false
          output-credentials: true
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.live-policies.outputs.checkpoint_json }}

