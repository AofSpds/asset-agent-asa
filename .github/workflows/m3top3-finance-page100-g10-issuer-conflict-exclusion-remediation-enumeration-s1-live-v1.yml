name: M3Top3 Finance G10 Issuer Exclusion Enumeration S1 LIVE v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_LIVE_ACTIVATION_v1.0.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

env:
  AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_AUTHORITY_v1.0.json
  MANIFEST_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_MANIFEST_v1.0.json
  POLICY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_LIVE_SESSION_POLICY_v1.0.json
  ACTIVATION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_LIVE_ACTIVATION_v1.0.json
  PRECHECK_ACTIVATION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_PRECHECK_ACTIVATION_v1.0.json
  PRECHECK_PASS_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_PRECHECK_PASS_RECEIPT_v1.0.json
  TERMINAL_RECEIPT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_PRECHECK_TERMINAL_RECEIPT_33389710172_v1.0.json
  RUNNER_PATH: tools/m3top3/finance_page100_g10_issuer_conflict_exclusion_enumeration_s1.py
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  AWS_MAX_ATTEMPTS: '1'
  AWS_RETRY_MODE: standard
  AWS_PAGER: ''

jobs:
  live:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      github.event.forced == false &&
      github.event.head_commit.message == 'Arm G10 issuer-group exclusion enumeration S1 LIVE 20260831130000 v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m3top3-source-admission
    steps:
      - name: Checkout exact S1 LIVE activation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Fail-closed exact actor message PRECHECK PASS and lineage preflight
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$EVENT_REPOSITORY" = 'AofSpds/asset-agent-asa'
          test "$EVENT_ACTOR" = 'AofSpds'
          test "$EVENT_TRIGGERING_ACTOR" = 'AofSpds'
          test "$EVENT_REF" = 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828'
          test "$EVENT_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$EVENT_AFTER"
          test "$(git rev-parse HEAD^)" = "$EVENT_BEFORE"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B HEAD)" = 'Arm G10 issuer-group exclusion enumeration S1 LIVE 20260831130000 v1.0'
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$ACTIVATION_PATH")"

          precheck_pass_commit="$(git rev-parse HEAD^)"
          precheck_activation_commit="$(git rev-parse HEAD^^)"
          preparation_commit="$(git rev-parse HEAD^^^)"
          test "$(git show -s --format=%P "$precheck_pass_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git show -s --format=%P "$precheck_activation_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git show -s --format=%P "$preparation_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B "$precheck_pass_commit")" = 'Record G10 issuer-group exclusion enumeration S1 PRECHECK PASS 20260831130000 v1.0'
          test "$(git log -1 --pretty=%B "$precheck_activation_commit")" = 'Arm G10 issuer-group exclusion enumeration S1 PRECHECK 20260831130000 v1.0'
          test "$(git log -1 --pretty=%B "$preparation_commit")" = 'Prepare G10 issuer-group exclusion enumeration S1 20260831130000 v1.0'
          test "$(git rev-parse "${preparation_commit}^")" = '9708c21fee0137261926417561fd4e7694571660'
          test "$(git rev-parse "${preparation_commit}^^{tree}")" = '1a9da9beffa9f1d841a94b8fb945a11125025127'
          test "$(git diff-tree --no-commit-id --name-status -r "$precheck_activation_commit")" = "$(printf 'A\t%s' "$PRECHECK_ACTIVATION_PATH")"
          test "$(git diff-tree --no-commit-id --name-status -r "$precheck_pass_commit")" = "$(printf 'A\t%s' "$PRECHECK_PASS_PATH")"

          test -f "$AUTHORITY_PATH"
          test -f "$MANIFEST_PATH"
          test -f "$POLICY_PATH"
          test -f "$RUNNER_PATH"
          test -f "$PRECHECK_PASS_PATH"
          test -f "$TERMINAL_RECEIPT_PATH"
          actual_preparation_diff="$(git diff-tree --no-commit-id --name-status -r "$preparation_commit" | LC_ALL=C sort)"
          expected_preparation_diff="$(
            {
              jq -r '.preparation_files | keys[]' "$MANIFEST_PATH"
              printf '%s\n' "$MANIFEST_PATH"
            } | LC_ALL=C sort | sed $'s/^/A\t/'
          )"
          test "$actual_preparation_diff" = "$expected_preparation_diff"
          test "$(wc -c < "$TERMINAL_RECEIPT_PATH" | tr -d ' ')" = '2620'
          test "$(sha256sum -- "$TERMINAL_RECEIPT_PATH" | cut -d' ' -f1)" = '4c8662f08e2733fd2201aafba477aeb4019692506ea633932b7052aa53de2e3e'
          test "$(git hash-object -- "$TERMINAL_RECEIPT_PATH")" = '037a1f7fa9e291434fee355e3634a063c95814c6'

          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          pass_tree="$(git rev-parse "${precheck_pass_commit}^{tree}")"
          pass_bytes="$(wc -c < "$PRECHECK_PASS_PATH" | tr -d ' ')"
          pass_sha="$(sha256sum -- "$PRECHECK_PASS_PATH" | cut -d' ' -f1)"
          pass_blob="$(git hash-object -- "$PRECHECK_PASS_PATH")"
          precheck_activation_tree="$(git rev-parse "${precheck_activation_commit}^{tree}")"
          precheck_activation_bytes="$(wc -c < "$PRECHECK_ACTIVATION_PATH" | tr -d ' ')"
          precheck_activation_sha="$(sha256sum -- "$PRECHECK_ACTIVATION_PATH" | cut -d' ' -f1)"
          precheck_activation_blob="$(git hash-object -- "$PRECHECK_ACTIVATION_PATH")"
          jq -e \
            --arg preparation_commit "$preparation_commit" \
            --arg preparation_tree "$preparation_tree" \
            --arg pass_commit "$precheck_pass_commit" \
            --arg pass_tree "$pass_tree" \
            --arg pass_bytes "$pass_bytes" \
            --arg pass_sha "$pass_sha" \
            --arg pass_blob "$pass_blob" \
            --arg authority_sha "$(sha256sum -- "$AUTHORITY_PATH" | cut -d' ' -f1)" \
            --arg manifest_sha "$(sha256sum -- "$MANIFEST_PATH" | cut -d' ' -f1)" \
            --arg policy_sha "$(sha256sum -- "$POLICY_PATH" | cut -d' ' -f1)" \
            '.artifact == "M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_LIVE_ACTIVATION_v1.0" and
             .state == "ARMED_FRESH_EXACT_FOUR_VERSION_READ_ONLY_ENUMERATION_ONCE" and
             .armed == true and
             .repository == "AofSpds/asset-agent-asa" and
             .branch == "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828" and
             .expected_commit_message == "Arm G10 issuer-group exclusion enumeration S1 LIVE 20260831130000 v1.0" and
             .preparation_commit_sha == $preparation_commit and
             .preparation_tree_sha == $preparation_tree and
             .authority_sha256 == $authority_sha and
             .manifest_sha256 == $manifest_sha and
             .policy_sha256 == $policy_sha and
             .precheck_pass_binding.path == env.PRECHECK_PASS_PATH and
             .precheck_pass_binding.commit_sha == $pass_commit and
             .precheck_pass_binding.tree_sha == $pass_tree and
             (.precheck_pass_binding.bytes | tostring) == $pass_bytes and
             .precheck_pass_binding.sha256 == $pass_sha and
             .precheck_pass_binding.git_blob_sha == $pass_blob and
             .preparation_parent == {"terminal_commit_sha":"9708c21fee0137261926417561fd4e7694571660","terminal_tree_sha":"1a9da9beffa9f1d841a94b8fb945a11125025127"}' \
            "$ACTIVATION_PATH" >/dev/null

          jq -e \
            --arg precheck_activation_commit "$precheck_activation_commit" \
            --arg precheck_activation_tree "$precheck_activation_tree" \
            --arg precheck_activation_bytes "$precheck_activation_bytes" \
            --arg precheck_activation_sha "$precheck_activation_sha" \
            --arg precheck_activation_blob "$precheck_activation_blob" \
            --arg preparation_commit "$preparation_commit" \
            --arg preparation_tree "$preparation_tree" \
            '.artifact == "M3TOP3_FINANCE_CA_PAGE100_G10_ISSUER_CONFLICT_EXCLUSION_REMEDIATION_ENUMERATION_S1_PRECHECK_PASS_RECEIPT_v1.0" and
             .state == "PASS_FRESH_BOUNDED_S1_PRECHECK_LIVE_NOT_STARTED" and
             .repository == "AofSpds/asset-agent-asa" and
             .branch == "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828" and
             .generation_id == "G10-ISSUER-GROUP-EXCLUSION-ENUMERATION-S1-20260831130000" and
             .exact_enumeration_started == false and
             .preparation == {"head_sha":$preparation_commit,"tree_sha":$preparation_tree} and
             .activation_binding.path == env.PRECHECK_ACTIVATION_PATH and
             .activation_binding.commit_sha == $precheck_activation_commit and
             .activation_binding.tree_sha == $precheck_activation_tree and
             (.activation_binding.bytes | tostring) == $precheck_activation_bytes and
             .activation_binding.sha256 == $precheck_activation_sha and
             .activation_binding.git_blob_sha == $precheck_activation_blob and
             .workflow.actor == "AofSpds" and
             .workflow.triggering_actor == "AofSpds" and
             .workflow.event == "push" and
             .workflow.head_sha == $precheck_activation_commit and
             .workflow.path == ".github/workflows/m3top3-finance-page100-g10-issuer-conflict-exclusion-remediation-enumeration-s1-precheck-v1.yml" and
             .workflow.conclusion == "success" and
             .workflow.run_attempt == 1 and
             .effects == {"aws_or_s3_calls":0,"company_master_or_universe_mutations":0,"finance_provider_api_calls":0,"g10_or_g11_runs":0,"github_actions_artifacts_uploaded":0,"normalization_pit_promotion_release_production_actions":0,"oidc_assume_role_with_web_identity_calls":0,"provider_quota_reservations":0,"raw_bytes":0,"remote_custody_mutations":0,"remote_mutations":0,"repository_mutations":0,"s3_copy_object_calls":0,"s3_delete_object_calls":0,"s3_get_bucket_location_calls":0,"s3_get_bucket_versioning_calls":0,"s3_get_object_calls_without_version":0,"s3_get_object_version_calls":0,"s3_head_object_calls":0,"s3_list_object_versions_calls":0,"s3_list_objects_calls":0,"s3_put_object_calls":0,"sts_get_caller_identity_calls":0}' \
            "$PRECHECK_PASS_PATH" >/dev/null

      - name: Validate exact S1 LIVE activation and durable PRECHECK PASS offline
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          preparation_commit="$(git rev-parse HEAD^^^)"
          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          python "$RUNNER_PATH" live-preflight \
            --root . \
            --authority "$AUTHORITY_PATH" \
            --manifest "$MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --activation "$ACTIVATION_PATH" \
            --precheck-pass "$PRECHECK_PASS_PATH" \
            --expected-preparation-commit "$preparation_commit" \
            --expected-preparation-tree "$preparation_tree"

      - name: Load exact compact S1 LIVE session policy
        id: live-policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < "$POLICY_PATH" | tr -d ' ')" = '1'
          test "$(wc -c < "$POLICY_PATH" | tr -d ' ')" -le '2048'
          jq -e \
            '.Version == "2012-10-17" and
             (.Statement | length) == 1 and
             .Statement[0].Effect == "Allow" and
             .Statement[0].Action == "s3:GetObjectVersion" and
             (.Statement[0].Resource | length) == 4 and
             (.Statement[0].Condition.StringEquals["s3:VersionId"] | length) == 4' \
            "$POLICY_PATH" >/dev/null
          {
            echo 'json<<S1_POLICY_EOF'
            cat "$POLICY_PATH"
            echo 'S1_POLICY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Configure exact-four-version read-only AWS OIDC session
        id: configure-live-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: g10-issuer-exclusion-enum-s1-${{ github.run_id }}
          role-duration-seconds: 1800
          retry-max-attempts: 1
          disable-retry: true
          allowed-account-ids: '956315449338'
          output-env-credentials: true
          output-credentials: false
          mask-aws-account-id: true
          role-skip-session-tagging: true
          inline-session-policy: ${{ steps.live-policy.outputs.json }}

      - name: Read exact four versions and emit sanitized enumeration result only
        shell: bash
        env:
          CONFIGURED_AWS_ACCOUNT_ID: ${{ steps.configure-live-aws.outputs.aws-account-id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          preparation_commit="$(git rev-parse HEAD^^^)"
          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          python "$RUNNER_PATH" live \
            --root . \
            --authority "$AUTHORITY_PATH" \
            --manifest "$MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --activation "$ACTIVATION_PATH" \
            --precheck-pass "$PRECHECK_PASS_PATH" \
            --expected-preparation-commit "$preparation_commit" \
            --expected-preparation-tree "$preparation_tree"
