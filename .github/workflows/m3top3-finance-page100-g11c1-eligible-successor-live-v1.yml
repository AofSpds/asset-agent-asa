              )))) and
            ([.Statement[].Condition.StringEquals["s3:VersionId"]? | select(. != null)] | flatten | sort) ==
              (["VdsI_D_jNujHIb9ff8loyRWtuAW737RI",
                "30whtf2xTpWQYXPmr.Kt5RBnK1Y_YDI4",
                "1dHYBfs4hg1tM7S6TckyUngOmfwWKZc2",
                "iBxAq9V.V7eA_doOM39JcVt_gtzAHskI",
