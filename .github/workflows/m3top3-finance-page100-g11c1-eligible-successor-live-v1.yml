              .effects.s3_other_read_calls == .effects.s3_other_calls and
              .effects.aws_calls ==
                (.effects.s3_get_calls + .effects.s3_put_calls + .effects.s3_other_calls) and
              .effects.s3_calls == .effects.aws_calls and
              .effects.remote_custody_mutations ==
                (.effects.raw_writes + .effects.checkpoint_writes +
                 .effects.execution_claim_writes + .effects.terminal_receipt_writes) and
              .effects.remote_custody_mutations <= .effects.s3_put_calls and
              .effects.successful_put_mutations == .effects.remote_custody_mutations and
              .effects.unconfirmed_or_failed_put_attempts ==
                (.effects.s3_put_attempts - .effects.successful_put_mutations) and
              .effects.normalization_actions == 0 and
              .effects.pit_actions == 0 and
              .effects.promotion_actions == 0 and
              .effects.release_actions == 0 and
              .effects.production_actions == 0 and
              .effects.company_master_mutations == 0 and
              .effects.universe_mutations == 0 and
              .effects.company_master_or_universe_mutations == 0 and
              .effects.repository_writes == 0 and
              .effects.repository_mutations_by_workflow == 0 and
              .effects.github_actions_artifacts_uploaded == 0 and
              .effects.effects_reconciled == true and
              .effects.ambiguous_side_effects == false and
              .effect_reconciliation.complete == true and
              .effect_reconciliation.ambiguous_side_effects == false and
              (if .entry_gate == "LIVE_ENTERED_ONCE"
               then (.effects.execution_claim_writes == 1 and
                     .effects.s3_other_calls == 3 and
                     .effects.s3_get_calls >= 5)
               else (.effects.execution_claim_writes == 0 and
                     .effects.provider_calls == 0 and
                     .effects.quota_reservations == 0 and
                     .effects.raw_writes == 0 and
                     .effects.checkpoint_writes == 0 and
                     .effects.terminal_receipt_writes == 0 and
                     .effects.terminal_receipt_put_attempts == 0 and
                     .effects.remote_custody_mutations == 0) end) and
              (if (.effects.remote_custody_mutations > 0 or
                   .effects.provider_calls > 0 or
                   .effects.quota_reservations > 0)
               then .effects.execution_claim_writes == 1
               else true end)
            ' "$LIVE_OUTPUT" >/dev/null
          if test "$runner_status" -ne 0; then
            jq -e '
              .verdict == "FAIL_CLOSED" and
              .no_rerun.same_run_retry_authorized == false and
              .no_rerun.same_activation_reuse_authorized == false and
              .no_rerun.same_latch_reuse_authorized == false
            ' "$LIVE_OUTPUT" >/dev/null
            exit "$runner_status"
          fi

          jq -e \
            --argjson acquisition_ceiling "$G11C1_PRIMARY_ACQUISITION_CEILING" \
            --argjson attempt_ceiling "$G11C1_NETWORK_ATTEMPT_CEILING" '
              .verdict == "PASS" and
              .entry_gate == "LIVE_ENTERED_ONCE" and
              .live_adapter_gate == "READY" and
              .execution_binding.head_sha == env.G11C1_LIVE_HEAD_SHA and
              .execution_binding.tree_sha == env.G11C1_LIVE_HEAD_TREE and
              .effects.primary_acquisitions >= 0 and
