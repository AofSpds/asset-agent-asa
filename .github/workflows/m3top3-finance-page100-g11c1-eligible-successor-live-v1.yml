      - name: Configure exact bounded G11C1 AWS OIDC session
        id: configure-live-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::956315449338:role/M3Top3GitHubOIDCRawWriter
          aws-region: ap-northeast-2
          role-session-name: finance-page100-g11c1-${{ github.run_id }}
