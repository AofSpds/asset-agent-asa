              .entry_gate.live_adapter_gate == "READY" and
              (.no_rerun.consumed_github_runs | index(33465583987)) != null and
              (.no_rerun.consumed_github_runs | index(33466306591)) != null and
              .safe_executable_adapter.ready == true
