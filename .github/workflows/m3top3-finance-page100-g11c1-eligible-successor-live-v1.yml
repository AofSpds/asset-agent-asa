              .execution_claim.prior_existence_read_authorized == true and
              .execution_claim.prior_existence_read_method == "BOUNDED_s3_ListBucketVersions_ONLY" and
              .execution_claim.prior_head_or_unversioned_get_authorized == false and
              .execution_claim.create_precondition == "If-None-Match:*" and
              .execution_claim.exact_version_readback_required == true
            ' "$ACTIVATION_PATH" >/dev/null

          jq -e '
            .artifact == "M3TOP3_FINANCE_CA_PAGE100_G11_DOWNSTREAM_OWNER_DECISION_RECEIPT_v1.1" and
