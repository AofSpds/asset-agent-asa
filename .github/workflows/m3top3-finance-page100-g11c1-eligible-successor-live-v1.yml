name: M3Top3 Finance Page100 G11C1 Eligible Successor LIVE v1.0

on:
  push:
    branches:
      - aaa-pmo-public-data-g2-g3-source-admission-v1-20260828
    paths:
      - control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_LIVE_ACTIVATION_v1.0.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: m3top3-finance-bounded-live-pilot-v1
  cancel-in-progress: false

env:
  AUTHORITY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_AUTHORITY_v1.0.json
  PLAN_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_PLAN_v1.0.json
  SEED_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_CHECKPOINT_SEED_v1.0.json
  MANIFEST_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_MANIFEST_v1.0.json
  OWNER_DECISION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11_DOWNSTREAM_OWNER_DECISION_RECEIPT_v1.1.json
  PRECHECK_ACTIVATION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_PRECHECK_ACTIVATION_v1.0.json
  PRECHECK_RECEIPT_PREFIX: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_PRECHECK_TERMINAL_RECEIPT_
  ACTIVATION_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_LIVE_ACTIVATION_v1.0.json
  RUNNER_PATH: tools/m3top3/finance_page100_g11c1_selector_successor.py
  TEST_PATH: tools/m3top3/tests/test_finance_page100_g11c1_selector_successor.py
  LIVE_ADAPTER_PATH: tools/m3top3/finance_page100_g11c1_live_adapter.py
  ADAPTER_TEST_PATH: tools/m3top3/tests/test_finance_page100_g11c1_live_adapter.py
  PRECHECK_POLICY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_PRECHECK_SESSION_POLICY_v1.0.json
  LIVE_POLICY_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_LIVE_SESSION_POLICY_v1.0.json
  RECEIPT_SCHEMA_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_FOCUSED_PRECHECK_TERMINAL_RECEIPT_SCHEMA_v1.0.json
  RECEIPT_GENERATOR_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11C1_FOCUSED_PRECHECK_TERMINAL_RECEIPT_GENERATOR_v1.0.py
  PRECHECK_WORKFLOW_PATH: .github/workflows/m3top3-finance-page100-g11c1-eligible-successor-precheck-v1.yml
  LIVE_WORKFLOW_PATH: .github/workflows/m3top3-finance-page100-g11c1-eligible-successor-live-v1.yml
  EXPECTED_MESSAGE: Arm M3Top3 Finance Page100 G11C1 bounded LIVE 20260901123521 v1.0
  EXPECTED_PRECHECK_MESSAGE: Arm M3Top3 Finance Page100 G11C1 focused PRECHECK 20260901123521 v1.0
  EXPECTED_PRECHECK_RECEIPT_MESSAGE: Record M3Top3 Finance Page100 G11C1 focused PRECHECK PASS 20260901123521 v1.0
  EXPECTED_PREPARATION_MESSAGE: Prepare M3Top3 Finance page100 G11C1 eligible successor 20260901123521 v1.0
  EXPECTED_PREPARATION_PARENT_COMMIT: e8b0b93714060627b2fbc124566eb6a5b32cf9d5
  EXPECTED_PREPARATION_PARENT_TREE: 0d4465091a680c1ac9ad6c7aed3aed8f606f57ea
  FAILURE_RECEIPT_PATH: control/m3top3/public-data-source-admission/v1.0/M3TOP3_FINANCE_CA_PAGE100_G11_ELIGIBLE_SUCCESSOR_LIVE_TERMINAL_RECEIPT_33466306591_v1.0.json
  EXPECTED_FAILURE_RECEIPT_BLOB: 00bd90fa57062e438bcddfdcc36be9a5694ef3d9
  EXPECTED_FAILURE_RECEIPT_SHA256: 0577dbbacefa40e60e402dcfb37dd0a85c621952ac29314b56a8481d5e2087d6
  EXPECTED_OWNER_DECISION_BLOB: 1a20b86b784c1c69b407a432e08fb476c60b496d
  EXPECTED_OWNER_DECISION_SHA256: 9efa622791a036c870ff4cded87bc4123cfae8089382c90a9ee2e804955ec6dd
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  AWS_MAX_ATTEMPTS: '1'
  AWS_RETRY_MODE: standard
  AWS_PAGER: ''
  G11C1_PRIMARY_ACQUISITION_CEILING: '1696'
  G11C1_NETWORK_ATTEMPT_CEILING: '1996'
  MAX_ATTEMPTS_PER_LOGICAL_PAGE: '2'

jobs:
  live:
    if: >-
      github.repository == 'AofSpds/asset-agent-asa' &&
      github.event_name == 'push' &&
      github.actor == 'AofSpds' &&
      github.triggering_actor == 'AofSpds' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828' &&
      github.event.forced == false &&
      github.event.head_commit.message == 'Arm M3Top3 Finance Page100 G11C1 bounded LIVE 20260901123521 v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: m3top3-source-admission
    steps:
      - name: Checkout exact fresh LIVE activation revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 7
          persist-credentials: false

      - name: Fail closed on LIVE lineage material or PRECHECK receipt drift
        id: live-lineage
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$EVENT_REPOSITORY" = 'AofSpds/asset-agent-asa'
          test "$EVENT_ACTOR" = 'AofSpds'
          test "$EVENT_TRIGGERING_ACTOR" = 'AofSpds'
          test "$EVENT_REF" = 'refs/heads/aaa-pmo-public-data-g2-g3-source-admission-v1-20260828'
          test "$EVENT_RUN_ATTEMPT" = '1'
          test "$(TZ=Asia/Seoul date +%F)" = '2026-09-01'
          test "$(git rev-parse HEAD)" = "$EVENT_AFTER"
          test "$(git rev-parse HEAD^)" = "$EVENT_BEFORE"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B HEAD)" = "$EXPECTED_MESSAGE"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$ACTIVATION_PATH")"

          receipt_commit="$(git rev-parse HEAD^)"
          precheck_activation_commit="$(git rev-parse HEAD^^)"
          preparation_commit="$(git rev-parse HEAD^^^)"
          preparation_tree="$(git rev-parse "${preparation_commit}^{tree}")"
          receipt_tree="$(git rev-parse "${receipt_commit}^{tree}")"
          precheck_activation_tree="$(git rev-parse "${precheck_activation_commit}^{tree}")"
          precheck_receipt_path="$(jq -r '.precheck_pass_binding.path // empty' "$ACTIVATION_PATH")"
          case "$precheck_receipt_path" in
            "$PRECHECK_RECEIPT_PREFIX"[0-9]*_v1.0.json) ;;
            *) exit 1 ;;
          esac
          receipt_run_id="${precheck_receipt_path#"$PRECHECK_RECEIPT_PREFIX"}"
          receipt_run_id="${receipt_run_id%_v1.0.json}"
          test -n "$receipt_run_id"
          test "$(printf '%s' "$receipt_run_id" | tr -cd '0-9')" = "$receipt_run_id"

          test "$(git show -s --format=%P "$receipt_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git show -s --format=%P "$precheck_activation_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git show -s --format=%P "$preparation_commit" | wc -w | tr -d ' ')" = '1'
          test "$(git log -1 --pretty=%B "$receipt_commit")" = "$EXPECTED_PRECHECK_RECEIPT_MESSAGE"
          test "$(git log -1 --pretty=%B "$precheck_activation_commit")" = "$EXPECTED_PRECHECK_MESSAGE"
          test "$(git log -1 --pretty=%B "$preparation_commit")" = "$EXPECTED_PREPARATION_MESSAGE"
          test "$(git diff-tree --no-commit-id --name-status -r "$receipt_commit")" = "$(printf 'A\t%s' "$precheck_receipt_path")"
          test "$(git diff-tree --no-commit-id --name-status -r "$precheck_activation_commit")" = "$(printf 'A\t%s' "$PRECHECK_ACTIVATION_PATH")"
          test "$(git rev-parse "${preparation_commit}^")" = "$EXPECTED_PREPARATION_PARENT_COMMIT"
          test "$(git rev-parse "${preparation_commit}^^{tree}")" = "$EXPECTED_PREPARATION_PARENT_TREE"
          test -f "$FAILURE_RECEIPT_PATH"
          test "$(git hash-object -- "$FAILURE_RECEIPT_PATH")" = "$EXPECTED_FAILURE_RECEIPT_BLOB"
          test "$(sha256sum -- "$FAILURE_RECEIPT_PATH" | cut -d' ' -f1)" = "$EXPECTED_FAILURE_RECEIPT_SHA256"

          for path in \
            "$AUTHORITY_PATH" \
            "$PLAN_PATH" \
            "$SEED_PATH" \
            "$MANIFEST_PATH" \
            "$OWNER_DECISION_PATH" \
            "$PRECHECK_ACTIVATION_PATH" \
            "$ACTIVATION_PATH" \
            "$RUNNER_PATH" \
            "$TEST_PATH" \
            "$LIVE_ADAPTER_PATH" \
            "$ADAPTER_TEST_PATH" \
            "$PRECHECK_POLICY_PATH" \
            "$LIVE_POLICY_PATH" \
            "$RECEIPT_SCHEMA_PATH" \
            "$RECEIPT_GENERATOR_PATH" \
            "$PRECHECK_WORKFLOW_PATH" \
            "$LIVE_WORKFLOW_PATH"
          do
            test -f "$path"
          done
          test -f "$precheck_receipt_path"

          test "$(git hash-object -- "$OWNER_DECISION_PATH")" = "$EXPECTED_OWNER_DECISION_BLOB"
          test "$(sha256sum -- "$OWNER_DECISION_PATH" | cut -d' ' -f1)" = "$EXPECTED_OWNER_DECISION_SHA256"

          manifest_sha="$(sha256sum -- "$MANIFEST_PATH" | cut -d' ' -f1)"
          manifest_blob="$(git hash-object -- "$MANIFEST_PATH")"
          activation_preparation_commit="$(jq -r '.activation_binding.preparation_commit // empty' "$ACTIVATION_PATH")"
          activation_preparation_tree="$(jq -r '.activation_binding.preparation_tree // empty' "$ACTIVATION_PATH")"
          activation_manifest_sha="$(jq -r '.material_bindings.manifest_sha256 // empty' "$ACTIVATION_PATH")"
          activation_manifest_blob="$(jq -r '.material_bindings.manifest_git_blob // empty' "$ACTIVATION_PATH")"
          test "$activation_preparation_commit" = "$preparation_commit"
          test "$activation_preparation_tree" = "$preparation_tree"
          test "$activation_manifest_sha" = "$manifest_sha"
          test "$activation_manifest_blob" = "$manifest_blob"

          verify_manifest_file() {
            role="$1"
            expected_path="$2"
            bound_path="$(jq -r --arg role "$role" '.files[$role].path // empty' "$MANIFEST_PATH")"
            bound_sha="$(jq -r --arg role "$role" '.files[$role].sha256 // empty' "$MANIFEST_PATH")"
            bound_blob="$(jq -r --arg role "$role" '.files[$role].git_blob // empty' "$MANIFEST_PATH")"
            test "$bound_path" = "$expected_path"
            test -f "$bound_path"
            test "$(sha256sum -- "$bound_path" | cut -d' ' -f1)" = "$bound_sha"
            test "$(git hash-object -- "$bound_path")" = "$bound_blob"
          }
          verify_manifest_file authority "$AUTHORITY_PATH"
          verify_manifest_file plan "$PLAN_PATH"
          verify_manifest_file seed "$SEED_PATH"
          verify_manifest_file runner "$RUNNER_PATH"
          verify_manifest_file tests "$TEST_PATH"
          verify_manifest_file live_adapter "$LIVE_ADAPTER_PATH"
          verify_manifest_file adapter_tests "$ADAPTER_TEST_PATH"
          verify_manifest_file precheck_session_policy "$PRECHECK_POLICY_PATH"
          verify_manifest_file live_session_policy "$LIVE_POLICY_PATH"
          verify_manifest_file precheck_workflow "$PRECHECK_WORKFLOW_PATH"
          verify_manifest_file live_workflow "$LIVE_WORKFLOW_PATH"
          verify_manifest_file precheck_receipt_schema "$RECEIPT_SCHEMA_PATH"
          verify_manifest_file precheck_receipt_generator "$RECEIPT_GENERATOR_PATH"
          while IFS=$'\t' read -r role bound_path; do
            case "$bound_path" in
              ''|/*|../*|*/../*|*/..) exit 1 ;;
            esac
            verify_manifest_file "$role" "$bound_path"
          done < <(jq -r '.files | to_entries[] | [.key,.value.path] | @tsv' "$MANIFEST_PATH")

          expected_preparation_paths="$({
            printf '%s\n' "$MANIFEST_PATH"
            jq -r '.files | to_entries[].value.path' "$MANIFEST_PATH"
          } | LC_ALL=C sort -u)"
          observed_preparation_paths="$(
            git diff-tree --no-commit-id --name-only -r "$preparation_commit" |
              LC_ALL=C sort -u
          )"
          test "$observed_preparation_paths" = "$expected_preparation_paths"

          receipt_blob="$(git hash-object -- "$precheck_receipt_path")"
          receipt_sha="$(sha256sum -- "$precheck_receipt_path" | cut -d' ' -f1)"
          receipt_bytes="$(wc -c < "$precheck_receipt_path" | tr -d ' ')"
          receipt_job_id="$(jq -r '.github_job_id | tostring' "$precheck_receipt_path")"
          test -n "$receipt_job_id"
          test "$(printf '%s' "$receipt_job_id" | tr -cd '0-9')" = "$receipt_job_id"
          precheck_activation_blob="$(git hash-object -- "$PRECHECK_ACTIVATION_PATH")"
          precheck_activation_sha="$(sha256sum -- "$PRECHECK_ACTIVATION_PATH" | cut -d' ' -f1)"
          authority_sha="$(sha256sum -- "$AUTHORITY_PATH" | cut -d' ' -f1)"
          plan_sha="$(sha256sum -- "$PLAN_PATH" | cut -d' ' -f1)"
          seed_sha="$(sha256sum -- "$SEED_PATH" | cut -d' ' -f1)"
          owner_decision_sha="$(sha256sum -- "$OWNER_DECISION_PATH" | cut -d' ' -f1)"
          runner_sha="$(sha256sum -- "$RUNNER_PATH" | cut -d' ' -f1)"
          test_sha="$(sha256sum -- "$TEST_PATH" | cut -d' ' -f1)"
          precheck_policy_sha="$(sha256sum -- "$PRECHECK_POLICY_PATH" | cut -d' ' -f1)"
          live_policy_sha="$(sha256sum -- "$LIVE_POLICY_PATH" | cut -d' ' -f1)"
          precheck_workflow_sha="$(sha256sum -- "$PRECHECK_WORKFLOW_PATH" | cut -d' ' -f1)"

          jq -e \
            --arg precheck_activation_commit "$precheck_activation_commit" \
            --arg precheck_activation_tree "$precheck_activation_tree" \
            --arg precheck_activation_sha "$precheck_activation_sha" \
            --arg receipt_run_id "$receipt_run_id" \
            --arg authority_sha "$authority_sha" \
            --arg plan_sha "$plan_sha" \
            --arg manifest_sha "$manifest_sha" '
              .artifact == ("M3TOP3_FINANCE_CA_PAGE100_G11C1_ELIGIBLE_SUCCESSOR_PRECHECK_TERMINAL_RECEIPT_" + $receipt_run_id + "_v1.0") and
              .repository == "AofSpds/asset-agent-asa" and
              .branch == "aaa-pmo-public-data-g2-g3-source-admission-v1-20260828" and
              .result == "PASS" and
              .terminal_state == "TERMINAL_PASS_FOCUSED_G11C1_PRECHECK_ZERO_EXTERNAL_EFFECT_LIVE_NOT_AUTHORIZED" and
              .commit == $precheck_activation_commit and
              .tree == $precheck_activation_tree and
              (.github_run_id | tostring) == $receipt_run_id and
              (.github_job_id | tostring | test("^[0-9]+$")) and
              .github_run_attempt == 1 and
              .generation_id == "FINANCE-PAGE100-G11C1-20260901123521" and
              .runtime_lock_id == "PMO-FINANCE-PAGE100-G11C1-20260901123521" and
              .pilot_run_id == "FINANCE-PAGE100-PILOT-G11C1-20260901123521" and
              .act_id == "FINANCE-PAGE100-PRECHECK-ACT-G11C1-20260901123521" and
              (.execution_binding.run_id | tostring) == $receipt_run_id and
              .execution_binding.head_sha == $precheck_activation_commit and
              .execution_binding.tree_sha == $precheck_activation_tree and
              .execution_binding.run_attempt == 1 and
              (.execution_binding.job_id | tostring | test("^[0-9]+$"))
            ' "$precheck_receipt_path" >/dev/null

          # Keep the longer receipt contract in a separate assertion so the
          # Boolean grouping above cannot accidentally weaken any condition.
          jq -e \
            --arg precheck_activation_commit "$precheck_activation_commit" \
            --arg precheck_activation_tree "$precheck_activation_tree" \
            --arg precheck_activation_sha "$precheck_activation_sha" \
            --arg receipt_run_id "$receipt_run_id" \
            --arg receipt_job_id "$receipt_job_id" \
            --arg preparation_commit "$preparation_commit" \
            --arg preparation_tree "$preparation_tree" \
            --arg owner_decision_sha "$owner_decision_sha" \
            --arg authority_sha "$authority_sha" \
            --arg plan_sha "$plan_sha" \
            --arg seed_sha "$seed_sha" \
            --arg manifest_sha "$manifest_sha" '
              .execution_binding.head_sha == $precheck_activation_commit and
              .execution_binding.tree_sha == $precheck_activation_tree and
              (.execution_binding.run_id | tostring) == $receipt_run_id and
              .execution_binding.run_attempt == 1 and
              .activation_binding.activation_path == env.PRECHECK_ACTIVATION_PATH and
              .activation_binding.activation_sha256 == $precheck_activation_sha and
              .activation_binding.preparation_commit == $preparation_commit and
              .activation_binding.preparation_tree == $preparation_tree and
              .activation_binding.commit_message == env.EXPECTED_PRECHECK_MESSAGE and
              .activation_binding.act_id == "FINANCE-PAGE100-PRECHECK-ACT-G11C1-20260901123521" and
              .activation_binding.latch_event_id == "FINANCE-PAGE100-LATCH-G11C1-20260901123521" and
              .material_bindings.manifest_path == env.MANIFEST_PATH and
              .material_bindings.manifest_sha256 == $manifest_sha and
              .material_bindings.owner_decision_path == env.OWNER_DECISION_PATH and
              .material_bindings.owner_decision_sha256 == $owner_decision_sha and
              .material_bindings.authority_path == env.AUTHORITY_PATH and
              .material_bindings.authority_sha256 == $authority_sha and
              .material_bindings.plan_path == env.PLAN_PATH and
              .material_bindings.plan_sha256 == $plan_sha and
              .material_bindings.seed_path == env.SEED_PATH and
              .material_bindings.seed_sha256 == $seed_sha and
              .effect_reconciliation.provider_calls == 0 and
              .effect_reconciliation.quota_reservations == 0 and
              .effect_reconciliation.aws_calls == 0 and
              .effect_reconciliation.s3_calls == 0 and
              .effect_reconciliation.raw_writes == 0 and
              .effect_reconciliation.s3_put_delete_copy == 0 and
              .effect_reconciliation.repository_mutations_by_workflow == 0 and
              .effect_reconciliation.remote_custody_mutations == 0 and
              .effect_reconciliation.all_mutation_effects_zero == true and
              .effect_reconciliation.effects_reconciled == true and
              .effect_reconciliation.ambiguous_side_effects == false and
              .live_adapter_gate.runner_reported_readiness == "READY" and
              .live_adapter_gate.state == "CLOSED_AWAITING_SEPARATE_FRESH_LIVE_ACTIVATION" and
              .live_adapter_gate.precheck_pass_is_necessary_not_sufficient == true and
              .live_adapter_gate.precheck_receipt_alone_authorizes_live == false and
              .live_adapter_gate.live_activation_observed == false and
              .live_adapter_gate.live_provider_adapter_enabled == false and
              .live_adapter_gate.live_s3_write_adapter_enabled == false and
              .live_adapter_gate.required_live_act_id == "FINANCE-PAGE100-LIVE-ACT-G11C1-20260901123521" and
              .live_adapter_gate.required_latch_event_id == "FINANCE-PAGE100-LATCH-G11C1-20260901123521" and
              .runner_result.observations.live_pre_mutation_order == [
                "RUNTIME_KST_DATE_EQUALITY_GATE",
                "FIVE_EXACT_PREDECESSOR_GET_OBJECT_VERSION_READS",
                "THREE_BOUNDED_LIST_BUCKET_VERSIONS_READS",
                "RUNTIME_KST_DATE_RECHECK",
                "EXECUTION_CLAIM_IF_NONE_MATCH_CREATE",
                "FRESH_CHECKPOINT_QUOTA_PROVIDER"
              ] and
              .no_rerun.consumed_g10_precheck_run == "33272691259" and
              .no_rerun.consumed_g10_live_run == "33273146915" and
              .no_rerun.consumed_s2_precheck_run == "33401871715" and
              .no_rerun.consumed_s2_live_run == "33403101817" and
              .no_rerun.consumed_s3_precheck_run == "33414615913" and
              .no_rerun.consumed_s3_apply_run == "33414695818" and
              .no_rerun.consumed_g11_precheck_run == "33465583987" and
              .no_rerun.consumed_g11_live_run == "33466306591" and
              .no_rerun.current_run_retry_authorized == false and
              .no_rerun.same_activation_reuse_authorized == false and
              .no_rerun.same_latch_reuse_authorized == false and
              .execution_binding.artifact_sha256 == .runner_result.result_sha256 and
              (.execution_binding.artifact_sha256 | test("^[0-9a-f]{64}$")) and
              (.receipt_integrity.payload_sha256 | test("^[0-9a-f]{64}$"))
            ' "$precheck_receipt_path" >/dev/null

          jq -e \
            --arg precheck_policy_sha "$precheck_policy_sha" \
            --arg live_policy_sha "$live_policy_sha" \
            --arg precheck_workflow_sha "$precheck_workflow_sha" \
            --arg runner_sha "$runner_sha" \
            --arg tests_sha "$test_sha" '
              .material_bindings.precheck_session_policy_path == env.PRECHECK_POLICY_PATH and
              .material_bindings.precheck_session_policy_sha256 == $precheck_policy_sha and
              .material_bindings.live_session_policy_path == env.LIVE_POLICY_PATH and
              .material_bindings.live_session_policy_sha256 == $live_policy_sha and
              .material_bindings.workflow_path == env.PRECHECK_WORKFLOW_PATH and
              .material_bindings.workflow_sha256 == $precheck_workflow_sha and
              .material_bindings.runner_path == env.RUNNER_PATH and
              .material_bindings.runner_sha256 == $runner_sha and
              .material_bindings.tests_path == env.TEST_PATH and
              .material_bindings.tests_sha256 == $tests_sha
            ' "$precheck_receipt_path" >/dev/null

          receipt_payload_sha="$(python - "$precheck_receipt_path" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          document.pop("receipt_integrity", None)
          payload = json.dumps(
              document, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          print(hashlib.sha256(payload).hexdigest())
          PY
          )"
          test "$receipt_payload_sha" = "$(jq -r '.receipt_integrity.payload_sha256' "$precheck_receipt_path")"

          jq -e \
            --arg message "$EXPECTED_MESSAGE" \
            --arg preparation_commit "$preparation_commit" \
            --arg preparation_tree "$preparation_tree" \
            --arg precheck_activation_commit "$precheck_activation_commit" \
            --arg precheck_activation_tree "$precheck_activation_tree" \
