      - name: Run one bounded G11C1 LIVE generation without retry
        shell: bash
        env:
          CONFIGURED_AWS_ACCOUNT_ID: ${{ steps.configure-live-aws.outputs.aws-account-id }}
          DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY: ${{ secrets.DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY }}
          G11C1_LIVE_HEAD_SHA: ${{ steps.live-lineage.outputs.head_sha }}
          G11C1_LIVE_HEAD_TREE: ${{ steps.live-lineage.outputs.head_tree }}
          LIVE_OUTPUT: ${{ runner.temp }}/g11c1-live-terminal-result.json
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test "$CONFIGURED_AWS_ACCOUNT_ID" = '956315449338'
          test -n "$DATA_GO_KR_FINANCE_STOCK_RIGHTS_SERVICE_KEY"
          test "$G11C1_LIVE_HEAD_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$G11C1_LIVE_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$G11C1_LIVE_HEAD_TREE"
          test ! -e "$LIVE_OUTPUT"
          precheck_receipt_path="$(jq -r '.precheck_pass_binding.path // empty' "$ACTIVATION_PATH")"
          test -f "$precheck_receipt_path"

          live_result_emitted=0
          emit_live_result() {
            if test "$live_result_emitted" -eq 1; then
              return 0
            fi
            if test -f "$LIVE_OUTPUT"; then
              live_sha="$(sha256sum -- "$LIVE_OUTPUT" | cut -d' ' -f1)"
              live_bytes="$(wc -c < "$LIVE_OUTPUT" | tr -d ' ')"
              printf '%s\n' 'G11C1_LIVE_SANITIZED_TERMINAL_RESULT_BASE64_BEGIN'
              base64 -w 0 "$LIVE_OUTPUT"
              printf '\n%s\n' 'G11C1_LIVE_SANITIZED_TERMINAL_RESULT_BASE64_END'
              jq -cn \
                --arg terminal_sha256 "$live_sha" \
                --arg terminal_bytes "$live_bytes" \
                --arg runner_status "${runner_status:-NOT_STARTED}" \
                '{terminal_sha256:$terminal_sha256,terminal_bytes:($terminal_bytes|tonumber),runner_status:$runner_status}'
            else
              printf '%s\n' '{"terminal_result":"MISSING","disposition":"FAIL_CLOSED_NO_RETRY"}'
            fi
            live_result_emitted=1
          }
          finalize_live_log() {
            final_status="$?"
            trap - EXIT
            set +e
            emit_live_result
            exit "$final_status"
          }
          trap finalize_live_log EXIT

          set +e
          python "$RUNNER_PATH" \
            --mode live \
            --manifest "$MANIFEST_PATH" \
            --authority "$AUTHORITY_PATH" \
            --plan "$PLAN_PATH" \
            --seed "$SEED_PATH" \
            --pytest-file "$TEST_PATH" \
            --activation "$ACTIVATION_PATH" \
            --precheck-receipt "$precheck_receipt_path" \
            --live-adapter "$LIVE_ADAPTER_PATH" \
            --adapter-test "$ADAPTER_TEST_PATH" \
            --owner-decision "$OWNER_DECISION_PATH" \
            --self-deadline-seconds 18000 \
            --output "$LIVE_OUTPUT"
          runner_status="$?"
          set -e

          test -f "$LIVE_OUTPUT"
          emit_live_result
          jq -e \
            --argjson acquisition_ceiling "$G11C1_PRIMARY_ACQUISITION_CEILING" \
            --argjson attempt_ceiling "$G11C1_NETWORK_ATTEMPT_CEILING" '
              .schema == "M3TOP3_FINANCE_CA_PAGE100_G11C1_LIVE_ENTRY_RESULT_v1.0" and
              (.entry_gate == "LIVE_NOT_ENTERED" or .entry_gate == "LIVE_ENTERED_ONCE") and
              .effects.primary_acquisitions >= 0 and
              .effects.primary_acquisitions <= $acquisition_ceiling and
              .effects.effective_primary_acquisitions == (4 + .effects.primary_acquisitions) and
              .effects.effective_primary_acquisitions <= 1700 and
              .effects.network_attempts >= 0 and
              .effects.network_attempts <= $attempt_ceiling and
              .effects.effective_network_attempts == (4 + .effects.network_attempts) and
              .effects.effective_network_attempts <= 2000 and
              .effects.primary_acquisitions <= .effects.network_attempts and
              .effects.network_attempts <= (2 * .effects.primary_acquisitions) and
              .effects.provider_calls >= 0 and
              .effects.provider_calls <= $attempt_ceiling and
              .effects.provider_calls <= .effects.network_attempts and
              .effects.finance_provider_api_calls == .effects.provider_calls and
              .effects.quota_reservations == .effects.network_attempts and
              .effects.quota_reservations <= $attempt_ceiling and
              .effects.provider_quota_reservations == .effects.quota_reservations and
              .effects.raw_writes >= 0 and
