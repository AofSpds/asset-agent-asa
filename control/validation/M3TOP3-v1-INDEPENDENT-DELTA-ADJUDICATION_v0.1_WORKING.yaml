required_fix_direction:
  principle: ONE_ECONOMIC_EVENT_MUST_NOT_COUNT_AS_MULTIPLE_INDEPENDENT_F06_MILESTONES_BY_IDENTIFIER_ROTATION
  minimum_behavior:
    - If milestones share an explicit event_group_id, distinct milestone_id values must not make them independent.
    - If milestones share an explicit evidence_group_id, distinct milestone_id values must not make them independent.
    - Multiple identity fields must be reconciled conservatively; a lower-level row identifier must not override a shared governed economic/evidence identity.
    - Anonymous milestones without governed identity must not become independent-count evidence.
  recommended_implementation_shape: >-
    Use conservative multi-key identity grouping (for example connected components over matching milestone_id, event_group_id and evidence_group_id
    within their own namespaces) or an equivalently fail-closed rule. Do not merely swap precedence in a way that fixes one collision class
    while leaving another identifier-rotation bypass.
  required_adversarial_tests:
    - same event_group_id + different milestone_id -> cannot reach F06 90/100 solely from those rows
    - same evidence_group_id + different milestone_id -> cannot reach F06 90/100 solely from those rows
    - transitive identity collision across event/evidence identifiers -> one independent economic group or fail closed
    - genuinely distinct governed economic identities -> existing 90/100 semantics preserved
    - same milestone_id duplicate -> existing dedupe preserved
  scoring_semantics_to_preserve:
    - two genuinely independent verified non-sequential groups may score 90
    - two genuinely independent verified sequential groups may score 100
    - one verified independent group remains 70
    - supplier_only cap remains unchanged
