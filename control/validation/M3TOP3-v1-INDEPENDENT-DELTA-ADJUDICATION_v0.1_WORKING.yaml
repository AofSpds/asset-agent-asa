control_finding:
  finding_id: FND_02_F06_INDEPENDENT_MILESTONE
  state: INDEPENDENT_VALIDATION_FAIL_CONFIRMED_BY_CONTROL_SOURCE_REVIEW
  severity: P0_RELEASE_BLOCKING
  issue: >-
