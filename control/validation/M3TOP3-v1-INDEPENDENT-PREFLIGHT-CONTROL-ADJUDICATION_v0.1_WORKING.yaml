mandatory_findings:
  FND-01:
    title: MIS_PIT_CONSUMED_INPUT_PROVENANCE_NOT_FAIL_CLOSED
    domain: SHARED_CORE_A_CORE_B
    severity: BLOCKING_BEFORE_REPLAY
    finding: >-
      Explicit forbidden future fields and timestamped post-cutoff evidence are rejected, but every scored/consumed
      value is not required to carry immutable publication/support-cutoff provenance. A permitted consumed value could
      therefore be supplied without machine-verifiable proof that it was knowable by the PIT cutoff.
    required_fix: >-
      Require publication_at or immutable supported_cutoff/evidence reference for every consumed scoring signal and
      fail closed when provenance is absent or later than snapshot_cutoff_at. Add adversarial regression tests.
  FND-02:
    title: F06_INDEPENDENT_MILESTONE_REQUIREMENT_NOT_ENFORCED
    domain: CORE_B
    severity: BLOCKING_BEFORE_REPLAY
    finding: >-
      Duplicate verified milestones can satisfy count-based logic and overstate F06 because milestone independence and
      distinct sequential economic-step identity are not enforced.
    required_fix: >-
      Deduplicate by milestone/event identity and require independent milestones or distinct sequential conversion steps
      before 90/100 scoring.
  FND-03:
    title: F02_DEFAULT_RELATIVE_OPERATOR_NOT_GOVERNED_BY_METRIC
    domain: CORE_B_WITH_SHARED_MIS_INTERFACE
    severity: BLOCKING_BEFORE_REPLAY
    finding: >-
      RELATIVE change is the silent default when change_mode is omitted although revenue growth, margin percentage-point
      change and utilization changes can require different economic operators.
    required_fix: >-
      Bind metric-specific change operator in a governed registry/schema or require explicit change_mode/governed
      metric_changes for all production metrics. No unregistered silent RELATIVE default in official replay.
  FND-04:
    title: F08_FRESHNESS_PENALTY_PROVENANCE_INCOMPLETE
    domain: SHARED_CORE_A_CORE_B
    severity: BLOCKING_BEFORE_REPLAY
    finding: >-
      The mathematical cap-at-20 behavior is correct but the reason a freshness penalty became applicable is not bound
      to a machine-verifiable refresh-governance reference.
    required_fix: >-
      Bind freshness_penalty to governed refresh rule ID, refresh_code/evaluated state, supported cutoff reference or
      equivalent immutable provenance. Do not invent new scorer-side time thresholds.
  FND-05:
    title: PRODUCTION_KRX_TRADING_CALENDAR_IDENTITY_NOT_BOUND
    domain: CORE_A_WITH_SHARED_WM_BINDING
    severity: BLOCKING_BEFORE_REPLAY
    finding: WeekdayCalendar is synthetic-test-only; official KRX replay calendar identity remains unbound.
    required_fix: Bind real KRX trading calendar source/release identity, hash/version, WM-v1.1 binding and calendar regression tests.
  FND-06:
    title: COVERAGE_POLICY_RELEASE_BINDING_INCOMPLETE
    domain: SHARED_CORE_A_CORE_B
    severity: RELEASE_BINDING_REQUIRED_BEFORE_REPLAY
    finding: >-
      Current scorer contract permits provisional missing-feature scores to remain rankable when company-level governed
      rankability is complete. This is not a code-contract contradiction, but official replay needs explicit coverage
      release semantics so company-rankability is not confused with feature-completeness.
    required_fix: Bind explicit governed rankability and provisional-feature coverage semantics in release/contract artifacts.
