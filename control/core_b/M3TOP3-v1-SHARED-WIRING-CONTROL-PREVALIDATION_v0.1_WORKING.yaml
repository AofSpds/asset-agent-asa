control_review_findings:
  CW_01_EVIDENCE_RESOLVER_NOT_IMMUTABLY_BOUND:
    severity: P0_RELEASE_BLOCKING
    practical_meaning: >-
      과거 입력값의 근거라고 제시된 evidence reference가 실제 고정된 증거 객체인지 확인하지 않고,
      호출자가 넘긴 dictionary에 같은 문자열 key가 존재하는지만 확인한다. 호출자가 임의 reference를 만들어
      resolver에 넣어도 현재 검사 구조를 통과시킬 수 있으므로 immutable evidence identity와 lineage 증명이 완성되지 않았다.
    observed_implementation: >-
      _resolve_immutable_ref requires a reference string and checks only `ref in resolver`; the test fixture uses resolver entries
      such as {ref: {status: RESOLVED}} without binding content SHA256, byte size, persistent locator, source lineage or approved release identity.
    contract_conflict: >-
      M3TOP3-PIT-CONSUMED-PROVENANCE-CONTRACT_v1.0_WORKING requires immutable evidence/support reference plus source/evidence lineage.
    required_fix: >-
      Bind an approved evidence-resolver release identity and require each resolved evidence object to carry/verify immutable content identity,
      persistent locator and lineage. Caller-populated key membership alone must not constitute immutable resolution.
  CW_02_TYPED_F08_RULE_SELF_ASSERTION:
    severity: P0_RELEASE_BLOCKING
    practical_meaning: >-
      F08의 양수 freshness penalty 규칙이 실제 승인된 영구 규칙인지 확인하지 않고 호출자가 만든 rule dictionary가
      자기 자신의 hash를 계산해 넣으면 통과할 수 있다. 이는 아직 공식 숫자형 감점 규칙이 없다는 Control 상태와 충돌한다.
    observed_implementation: >-
      validate_f08_freshness_provenance_v1_1 accepts caller-supplied typed_refresh_rules; a rule passes when its embedded registry fields match
      constants and governance_object_sha256 equals a hash recomputed from the same caller-supplied object. No persistent approved numeric-rule
      artifact/release locator is resolved. The adversarial test helper itself fabricates SYN-NUMERIC-FRESHNESS-RULE-v1 and passes it.
    contract_conflict: >-
      M3TOP3-REFRESH-RULE-REGISTRY_v1.0_WORKING states numeric F08 penalty rules are NOT_YET_DEFINED_DO_NOT_INFER and any positive official penalty
      must reference an additional typed governed rule that is separately approved and immutable, or equivalent governance object.
    required_fix: >-
      Official runtime must resolve numeric penalty rules from a release-bound approved governance resolver/artifact. Until such an approved
      persistent numeric rule exists, positive official freshness_penalty must fail closed. A self-hashed runtime dictionary is insufficient.
  CW_03_RECORD_LEVEL_CONSUMED_SCOPE_NOT_ENFORCED:
    severity: P0_RELEASE_BLOCKING_UNTIL_EXPLICIT_BINDING
    practical_meaning: >-
      Feature Input Registry에는 company_id, eligibility_state, snapshot_cutoff_at, window_anchor_date 등 record-level consumed path가
      공식 입력범위로 등록되어 있지만 새 PIT guard는 feature_raw_inputs와 Hard Risk Gate만 검사하고 record-level path를 처리하지 않는다.
      특히 eligibility_state처럼 실제 순위 참여 여부를 바꾸는 값의 공식 source/release 결속이 검사 경로에서 빠져 있다.
    observed_implementation: >-
      FeatureInputRegistry loads record_level_paths, but validate_consumed_value_provenance_v1_1 does not iterate or validate them.
    required_fix: >-
      Do not silently omit record-level consumed paths. Either validate historical record-level fields through governed PIT provenance, or explicitly
      classify control-identity fields under a versioned MIS/Universe/eligibility release binding with machine-verifiable identity and effective-time rules.
      Any exemption from per-value evidence must be explicit, versioned and test-covered.
nonblocking_observation:
