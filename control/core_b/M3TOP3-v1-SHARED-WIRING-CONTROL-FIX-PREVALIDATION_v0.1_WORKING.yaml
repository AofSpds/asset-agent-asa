control_code_review:
  CW_01_EVIDENCE_RESOLVER_IMMUTABLE_BINDING:
    verdict: PASS_IMPLEMENTATION_CANDIDATE
    verified_behavior:
      - caller Mapping is rejected as official evidence authority
      - EvidenceResolverRelease is hash-bound as a release object and must resolve through the physically bound authority asset
      - official non-test resolver must be listed by release_id/version with content_sha256, persistent_locator and authority_identity
      - each resolved evidence record requires a valid SHA256-shaped content identity, persistent locator, non-empty source/evidence lineage, support/publication time and cutoff compliance
      - EvidenceResolverView forces v1.1 per-value, whole-block certification, F02 upstream and hard-risk reference membership checks through governed resolver resolution
      - TEST_ONLY resolver is rejected by official runtime
    production_dependency: >-
      The authority asset intentionally has approved_evidence_resolver_releases=[]; no real approved resolver release is bound yet.
      Official scoring therefore remains fail-closed. When CORE A binds the real resolver release, Control must verify underlying
      evidence bytes/content identities and persistent locators before adding the release to the approved authority list.
  CW_02_F08_TYPED_NUMERIC_RULE_APPROVAL_BINDING:
    verdict: PASS_IMPLEMENTATION_CANDIDATE
    verified_behavior:
      - caller numeric Mapping is rejected as official authority
      - official numeric resolver must be persistently approved by release/version/hash/locator/authority identity
      - resolved rule must match Refresh Registry identity/hash, ACTIVE state, M3TOP3-v1.0, scope/class and exact penalty value
      - TEST_ONLY resolver is rejected by official runtime
      - positive freshness_penalty without an approved resolver fails closed
      - no age-to-penalty schedule was invented
    production_dependency: >-
      approved_numeric_rule_resolver_releases remains empty. Positive F08 freshness penalties are unavailable in the official path
      until a separately approved numeric rule release exists. This condition must not be cleared by inventing a schedule.
  CW_03_RECORD_LEVEL_CONSUMED_SCOPE:
    verdict: PASS_IMPLEMENTATION_CANDIDATE
    verified_behavior:
      - all Feature Input Registry record_level_consumed_paths are explicitly iterated
      - eligibility_state requires governed historical binding with bound value/effective_at/evidence-release reference
      - company_id, snapshot_cutoff_at and window_anchor_date require explicit policy-bound control-identity exemption
      - non-NONE hard-risk record fields require governed historical binding; NONE may only use explicit conditional exemption when the path is present
      - silent exemption is rejected
    control_policy_adjudication: >-
      CORE A accepts M3TOP3-RECORD-LEVEL-BINDING-POLICY_v1.0_WORKING as a working control-fix classification consistent with the
      already reconciled Feature Input Registry and hard-risk PIT semantics. This does not modify Shared Contract semantics.
