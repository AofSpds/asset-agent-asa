  validation_dataset_release_id: TO_BIND_AFTER_CORE_A_DATA_READINESS_CLOSURE
  note: >-
    READY_CANDIDATE means the semantic model definition is precommitted. Baseline execution remains
    unauthorized until all pending shared/data/code identities are resolved and hashed.

mutation_rule:
  before_activation: >-
    CORE B may correct clerical/implementation mismatches only while status remains READY_CANDIDATE and
    before any Actual U127 outcome is inspected. Any material semantic change must create a new candidate
    component version and be explicitly reconciled.
  after_baseline_lock_activation: >-
    Feature schema, scorer algorithm, weights, model input interpretation, window mapping, scorer I/O,
    Ground Truth semantics, Critical Miss rule, MFE/MAE semantics and bound code/config identities are immutable.
  overwrite_after_outcome_review: FORBIDDEN

post_result_change_rule: >-
  After any baseline future outcome is inspected by CORE B for model evaluation, any material feature,
  transformation, weight, scorer, gate, threshold or shared semantic change creates a new model version
  (v1.1, v1.2, etc.) and a new baseline/experiment registration. v1 is never rewritten.

replay_comparison_rule: >-
  New model versions must be evaluated on the same frozen Snapshots and bound validation release when
  comparability is claimed. Original v1 outputs remain immutable and separate from replay outputs.
  Retrospective improvement alone is insufficient for deployment; independent validation and prospective
  confirmation remain required.

coverage_policy:
  version: COV-v1.0
  metric: SCORABLE_ELIGIBLE_COVERAGE
  formula: RANKABLE_ELIGIBLE_COMPANIES_DIV_ELIGIBLE_COMPANIES
  official_top_k_threshold: 1.00
  rule: >-
    Eligible but unrankable companies may not be silently removed. A Snapshot below 100% governed rankability
    is PARTIAL/INCOMPLETE for official Top3 validation, though diagnostic output may be retained.

holdout_policy:
  version: HOLDOUT-v1.0
  status: FIXED_PRE_OUTCOME
  rule: >-
    No subset of the two-year history may be called an independent holdout after CORE B has seen its outcomes.
    If the full v1 baseline replay is disclosed to CORE B, that entire historical period becomes KNOWN_HISTORY
    for later model development. Any v1.1 tuning that uses those results must be validated on a prospectively
    designated future holdout or on a genuinely sealed pre-designated dataset whose outcomes were not disclosed
    to model designers before v1.1 pre-registration.
  retrospective_holdout_carveout_after_disclosure: FORBIDDEN
  prospective_confirmation_required: true
  freeze_deadline: BEFORE_FIRST_BASELINE_OUTCOME_DISCLOSURE

walk_forward_policy:
  status: MAY_REMAIN_OPEN_FOR_STATIC_V1_BASELINE
  rule: >-
    v1 baseline is a static fixed model replay and does not require adaptive retraining. Any later walk-forward
    tuning/retraining protocol must be frozen before retrospective results are used for an adaptive v1.1 process.
  freeze_deadline: BEFORE_ANY_ADAPTIVE_OR_RETROSPECTIVE_V1_1_TUNING

