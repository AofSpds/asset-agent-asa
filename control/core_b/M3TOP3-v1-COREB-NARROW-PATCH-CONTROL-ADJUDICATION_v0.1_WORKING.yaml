shared_reconciliation_required_refinements:
  FND_01_CONSUMED_PATH_DISCOVERY:
    severity: BLOCKING_FOR_SHARED_PROMOTION_NOT_FOR_CORE_B_PATCH_ACCEPTANCE
    issue: >-
      The proposal hook can validate a supplied consumed_fields list, but official fail-closed protection must not trust
      the input itself to declare the complete set of fields actually consumed by scoring. Otherwise a malformed input
      could omit a consumed path from consumed_fields while the feature engine still reads it.
    required_reconciliation: >-
      Official MIS/PIT enforcement must derive or verify consumed paths from a governed feature-input schema/registry or
      use a block-level immutable cutoff certification whose scope explicitly covers every value in the scored block.
      Self-declared consumed_fields alone is insufficient for release activation.
  FND_04_REFRESH_REFERENCE_RESOLUTION:
    severity: BLOCKING_FOR_SHARED_PROMOTION_NOT_FOR_CORE_B_PATCH_ACCEPTANCE
    issue: >-
      The proposal hook accepts the presence of refresh_rule_id or other governance tokens, but release enforcement must
      prove that such identifiers resolve to an approved immutable refresh-governance registry/version rather than merely
      accepting an arbitrary non-empty string.
    required_reconciliation: >-
      Bind accepted freshness-governance identifiers to a governed registry or immutable evidence reference with version/hash
      identity and ensure any applicable evaluation/support time does not exceed the Snapshot cutoff.
  FND_06_COVERAGE:
    severity: SHARED_RELEASE_BINDING_PENDING
    required_reconciliation: >-
      Preserve company-rankability versus feature-completeness distinction but explicitly bind official denominator,
      provisional rankability conditions and diagnostics into the release/VDI identity.

