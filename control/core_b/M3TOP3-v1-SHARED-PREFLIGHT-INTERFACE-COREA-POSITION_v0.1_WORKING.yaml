  - SELF_DECLARED_PROVENANCE_SCOPE_IS_NOT_SUFFICIENT_FOR_OFFICIAL_FAIL_CLOSED_GUARD
  - GOVERNANCE_IDENTIFIER_MUST_RESOLVE_TO_BOUND_VERSIONED_AUTHORITY
