control_fix_results:
  CW_01:
    result: PASS_IMPLEMENTATION_CANDIDATE
    behavior: >-
      Caller mapping membership is not evidence authority. Governed EvidenceResolverRelease binding is required,
      and each evidence object must carry immutable content SHA256, persistent locator, lineage and support/publication time.
      Whole-block certification, F02 upstream evidence and hard-risk evidence are routed through the governed resolver view.
    official_data_binding_remaining: >-
      The authority artifact intentionally contains no approved real evidence-resolver release yet; official runtime therefore fails closed
      until CORE A binds an approved persistent evidence release. This is a data/control release dependency, not a permissive fallback.
  CW_02:
    result: PASS_IMPLEMENTATION_CANDIDATE
    behavior: >-
      Caller-created self-hashed numeric rules are not official authority. Positive F08 freshness penalty requires a persistently approved
      NumericRuleResolverRelease. The current authority contains zero approved numeric resolver releases, so official positive penalties fail closed.
    numeric_schedule_invented: false
  CW_03:
    result: PASS_IMPLEMENTATION_CANDIDATE
    behavior: >-
      Feature Input Registry record_level_consumed_paths are explicitly classified and validated. eligibility_state requires governed historical
      binding; company_id, snapshot_cutoff_at and window_anchor_date require explicit bound control-identity exemption; non-NONE hard-risk fields
      require governed historical binding. No record-level path is silently skipped.
