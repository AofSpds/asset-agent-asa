spec_id: SEMI-U127-CANONICAL-RELEASE-SPEC
version: v0.1_WORKING
status: DESIGN_ONLY_NOT_AUTHORIZED_TO_MATERIALIZE
project: semiconductor-research
as_of: '2026-08-15T23:03:00+09:00'
owner_persona: SEMI-CONTROL-ARCHITECT

purpose: >-
  Define how the current Control-accepted logical U127 state can become a new machine-readable governed release
  without pretending to recover or recreate missing historical workbook versions v0.8-v1.9.

core_principles:
  - RECOVERY_IS_NOT_REMATERIALIZATION
  - NEW_CANONICAL_RELEASE_MUST_HAVE_NEW_ARTIFACT_IDENTITY
  - HISTORICAL_v0_7_REMAINS_IMMUTABLE_FORENSIC_ANCHOR
  - MISSING_EARLY_CELL_PROVENANCE_MUST_REMAIN_BOUNDED_UNKNOWN
  - FINAL_CELL_STATE_AND_HISTORICAL_PROVENANCE_ARE_DISTINCT_FIELDS
  - NO_FILENAME_OR_LOGICAL_VERSION_MAY_IMPLY_HISTORICAL_BYTE_CONTINUITY

