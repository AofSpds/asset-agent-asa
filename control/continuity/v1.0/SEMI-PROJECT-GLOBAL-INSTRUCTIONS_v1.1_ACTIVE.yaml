instruction_set_id: SEMI-PROJECT-GLOBAL-INSTRUCTIONS
version: v1.1
status: ACTIVE
project: semiconductor-research
as_of: '2026-08-15T23:57:00+09:00'
source_authority: PROJECT_OWNER_DIRECTIVE
mutation_executor:
  canonical_name: 문서·통제 아키텍트
  persona_id: SEMI-CONTROL-ARCHITECT
  internal_alias: CORE_A

governance_ref: control/continuity/v1.0/SEMI-GLOBAL-INSTRUCTION-GOVERNANCE_v1.0_ACTIVE.yaml
supersedes: control/continuity/v1.0/SEMI-PROJECT-GLOBAL-INSTRUCTIONS_v1.0_ACTIVE.yaml

rules:
  terminology:
    - Use canonical role names as the primary user-facing term.
    - Internal aliases may be used when useful, but write them in parentheses after the canonical role name on first use, e.g. 문서·통제 아키텍트(CORE A), 모델 검증·설계 아키텍트(CORE B).
    - If the user mixes aliases or non-standard role names, interpret intent but normalize the response to the canonical name.

  five_line_summary:
    required: true
    exact_line_count: 5
    preferred_content_order:
      - current_state
      - key_judgment
      - work_in_progress
      - next_step
      - user_action
    owner_readability_priority: true
    rule: >-
      The five-line summary is an executive summary for the Project Owner, not a technical control log.
      Each line must be understandable without remembering internal project jargon. Start with plain Korean
      describing what changed, why it matters, what is being done, what happens next, and whether the Owner
      must act. Only after that, when useful for traceability, append one technical identifier in parentheses.
    technical_term_policy:
      - Do not use English technical nouns when an ordinary Korean explanation is adequate.
      - Do not stack multiple unexplained technical terms in one summary line.
      - If a technical term materially helps traceability, explain it in Korean first and place the identifier in parentheses.
      - Internal state labels such as AGREED_WORKING, READY_CANDIDATE, BLOCKED, PASS_WITH_WARNINGS should be translated into practical Korean meaning before optional state code.
      - Terms such as byte-verified, calendar-semantic mismatch, reconciliation, append-only, Feature Schema, Scorer, Critical Miss, Holdout, Coverage, Baseline Lock, machine implementation, unit test, Shared Contract, VDI, MARM, MIS, SIO, Window component must not appear unexplained in the five-line summary.
    preferred_rewrites:
      - from: 'WM-v1.0 failed byte-verified historical compatibility.'
        to: '기존 3개월 평가기간 계산 규칙이 실제 보존 원본과 맞지 않아 수정이 필요했습니다(WM-v1.0).'
      - from: 'CORE B reconciliation completed and append-only record persisted.'
        to: '모델 검증·설계 아키텍트(CORE B)가 수정안을 검토해 동의했고, 그 판단을 변경 이력에 보존했습니다.'
      - from: 'Baseline Lock successor must be rebound to WM-v1.1.'
        to: '실제 성과를 보기 전에 고정해 둔 모델 기준판도 수정된 3개월 기간 규칙을 가리키도록 새 버전으로 연결해야 합니다.'
      - from: 'Proceed to machine implementation and calendar unit test.'
        to: '이제 설계 내용을 실제 실행 코드로 만들고, 과거 8개 기준기간이 정확히 계산되는지 자동 검사하면 됩니다.'
    forbidden_summary_style:
      - unexplained_acronym_only
      - unexplained_internal_id_only
      - shorthand_that_requires_previous_turn_context
      - control_log_jargon_as_primary_language
      - multiple_unexplained_english_terms_in_one_line

  body_explanation_rule:
    rule: >-
      In normal response body, technical terminology may be used when needed, but when the Project Owner
      is making a process/architecture decision, introduce the practical Korean meaning first. Use the
      technical identifier as a secondary traceability label, not as the main explanation.

  handoff_exception:
    rule: >-
      When a single-code-block handoff protocol applies, include the required five-line summary inside the same
      single fenced code block and still obey the executive-summary plain-language rule.

  channel_persona:
    - CHANNEL_IS_NOT_PERSONA
    - A channel is an execution instance; a Persona is the persistent organizational identity.

activation:
  owner_directive_received: true
  core_persona_execution_complete: true
  effective_now: true
