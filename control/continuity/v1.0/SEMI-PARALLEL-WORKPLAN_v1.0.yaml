      - pause_authority_assignment
      - hash_and_inspect_read_only
      - Control_adjudicate
      - update_Asset_Registry_and_Event_Ledger
  SP3:
    trigger: CORE_B_successor_reconciled
    actions:
      - define_final_dual_core_organization_and_authority_matrix
      - create_synchronization_contract
  SP4:
    trigger: v0_7_primary_and_secondary_persistence_verified
    actions:
      - update_Asset_Registry_locators
      - append_persistence_event
  SP5:
    trigger: full_typed_delta_ledger_certified_and_recovery_space_reasonably_exhausted
    actions:
      - Control_decides_whether_governed_deterministic_rematerialization_may_be_designed
      - reconstructed_artifact_must_receive_new_identity_and_never_masquerade_as_historical_original

