cross_lane_contract:
  - Lane A may discover bytes or historical mechanisms but may not promote Control state directly.
  - Lane A2 may reconstruct typed deltas but may not replay them into a workbook before separate Control authorization.
  - Lane B records accepted findings and prevents future channel-local authority accumulation.
  - Lane C may preserve rationale and incident lessons but must label ACCEPTED, WORKING, HYPOTHESIS, and FUTURE_EXTENSION distinctly.
  - Any recovered important artifact must be persisted before being called canonical or frozen.
  - Continuity implementation must not reconstruct missing U127 cells or historical workbook bytes.
  - U127 forensics and delta-ledger recovery must continue while CORE_B synchronization proceeds.

synchronization_points:
  SP1:
    trigger: typed_delta_ledger_membership_expansion_segment_recovered
    actions:
      - reconcile_cell_level_arithmetic_against_authorized_baselines
      - identify_remaining_early_delta_gap
      - no_workbook_replay
  SP2:
