finding:
  result: FAIL
  conflicting_windows: [W2, W5, W8]
  root_issue: WM-v1.0 conflates historical nominal anchor date with actual PIT snapshot cutoff date. Historical quarterly windows use a nominal calendar anchor (typically the 10th) and snapshot cutoff as the last trading day on/before that anchor when the anchor is non-trading.
  impact: WM-v1.0 would shorten some historical holding windows and can change MFE/MAE/Exit outcomes; therefore historical W1-W8 compatibility is not supported by byte-verified evidence.
core_a_candidate_fix:
  proposed_version: WM-v1.1
  anchor_date: A = nominal evaluation anchor date. For historical W1-W8, A is the documented period-start anchor.
  snapshot_cutoff: last KRX trading timestamp/date on or before A, under PIT cutoff policy
  window_start: A
  entry_trade_date: first KRX trading day strictly after A
  nominal_window_end: A + exactly 3 calendar months
  evaluation_last_trade_date: last KRX trading day on or before nominal_window_end
  exit_trade_date: first KRX trading day strictly after nominal_window_end
  daily_replay_rule: For a normal trading-day daily Snapshot, set A to that trading-day date, so snapshot_cutoff=A and the same deterministic rule applies.
  reason: Separates calendar anchor from evidence cutoff and reproduces W1-W8 documented periods while generalizing cleanly to daily replay.
