supersedes:
  version: WM-v1.0
  reason: >-
    WM-v1.0 incorrectly conflated nominal calendar anchor with PIT snapshot cutoff and therefore failed
    historical W1-W8 compatibility for W2, W5, and W8 and had latent calendar-semantic mismatch for W1/W4.
semantics:
  anchor_date:
    symbol: A
    definition: nominal calendar evaluation anchor
    historical_W1_W8_rule: documented historical period-start anchor
    ordinary_daily_replay_rule: evaluated trading date
  snapshot_cutoff:
    symbol: C(A)
    definition: last valid KRX trading cutoff timestamp/date on or before Anchor A under active PIT cutoff policy
    if_anchor_is_trading_day: governed EOD cutoff on A
    if_anchor_is_non_trading_day: preceding valid KRX trading-day cutoff
    evidence_admissibility_governed_by: snapshot_cutoff
  window_start: Anchor A
  entry_trade_date: first valid KRX trading day strictly after Anchor A
  entry_price: valid Open on entry_trade_date subject to tradability, CA, and price-validity contracts
  nominal_window_end:
    definition: Anchor A plus exactly 3 calendar months
    month_add_rule: preserve day-of-month when possible, otherwise clip to final calendar day of target month
    trading_calendar_adjustment_at_nominal_end_step: none
  evaluation_last_trade_date: last valid KRX trading day on or before nominal_window_end
  mfe_interval: entry_trade_date through evaluation_last_trade_date inclusive
  mae_interval: entry_trade_date through evaluation_last_trade_date inclusive
  horizon_close_date: evaluation_last_trade_date
  horizon_close_role: diagnostic
  exit_trade_date: first valid KRX trading day strictly after nominal_window_end
  exit_price: valid Open on exit_trade_date subject to tradability, CA, and price-validity contracts
historical_compatibility:
  W1: PASS
  W2: PASS
  W3: PASS
  W4: PASS
  W5: PASS
  W6: PASS
  W7: PASS
  W8: PASS
  overall: PASS_8_OF_8
daily_replay_compatibility: PASS
scientific_assessment:
  economic_MFE_MAE_exit_semantics_changed: false
  calendar_binding_materially_corrected: true
  outcome_values_may_change_vs_WM_v1_0: true
  model_feature_schema_change_required: false
  scorer_change_required: false
  weight_change_required: false
  critical_miss_change_required: false
  holdout_policy_change_required: false
  coverage_policy_change_required: false
implementation_requirements:
  - persist window_anchor_date separately from snapshot_cutoff_at
  - never derive nominal_window_end from snapshot_cutoff_date
  - derive nominal_window_end from window_anchor_date
  - bind window_mapping_version=WM-v1.1 in validation dataset and run manifests
  - reproduce documented W1-W8 mappings in deterministic machine unit tests before Actual U127 replay
shared_contract_state:
  definition_conflict_open: false
  control_sync_required_for_definition_conflict: false
  independent_implementation_validation_required: true
  actual_replay_authorized_by_this_contract: false
  model_freeze_authorized_by_this_contract: false
owner_escalation_required: false
