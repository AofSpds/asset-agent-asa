authority_sources:
- doc_id: SEMI-DATA-ROUTE
  version: v1.1
  base_date: '2026-08-14'
  role: legacy project source-routing and refresh-rule authority
governance_time_rule: Registry/rules are model-governance assets and need not predate each historical Snapshot, but the release-bound
  registry must be fixed before outcome inspection/replay and applied uniformly.
historical_evidence_time_rule: Evidence/support timestamps used for a historical freshness determination must be <= snapshot_cutoff_at.
  evaluation_run_at/computed_at may be later and must not be treated as evidence availability.
legacy_refresh_codes:
  R0:
    meaning: no routine re-search
    execution_rule: change only when model formula/definition/trigger/maturity code version changes
  R1:
    meaning: refresh on structural change
    execution_rule: M&A/business reorganization/core-product change
  R2:
    meaning: event-based slow variable
    execution_rule: refresh when relevant qualification/installed-base/vendor-share/moat event is confirmed
  R3Q:
    meaning: quarterly refresh
    execution_rule: refresh after earnings/reporting event
  R3M:
    meaning: monthly or 3M Snapshot refresh
    execution_rule: refresh at model Snapshot
  RE:
    meaning: event-immediate refresh
    execution_rule: reflect as of event occurrence/public availability
  RD:
    meaning: daily market refresh
    execution_rule: trading-day based for price/market-cap/OHLC
  EVIDENCE_FRESHNESS_EVERY_RUN:
    meaning: evaluate evidence freshness every model execution
    execution_rule: measure/assess evidence age relative to the target Snapshot under a governed rule
