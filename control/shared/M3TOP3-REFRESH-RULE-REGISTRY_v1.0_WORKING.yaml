f08_positive_penalty_resolution:
  required_registry_identity:
  - registry_release_id
  - registry_version
  - registry_content_sha256_from_release_manifest
  - persistent_locator
  required_rule_fields:
  - refresh_rule_id
  - applicable_scope
  - applicable_source_or_evidence_class
  - freshness_determination_method
  - stale_state_method
  - effective_model_version_or_policy_binding
  - rule_status
  arbitrary_nonempty_identifier_sufficient: false
  scorer_invented_duration_thresholds: false
  penalty_cap: 20
critical_non_invention_note: SEMI-DATA-ROUTE v1.1 defines refresh cadence classes and states that Evidence Freshness is evaluated
  every run, but it does not define a numeric mapping from age/cadence breach to F08 penalty points. This registry therefore
  does not invent a numeric penalty schedule. Any positive official freshness_penalty must reference an additional typed governed
  rule that explicitly defines its applicability and penalty, or an equivalent immutable governance object.
rule_population_state:
  base_refresh_codes: BOUND_FROM_SEMI_DATA_ROUTE_v1_1
  numeric_f08_penalty_rules: NOT_YET_DEFINED_DO_NOT_INFER
  official_positive_penalty_without_resolved_numeric_rule: FAIL_CLOSED
