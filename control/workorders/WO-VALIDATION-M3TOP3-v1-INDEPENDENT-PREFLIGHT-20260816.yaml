required_audit_axes:
  exact_checkout_and_identity:
    - verify bound source commit exists and contains the declared source/config/test files
    - independently compute SHA256 for important source/config/test/manifest components
    - verify declared config SHA256 exactly
    - distinguish Git blob SHA1 from project-required SHA256
  independent_test_rerun:
    - run the declared 18-test suite from a clean checkout/environment
    - record command, interpreter/runtime identity, exit code, pass/fail counts
    - do not treat Core B's prior test report as independent evidence
  contract_to_code:
    - verify F01-F09 transformation semantics against Feature Schema v1.0
    - verify axis/feature weights and scorer arithmetic
    - verify exact ranking tie rule uses full precision then company_id ascending
    - verify missingness states remain distinct and no silent zero/neutral fill occurs
    - verify anti-double-count suppression and event-group lineage
    - verify Hard Risk Gate and F09 do not double-penalize the same adverse fact
    - verify MIS-v1.0 input requirements and SIO-v1.0 output requirements
  pit_firewall:
    - verify recursive future/outcome-field rejection
    - verify post-cutoff evidence is rejected
    - verify no Actual U127 outcome data is accessed by test fixtures or runtime initialization
  window_mapping:
    - verify WM-v1.1 keeps Calendar Anchor separate from PIT Snapshot Cutoff
    - verify nominal end is derived from Anchor, never from Snapshot Cutoff
    - independently reproduce W1-W8 expected mapping 8/8
    - verify ordinary daily mapping semantics
    - explicitly confirm WeekdayCalendar is synthetic-test-only
    - identify the required production KRX trading-calendar binding for official replay
  implementation_sensitive_items:
    - independently review F02 default relative change formula (current-prior)/abs(prior) and ABSOLUTE/upstream metric_changes modes for consistency with the feature contract
    - independently review F08 upstream freshness_penalty interface and cap-at-20 behavior; do not invent new refresh thresholds
    - review scorer treatment of partially missing features and confirm official coverage semantics are consistent with COV-v1.0
  reproducibility:
    - same frozen input + same code + same config + same versions must produce byte/value-equivalent scoring output
    - verify deterministic run/input identifiers and idempotence
forbidden:
  - inspect Actual U127 MFE/MAE/future return/future rank for model evaluation
  - run Actual U127 two-year replay
  - tune features, weights, thresholds, scorer, risk gate, or calendar rules using outcomes
  - alter U127 Ground Truth, Price, or CA state
  - promote model to FROZEN
  - self-approve any Control or Owner freeze gate
success_criteria:
  independent_preflight_result: PASS_or_PASS_WITH_NARROW_FIXES
  actual_replay_authorized_by_this_work_order: false
  model_freeze_authorized_by_this_work_order: false
