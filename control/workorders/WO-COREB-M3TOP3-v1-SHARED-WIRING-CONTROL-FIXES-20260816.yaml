required_fixes:
  CW_01_EVIDENCE_RESOLVER_IMMUTABLE_BINDING:
    practical_requirement: >-
      과거 입력 근거(reference)가 단순히 호출자가 만든 dictionary key로 존재하는지만 보지 말고,
      승인된 evidence-resolver release를 통해 실제 immutable evidence 객체의 content identity, locator, lineage를 검증한다.
    requirements:
      - Introduce/bind a versioned and hash-identified evidence resolver/release contract or equivalent immutable resolver identity.
      - Each resolved evidence object must verify immutable content identity (SHA256 or equivalent), persistent locator and source/evidence lineage.
      - Provenance reference resolution must fail closed if the resolver release is unbound, object identity is unresolved, hash/locator/lineage is absent or mismatched.
      - Caller-supplied mapping membership alone must not satisfy immutable evidence resolution.
      - Whole-block certification evidence references and F02 upstream evidence references must use the same governed resolution discipline.
  CW_02_F08_TYPED_NUMERIC_RULE_APPROVAL_BINDING:
    practical_requirement: >-
      F08 양수 freshness penalty는 호출자가 즉석에서 만든 self-hashed rule이 아니라 실제 승인·영속화된 숫자형 규칙 객체를 통해서만 허용한다.
    requirements:
      - Do not accept a caller-created typed_refresh_rules dictionary merely because its self-computed hash is internally consistent.
      - Bind the numeric-rule resolver itself to an approved persistent release/version/hash/locator/authority identity.
      - Resolve rule_id to an approved immutable rule object and verify its persistent identity independently of caller content.
      - The current base Refresh Rule Registry has no official numeric age-to-penalty schedule; do not invent one.
      - Until an approved numeric penalty rule artifact exists, official positive freshness_penalty must fail closed.
      - Unit tests may use synthetic fixtures only through an explicitly synthetic test resolver that cannot be mistaken for official release authority.
  CW_03_RECORD_LEVEL_CONSUMED_SCOPE:
    practical_requirement: >-
      Feature Input Registry의 record-level consumed path를 새 PIT guard가 조용히 무시하지 않도록 한다.
    requirements:
      - Explicitly process record_level_consumed_paths from the bound Feature Input Registry.
      - For historically meaningful fields such as eligibility_state, bind to governed PIT evidence or a versioned Universe/eligibility release with effective-time and immutable identity.
      - For control-identity fields such as company_id, snapshot_cutoff_at or window_anchor_date, if per-value evidence is intentionally not required, encode the exemption explicitly in a versioned contract/registry classification and verify the governing release identity.
      - No silent exemption is allowed.
      - If CORE B finds a definition-level conflict requiring Shared Contract semantics to change, do not decide unilaterally; return the exact bounded conflict for CORE A/CORE B reconciliation.
required_adversarial_tests:
  - caller creates fake evidence reference and inserts same key into an unbound resolver -> FAIL
  - evidence object lacks immutable content hash -> FAIL
  - evidence object lacks persistent locator or lineage -> FAIL
  - resolver release/hash mismatch -> FAIL
  - whole-block certification uses evidence ref resolved only by caller key membership -> FAIL
  - F02 upstream evidence uses unbound caller resolver -> FAIL
  - caller creates arbitrary positive F08 penalty rule and self-computes governance_object_sha256 -> FAIL in official path
  - approved resolver identity absent for positive F08 rule -> FAIL
  - no approved numeric F08 rule exists and positive penalty supplied -> FAIL CLOSED
  - synthetic test resolver is explicitly test-only and cannot be used by official runtime -> PASS test isolation
  - eligibility_state without governed record-level binding -> FAIL official path
  - record-level control identity exemption without explicit bound classification -> FAIL
  - valid governed record-level release binding -> PASS
regression_requirements:
  - Preserve previous 76 test behaviors unless a test is explicitly versioned because it incorrectly accepted a now-prohibited self-asserted resolver/rule.
  - Preserve FND-02 F06 duplicate protection.
  - Preserve FND-03 F02 explicit operator semantics.
  - Preserve all five axis weights.
  - Preserve GATED_LINEAR scorer arithmetic.
  - Preserve missingness, anti-double-count, Hard Risk Gate arithmetic, SIO, WM-v1.1, determinism and idempotence.
  - Preserve six shared-asset rehash 6/6.
