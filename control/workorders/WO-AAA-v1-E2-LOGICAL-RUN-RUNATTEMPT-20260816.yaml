scope:
  required:
    - first-class Balanced-v1 Logical Run successor entity with immutable exact execution specification hash
    - first-class RunAttempt entity with one-to-many Logical Run cardinality
    - exactly one execution task per RunAttempt after materialization
    - attempt ordinal unique within Logical Run and starts at 1
    - worker/claim/ACK/start/heartbeat/lease/timeout/cancellation fields belong to RunAttempt
    - Attempt Termination Receipt
    - Logical Run Final Disposition Receipt
    - same-Logical-Run retry only when exact_execution_spec_hash remains unchanged
    - material target/config/input/profile/dependency/model-schema identity change requires new Logical Run
    - legacy compatibility reader explicitly labels LEGACY_AAA_RUN_V0_X and never synthesizes RunAttempt
    - forward-only PostgreSQL successor migration 0007+ after E1 migration 0006
    - deterministic and PostgreSQL adversarial tests
  prohibited:
    - rewrite migrations 0001-0006
    - mutate existing T17/T18/T19 Run or execution_task rows into Balanced-v1 semantics
    - synthetic RunAttempt for historical records
    - replace existing T19 live worker path or enable live successor execution in E2
    - model Feature/Scorer/Weight/Ranking/Backtest methodology change
    - PostgreSQL Operational SoT cutover
    - controlled cutover or production release
acceptance:
  - one Logical Run can own multiple RunAttempts with identical immutable execution spec
  - attempt ordinal duplicate within same Logical Run fails closed
  - retry_of_attempt_id must resolve to an earlier Attempt of the same Logical Run
  - changed material exact execution specification cannot be represented as a retry Attempt of the same Logical Run
  - claim does not imply ACK; ACK does not imply start; start without current heartbeat does not imply RUNNING_CONFIRMED
  - expired or stale lease cannot heartbeat or terminalize
  - retryable timeout can terminate an Attempt without terminalizing Logical Run
  - partial output cannot satisfy terminal PASS
  - terminal Attempt requires immutable Attempt Termination Receipt
  - terminal Logical Run requires immutable Final Disposition Receipt
  - historical T19 Run remains legacy and has no synthetic run_attempt_id
  - deterministic suite, PostgreSQL smoke/reconciliation/backup, and Owner Console build pass
result_requirement:
  terminal_result_required: true
  engineering_pass_is_not_independent_validation_pass: true
