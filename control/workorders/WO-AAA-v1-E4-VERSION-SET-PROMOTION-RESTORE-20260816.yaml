scope:
  required:
    - immutable Compatible Version Set / Release Manifest successor contract
    - exact component refs and deterministic component_set_sha256
    - floating latest prohibited for authoritative release identity
    - material component identity change creates a different release-set identity
    - exact Decision Receipt must authorize the exact release-set target before promotion can complete
    - Promotion Receipt with explicit PREPARED/IN_PROGRESS/COMPLETED_VERIFIED/FAILED_NO_PROMOTION/FAILED_PARTIAL_FAIL_CLOSED states
    - canonical pointer/authority update is a separate final step and occurs only after all required destination receipts verify
    - partial multi-store success cannot be reported as completed and cannot change canonical authority
    - provider-neutral Restore Manifest with PREPARED/RESTORED_UNVERIFIED/RESTORED_VERIFIED/FAILED_FAIL_CLOSED states
    - restore creation is distinct from restore verification
    - restored PostgreSQL state cannot become Operational SoT without separate Owner exact-target decision
    - local backup/restore evidence cannot satisfy managed PITR/RPO/RTO qualification
    - Git governance / PostgreSQL operational / S3-R2 immutable artifact planes remain explicitly distinct
    - no silent dual authority
    - forward-only PostgreSQL successor migration 0009+
    - deterministic and PostgreSQL adversarial tests
  prohibited:
    - migrations 0001-0008 rewrite
    - actual production canonical promotion
    - PostgreSQL Operational SoT cutover
    - live worker enablement
    - waiver or fabrication of Independent Validation / managed PITR qualification
    - generic Saga/2PC/distributed transaction framework
    - model Feature/Scorer/Weight/Ranking/Backtest methodology change
    - controlled cutover or production release
acceptance:
  - floating latest cannot form authoritative component/release identity
  - deterministic component set hash is order-independent and changes on material component change
  - independently valid components are not treated as compatible absent explicit compatibility declaration
  - promotion exact Decision Receipt must target the same immutable release-set identity
  - incomplete/unverified artifact cannot be canonicalized
  - partial destination failure produces FAILED_PARTIAL_FAIL_CLOSED and leaves canonical pointer unchanged
  - COMPLETED_VERIFIED requires all required destination receipts verified before canonical pointer update
  - restore without verification remains RESTORED_UNVERIFIED and cannot become authoritative
  - provider-specific metadata does not define restore semantic identity
  - local restore drill cannot claim managed PITR/RPO/RTO qualification
  - PostgreSQL remains nonauthoritative and JSON Registry remains operational authority during shadow
  - deterministic suite, PostgreSQL smoke/reconciliation/backup, Owner Console build pass
result_requirement:
  terminal_result_required: true
  engineering_pass_is_not_independent_validation_pass: true
