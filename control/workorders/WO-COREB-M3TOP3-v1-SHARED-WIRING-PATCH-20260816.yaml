required_pre_patch_readback:
  rule: Before coding, fetch each bound shared asset from GitHub and independently recompute SHA256. Stop if any expected hash mismatches.
  manifest_hash_self: asset manifest itself must be fetched and treated as a control reference, not proof of its own correctness
scope:
  FND_01_PIT_GUARD:
    required:
    - Replace input-self-declared consumed_fields as authoritative scope with resolver backed by M3TOP3-FEATURE-INPUT-REGISTRY_v1.0_WORKING or hash-equivalent executable contract.
    - Validate whole-block certification exact block/input-release identity, scope-contract identity/hash, scope coverage, immutable evidence identity, and supported_cutoff_at.
    - Validate per-value immutable provenance for every authoritative consumed path when block certification is absent.
    - Validate derived/aggregate operator+derivation identity and PIT-certified upstream lineage.
    - Apply equivalent PIT provenance discipline to non-NONE Hard Risk Gate.
  FND_04_F08_FRESHNESS:
    required:
    - Resolve refresh governance against the bound registry/version/hash or typed immutable governance object; arbitrary nonempty strings must fail.
    - Separate historical as-of/evidence support timestamps from evaluation_run_at/computed_at.
    - Preserve F08 arithmetic and cap-at-20.
    - Do not invent a numeric freshness penalty schedule or refresh-duration threshold not present in an approved governance asset.
    - If no resolved numeric penalty rule exists for a positive official penalty, fail closed rather than infer one.
  FND_06_COVERAGE_RELEASE:
    required:
    - Implement official release/VDI rankability validation outside GATED_LINEAR arithmetic.
    - Require all five axes calculable, no v1 REVIEW_REQUIRED feature, governed PIT/freshness validation, and Snapshot company-rankability coverage=1.00.
    - Do not add a numeric minimum feature_coverage_ratio.
    - Do not use Critical Miss or any future outcome as historical rankability input.
    - Keep score_status and feature_coverage_ratio explicit.
  F02_COMPATIBILITY:
    required:
    - Bind successor implementation compatibility note into successor implementation/release metadata.
    - Do not overwrite baseline config bytes.
required_adversarial_tests:
- consumed_fields omits an actually-read path -> fail
- self-declared scope without bound authoritative registry -> fail
- block certification exact-block hash mismatch -> fail
- block certification scope-contract mismatch -> fail
- block certification covers only subset of authoritative paths -> fail
- unresolved immutable evidence reference -> fail
- derived aggregate has operator but lacks PIT-certified upstream lineage -> fail
- arbitrary refresh_rule_id without registry resolution -> fail
- valid rule ID under wrong registry hash -> fail
- refresh rule source/evidence scope mismatch -> fail
- historical evidence support timestamp after snapshot cutoff -> fail
- evaluation_run_at later than snapshot while historical as-of is valid -> pass
- valid governed penalty >20 -> pass with arithmetic capped at 20
- only one axis available -> not official rankable
- Reliability_Risk absent -> not official rankable
- all five axes available with governed missing features -> provisional official rankability allowed if all other gates pass
- any v1 feature REVIEW_REQUIRED -> not official rankable
- NA_FOR_OVERLAP while all five axes survive -> allowed
- company rankability coverage 1.00 with feature completeness <1.00 -> pass company coverage but never label feature completeness 100%
regression_requirements:
- existing 53 tests remain passing unless versioned only for explicit reconciled interface change
- F06 narrow fix remains passing
- F02 explicit/governed operator behavior remains passing
- weights unchanged
