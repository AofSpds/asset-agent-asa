purpose: >-
  Close one material F06 identity/dedup bypass found by independent validation without changing weights, scorer arithmetic,
  model architecture, CW_01/CW_02/CW_03 behavior, FND_03 behavior, WM-v1.1 or outcome-blind scientific constraints.
problem_statement: >-
  In the exact source, _milestone_identity() chooses milestone_id before event_group_id/evidence_group_id. Two rows that represent
  the same governed economic event can therefore use different milestone_id values and the same event_group_id yet be counted as
  two independent verified milestones, producing F06=90 when sequential_verified=false. This violates the invariant that identifier
  rotation cannot inflate independent economic evidence.
required_fix:
  invariant: ONE_ECONOMIC_EVENT_ONE_INDEPENDENT_F06_COUNT
  requirements:
    - A shared explicit event_group_id must prevent rows from being counted as independent even when milestone_id differs.
    - A shared explicit evidence_group_id must prevent rows from being counted as independent even when milestone_id differs.
    - Reconcile multiple identity fields conservatively. Do not solve only the exact event_group case by swapping simple precedence if another collision route remains.
    - A lower-level row/milestone identifier must not override a shared governed economic/evidence identity.
    - Anonymous milestones without a governed identity may contribute only under already-governed non-independent behavior; they must not create independent-count evidence.
    - Preserve legitimate distinct-event behavior: genuinely distinct governed economic identities may still produce 90/100 under existing F06 rules.
  preferred_design: >-
    Conservative multi-key grouping, such as connected components over matching milestone_id, event_group_id and evidence_group_id values
    within field namespaces, or an equivalent fail-closed implementation. The implementation should be order-deterministic and should
    expose sufficient trace fields to audit grouped identities and collisions.
  conflict_handling: >-
    If implementing this requires changing Shared Contract semantics rather than enforcing the existing anti-double-count/economic-event
    identity intent, stop and return a bounded semantic conflict for CORE A/CORE B reconciliation instead of changing definitions unilaterally.
required_adversarial_tests:
  - name: same_event_group_rotated_milestone_id
    expectation: two rows sharing event_group_id but distinct milestone_id cannot alone reach F06 90 or 100; they dedupe/group or fail closed.
  - name: same_evidence_group_rotated_milestone_id
    expectation: two rows sharing evidence_group_id but distinct milestone_id cannot alone reach F06 90 or 100.
  - name: transitive_identity_collision
    expectation: A linked to B by event_group and B linked to C by evidence_group cannot become multiple independent groups through identifier rotation.
  - name: same_milestone_id_duplicate
    expectation: existing dedupe behavior remains.
  - name: genuinely_distinct_governed_nonsequential_events
    expectation: existing F06 90 semantics remain available.
  - name: genuinely_distinct_governed_sequential_events
    expectation: existing F06 100 semantics remain available when sequential criteria are truly satisfied.
  - name: anonymous_rows_not_independent
    expectation: anonymous milestones cannot create the >=2 independent_verified threshold.
