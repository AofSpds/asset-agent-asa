engineering_acceptance:
  - empty PostgreSQL rebuilds deterministically from migrations
  - existing JSON Run registry remains authoritative during shadow
  - all JSON Run records inventory with deterministic path/size/SHA256 identity
  - deterministic import/reconciliation does not invent unknown fields
  - future timestamp cannot create RUNNING_CONFIRMED
  - heartbeat before start is rejected
  - terminal state/verdict mismatch rejected
  - terminal state and Result binding atomic
  - work-order/run/result referential integrity enforced
  - cross-timezone activity chronology correct
  - one valid lease winner with monotonic fencing token
  - stale lease epoch cannot heartbeat or complete Run
  - duplicate event retry idempotent
  - DB outage fails closed after DB-authority mode is explicitly enabled in tests
  - CLI/API common projection contract passes
  - no Owner Console direct DB access introduced
  - no Redis/Kafka/Kubernetes dependency introduced
  - existing non-T18 AAA tests remain green
