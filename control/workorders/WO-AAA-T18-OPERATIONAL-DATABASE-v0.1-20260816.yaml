    - import without inference, semantic correction, or invented historical values
    - provide reconciliation report contract
  T18_3_READ_ONLY_DUAL_READ_SHADOW:
    - JSON remains authoritative
    - DB is non-authoritative shadow
    - discrepancies fail closed and do not auto-select a winner
  T18_4_TRANSACTIONAL_OPERATIONAL_DRILLS:
    - transaction/state transition tests
    - concurrency and fencing-token tests
    - stale lease mutation rejection
    - terminal result atomicity and crash-boundary tests
    - database unavailable fail-closed behavior
  T18_5_MODEL_DEVELOPMENT_PLANE_METADATA:
    - exact Git model/feature/config identities
    - exact dataset/snapshot artifact identities
    - Experiment/Run/Result linkage
  T18_6_COMMON_READ_PATH:
    - repository/service abstraction shared by CLI and HTTP API
    - Owner Console must continue to read HTTP API, never DB directly
  T18_7_RECOVERY_VALIDATION_AND_CUTOVER_PREPARATION:
    - backup/restore drill contract
    - final deterministic reconciliation
    - independent validation candidate preparation
    - no operational SoT cutover without separate Owner authorization
