scope:
  T18_0_ARCHITECTURE_CONTRACT:
    - encode authority boundary and non-interference as tests/contracts
  T18_1_DATABASE_SCHEMA_AND_MIGRATIONS:
    - add deterministic PostgreSQL schema migrations versioned in Git
    - minimum entities: work_order_refs, runs, run_events, results, experiments, experiment_runs, snapshot_refs
    - enforce terminal/result/work-order referential integrity and lease fencing fields
  T18_2_DETERMINISTIC_JSON_IMPORT:
