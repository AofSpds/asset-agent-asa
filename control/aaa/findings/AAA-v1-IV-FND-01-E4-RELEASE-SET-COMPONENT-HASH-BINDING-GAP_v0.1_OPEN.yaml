  - DECISION_RECEIPT_AUTHORIZES_EXACT_IMMUTABLE_SET
  - PROMOTION_REVALIDATES_EXACT_SET_BEFORE_POINTER_MUTATION

impact: >-
  A materially different PostgreSQL component membership can remain represented under an unchanged
  decision-bound component_set_sha256 and can reach the non-authoritative shadow promotion path.
  PostgreSQL remains non-authoritative, but this defect blocks Independent Validation PASS and any
  later cutover consideration.

