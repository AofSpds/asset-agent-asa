observed_gap: >-
  PostgreSQL migration 0009 stores caller-supplied component_set_sha256 separately from actual
  release-set component rows. The database does not mechanically recompute or verify the canonical
  component-set hash from exact membership before Decision binding and promotion completion.

frozen_invariant_violated:
  - RELEASE_SET_ID_PLUS_EXACT_COMPONENT_REFS_PLUS_COMPONENT_SET_SHA256_DESCRIBE_ONE_IMMUTABLE_SET
