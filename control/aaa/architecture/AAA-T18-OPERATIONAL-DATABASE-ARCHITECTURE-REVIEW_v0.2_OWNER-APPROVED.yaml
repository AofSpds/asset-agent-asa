approved_direction:
  - PostgreSQL owns mutable Operational / Execution State only after explicit operational SoT cutover.
  - Git/GitHub remains Governance SoT for Work Orders, approvals, model/feature/scorer/weight/ranking specs, Shared Contract, architecture, migration code, and release manifests.
  - S3/R2 remains Artifact SoT for large immutable dataset, snapshot, backtest, evidence, and result bytes.
  - Baseline infrastructure is PostgreSQL only; Redis, Kafka, and Kubernetes are not prerequisites.
  - SQLite is optional non-certifying test double only; PostgreSQL semantics are required for concurrency/lease/cutover certification.
  - Migration is deterministic JSON import -> reconciliation -> read-only shadow -> drills -> independent validation -> explicit Owner operational SoT cutover.
  - Long-lived mutable dual-authority or silent fallback from DB to stale JSON is prohibited.
