problem_statement:
  observed_gap: >-
    AAA can persist Owner-approved Work Orders and Run Registry dispatch records, but no software execution bridge currently claims those Runs and creates executor ACK/start/heartbeat/result evidence automatically.
  consequence: >-
    DISPATCHED_AWAITING_ACK is currently a truthful queue/control state, not proof that a separate ChatGPT channel or other executor process has started.
  current_example:
    run_id: RUN-VALIDATION-AAA-T18-INDEPENDENT-20260816-001
    exact_target: 59c9baf3a24b1cf7542a3643c296711c37d72c3c
    persistent_state: DISPATCHED_AWAITING_ACK
    started_at: null
    last_heartbeat_at: null
    terminal_result: null

architecture_verdict: ADOPT
architecture_summary: >-
  Introduce T19 as a software Execution Plane between approved Work Orders/Run Registry and actual executor processes. A Dispatcher creates/advertises executable tasks; registered Workers claim tasks under PostgreSQL lease/fencing semantics, acknowledge, execute only pre-approved execution profiles, emit heartbeats, persist evidence, and terminate through atomic Result binding. T19 must not treat a ChatGPT conversation channel as a worker process and must not infer execution from dispatch records.

authority_boundaries:
  project_owner:
    - approves major T19 architecture direction
    - approves production/live execution enablement
    - retains final cutover/release authority
  git_github_governance_sot:
    - Work Order contract bytes
    - execution profile definitions and permissions
    - Persona and authority manifests
    - architecture contracts
    - decision ledger and release manifests
  postgresql_t18_operational_plane:
    - task availability/projection after authorized operational cutover
    - worker registration metadata
    - claim/lease/fencing state
    - ACK/start/heartbeat/stale state
    - Run Event metadata
    - terminal Result metadata binding
  s3_r2_artifact_sot:
    - large stdout/stderr bundles
    - datasets/snapshots/backtest bytes
    - large evidence bundles
    - immutable Result payload bytes when above Git-size policy
  persona_boundary:
    rule: Persona != Worker != Channel != Model
    note: >-
      SEMI-VALIDATION-AUDITOR is an organizational Persona. A T19 worker is a software execution instance that may be authorized to execute a bounded profile on behalf of that Persona. A chat channel is never evidence of worker liveness.

