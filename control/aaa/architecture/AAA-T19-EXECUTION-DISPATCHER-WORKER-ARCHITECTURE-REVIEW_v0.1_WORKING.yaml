  message_broker: NOT_REQUIRED_AT_V0_1
  transport_model: PostgreSQL-backed pull/claim is sufficient at current scale

acceptance_criteria:
  - dispatch record alone never creates ACK/start/heartbeat
  - two workers racing for one task produce exactly one lease winner
  - stale lease_epoch cannot heartbeat, write events, or terminalize
  - worker cannot claim a task outside registered capability/persona/permission
  - unapproved Work Order can never become executable
  - exact Git target mismatch fails before execution
  - execution profile identity mismatch fails before execution
  - arbitrary command injection through Work Order payload is impossible
  - first heartbeat plus started_at is required before RUNNING_CONFIRMED
  - worker crash causes no implicit success
  - stale worker becomes STALE_UNKNOWN fail-closed
  - exact retry idempotency produces no duplicate execution event
  - terminal Result and Run state transition are atomic
  - partial Result persistence cannot yield terminal Run
  - retry creates a new Run identity with lineage to prior attempt
  - CLI/API/Owner Console display the same persistent worker/run truth
  - Owner Console never treats terminal history as current activity
  - LLM-off does not block deterministic Dispatcher/Worker control plane
  - reasoning-only task without reasoning worker becomes WAITING_FOR_REASONING
  - no canonical write occurs without existing promotion/authority gates
  - P09 and T18 existing exact validation targets remain unchanged
  - full T19 Independent Validation PASS before live execution enablement
  - Project Owner separately authorizes live execution enablement

explicit_non_goals_v0_1:
  - waking or controlling arbitrary ChatGPT conversation channels
  - distributed multi-region scheduling
  - Kafka event streaming
  - Redis job queue
  - Kubernetes orchestration
  - autoscaling fleet management
  - arbitrary user-supplied shell execution
  - automatic production/canonical promotion
  - automatic Independent Validation verdict generation

