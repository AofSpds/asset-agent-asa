execution_model:
  lifecycle:
    - WORK_ORDER_APPROVED
    - RUN_DISPATCH_RECORDED
    - TASK_AVAILABLE
    - WORKER_CLAIMED_WITH_LEASE
    - EXECUTOR_ACK_RECORDED
    - START_AND_FIRST_HEARTBEAT_RECORDED
    - RUNNING_CONFIRMED
    - PERIODIC_HEARTBEAT
    - RESULT_BYTES_PERSISTED_AND_HASHED
    - TERMINAL_RESULT_BOUND_ATOMICALLY
    - RUN_TERMINAL
  state_rules:
    dispatch_does_not_equal_ack: true
    ack_does_not_equal_running: true
    running_requires_started_at_and_current_heartbeat: true
    stale_heartbeat_means_stale_unknown: true
    terminal_requires_persistent_result_identity: true
    unknown_never_inferred_running: true
    worker_crash_never_inferred_success: true
    retry_reuses_run_id: false
    retry_policy: NEW_RUN_ID_WITH_RETRY_OF_RUN_ID_LINEAGE

worker_registration:
  required_fields:
    - worker_id
    - worker_type
    - runtime_version
    - host_identity
    - registered_capabilities
    - authorized_persona_bindings
    - max_concurrency
    - last_seen_at
    - enabled
  recommended_worker_types:
    - DETERMINISTIC_LOCAL_WORKER
    - CI_VALIDATION_WORKER
    - RESEARCH_TOOL_WORKER
    - MODEL_EXPERIMENT_WORKER
    - EXTERNAL_REASONING_WORKER
  reasoning_rule: >-
    If no authorized human/LLM reasoning worker is connected, reasoning-required tasks remain WAITING_FOR_REASONING and must not block or corrupt deterministic Control Plane operations.

claim_and_lease:
  database: PostgreSQL
  mechanism:
    - transactionally select eligible task using FOR UPDATE SKIP LOCKED or equivalent deterministic single-winner primitive
    - increment lease_epoch on successful claim
    - bind worker_id and lease_expires_at
    - heartbeat and all mutations require matching run_id + worker_id + lease_epoch
    - stale fencing token is always rejected
  time_source: PostgreSQL server time for operational lease/stale decisions
  duplicate_claim_behavior: SINGLE_WINNER
  automatic_reassignment_after_stale: PROHIBITED_BY_DEFAULT
  stale_recovery: explicit policy creates a new Run attempt; prior Run remains STALE_UNKNOWN or terminalized by authorized recovery adjudication

execution_profiles:
  principle: NO_ARBITRARY_SHELL_FROM_WORK_ORDER
  contract: >-
    A Work Order references an allowlisted execution_profile_id and exact Git identity. The worker maps that profile to a code-owned command template and bounded inputs. Untrusted Work Order text cannot become an arbitrary shell command.
  minimum_profile_fields:
    - execution_profile_id
    - version
    - exact_git_identity
    - allowed_executor_personas
    - command_or_entrypoint
    - argument_schema
    - environment_allowlist
    - network_policy
    - filesystem_policy
    - timeout_seconds
    - output_policy
    - required_permission_level
  secrets:
    persisted_in_git_or_run_registry: false
    injection: runtime secret provider/environment only
    logging: redaction_required

isolation:
  read_only_validation:
    repository_mode: READ_ONLY_EXACT_CHECKOUT
    workspace: ephemeral
    canonical_write: prohibited
  engineering_mutation:
    repository_mode: ISOLATED_BRANCH_OR_WORKTREE
    canonical_write: prohibited_without_explicit_promotion_gate
  default_process_isolation: subprocess_with_explicit_cwd_env_timeout
  container_requirement_for_v0_1: optional
  kubernetes_requirement_for_v0_1: false

minimum_t19_scope:
  T19_0_EXECUTION_CONTRACT:
    - Worker identity schema
    - execution profile schema
    - task claim/lease/ACK/heartbeat/terminal state machine
    - authority and non-inference rules
  T19_1_DISPATCHER:
    - materialize eligible approved Runs into executable task projection
    - never create tasks from unapproved Work Orders
    - deterministic idempotency
  T19_2_WORKER_RUNTIME:
    - register worker
    - claim one task
    - verify exact target/profile/persona/permission
    - create ACK/start/heartbeat evidence
    - execute bounded profile
    - persist logs/evidence hashes
    - atomically bind terminal Result
  T19_3_FAILURE_RECOVERY:
    - worker crash
    - lease expiry
    - stale fencing token
    - partial Result write
    - duplicate claim
    - dispatcher restart
    - worker restart
  T19_4_CONTROL_SURFACES:
    - CLI task/worker/run inspection
    - read-only API projections
    - Owner Console live worker/lease/heartbeat display
    - no UI-side state inference
  T19_5_VALIDATION_WORKER_PROFILE:
    - first certifying profile is deterministic independent-validation execution against an exact immutable Git target
    - must preserve validator read-only/canonical-side-effect-none rules
  T19_6_MODEL_DEVELOPMENT_PROFILES:
    - experiment runner
    - snapshot materialization runner
    - backtest runner
    - validation runner
    - each profile separately permissioned and hash-bound
  T19_7_INDEPENDENT_VALIDATION:
    - adversarial independent validation of T19 exact integrated successor

