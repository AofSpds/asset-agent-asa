infrastructure_baseline:
  postgresql: REQUIRED_FOR_CERTIFYING_CONCURRENCY_AND_LEASE_TESTS
  redis: NOT_REQUIRED
  kafka: NOT_REQUIRED
  kubernetes: NOT_REQUIRED
