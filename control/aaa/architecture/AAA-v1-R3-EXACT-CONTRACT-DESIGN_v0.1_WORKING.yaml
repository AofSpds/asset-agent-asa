    - A10_ACTOR_AND_AUTHORITY
    - EXACT_TARGET_DECISION_RECEIPT
    - ATTEMPT_TERMINATION_RECEIPT
    - LOGICAL_RUN_FINAL_DISPOSITION_RECEIPT
  p1_concept_boundary_set:
    - A02_GLOBAL_INVARIANT_CONTRACT
    - A04_FAILURE_RETRY_CANCELLATION_TIMEOUT
    - A09_PROVIDER_NEUTRAL_RESTORE
    - A11_COMMAND_WORKFLOW_BOUNDARY
    - A12_OPERATIONAL_EVENT_HISTORY
    - PARTIAL_AND_CHECKPOINT_BOUNDARY
