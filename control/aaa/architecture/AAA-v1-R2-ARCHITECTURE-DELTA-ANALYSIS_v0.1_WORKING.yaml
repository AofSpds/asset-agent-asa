architecture_delta_matrix:
  A01_MINIMUM_PIT_TIME_SEMANTICS:
    classification: EXTEND
    keep:
      - PIT Snapshot snapshot_cutoff_at as authoritative PIT cutoff identity
      - publication_at_or_supported_cutoff_at <= snapshot_cutoff_at fail-closed discipline
      - timezone-aware timestamps and no invented intraday time
      - database lifecycle transaction_timestamp clock for execution state
    gap:
      - no shared cross-domain vocabulary separating fact/effective time, public evidence availability time, recorded time, snapshot cutoff, and execution lifecycle time
      - semantic time dimension is not explicitly separated from the clock authority/source that establishes that timestamp
    r3_required_contract:
      - define FACT_OR_EFFECTIVE_TIME
      - define PUBLIC_EVIDENCE_AVAILABLE_TIME
      - define RECORDED_TIME
      - define SNAPSHOT_CUTOFF_TIME
      - define EXECUTION_LIFECYCLE_TIME
      - define CLOCK_OR_EVIDENCE_AUTHORITY separately from TIME_SEMANTIC
      - preserve FACT_EXISTED_AT_TIME != PUBLIC_EVIDENCE_AVAILABLE_AT_TIME
    prohibited_interpretation:
      - all semantic times are generated by one physical clock
      - later execution time can establish earlier historical evidence availability

  A02_NARROW_GLOBAL_INVARIANT_CONTRACT:
    classification: EXTEND
    keep:
      - running requires governed start plus heartbeat evidence
      - terminal state requires persistent terminal Result
      - terminal state and Result verdict exact mapping
      - expired lease cannot authorize heartbeat or terminalization
      - engineering PASS is not Independent Validation PASS
      - Worker, Persona, Channel, and Model identities remain distinct
      - authority escalation requires explicit Owner decision
    gap:
      - invariants are distributed across Run Registry, SQL functions, Process Gate, and validation artifacts rather than named as one thin cross-object invariant contract
    r3_required_contract:
      - create a narrow invariant vocabulary and ownership map only
      - distinguish hard invariant from implementation mechanism
    explicitly_deferred:
      - generic policy engine
      - distributed invariant framework

  A03_LOGICAL_RUN_RUNATTEMPT_IDENTITY:
    classification: REFACTOR
    keep:
      - immutable run_id history
      - exact target and Work Order binding
      - T17/T18/T19 historical Run meaning
      - T19 lease fencing and execution evidence rules
    current_conflation:
      - Run carries logical work identity and execution-realization lifecycle fields
      - execution_tasks.run_id is UNIQUE, producing one Task per Run
      - no independent RunAttempt identity exists
      - retry lineage is task-level retry_of_run_id
    balanced_v1_direction:
      logical_run: immutable logical execution intent plus exact execution specification
      run_attempt: one concrete execution realization of a logical Run
      historical_legacy_runs: remain interpreted under legacy schema; no retroactive rematerialization
    r3_required_contract:
      - exact Logical Run identity fields
      - exact RunAttempt identity fields
      - Run to RunAttempt cardinality
      - RunAttempt to ExecutionTask cardinality
      - location of lease, worker, start, heartbeat, timeout, cancellation, and execution-state fields
      - legacy Run compatibility/read projection
      - Result binding level and logical Run final-disposition rule
    architecture_preference_not_yet_frozen: DISTINCT_RUN_ATTEMPT_ENTITY_OPTION_A
    implementation_detail_frozen: false

  A04_FAILURE_RETRY_CLASSIFICATION:
    classification: REFACTOR
    keep:
      - stale lease cannot silently continue
      - worker crash/interruption cannot imply success
      - historical T19 rule that retry used a new Run ID remains historical truth for legacy T19 semantics
    current_gap:
      - retry_of_run_id on Execution Task does not distinguish retry of the same logical intent from materially changed target/specification
      - timeout, cancellation, infrastructure fault, validation failure, and application failure are not a common semantic family
    r3_required_contract:
      - execution failure classes
      - retryable versus non-retryable classes
      - same Logical Run new Attempt boundary
      - changed exact target, Work Order, configuration, or logical specification boundary requiring a new Logical Run
      - cancellation semantics
      - timeout semantics
      - supersession semantics
      - no implicit success and no silent retry lineage
    concept_detail_only_until_owner_freeze: true

  A05_SCHEMA_FAMILY_VERSIONING_PRINCIPLE:
    classification: EXTEND
    keep:
      - frozen SEMI Schema Registry v0.1
      - frozen files are not overwritten
      - changes require new version/change request
      - schema version independent from model version
      - existing schema_version and revision/supersession patterns
    gap:
      - no single Balanced v1 family-level compatibility declaration for AAA operational contracts and scientific schemas together
    r3_required_contract:
      - schema family identity
      - schema version identity
      - backward/forward compatibility declaration vocabulary
      - supersession/migration reference
      - reader compatibility boundary
    explicitly_deferred:
      - generic schema registry service
      - automatic schema negotiation platform

  A06_MINIMUM_ACTUAL_SOURCE_PROVENANCE:
    classification: EXTEND
    keep:
      - exact Git commit on Runs/Tasks
      - Work Order Git identity
      - Execution Profile SHA256
      - artifact locator/SHA256/byte size
      - immutable PIT evidence/source lineage
    gap:
      - exact commit alone does not establish actual executed working-tree bytes if a dirty tree were allowed
      - no generic run-level dependency-lock identity, configuration identity, or input-bundle identity contract
    r3_required_minimum:
      - repository identity
      - exact commit identity
      - Git tree identity where material
      - working_tree_clean boolean
      - if dirty execution is ever allowed, immutable patch_or_diff_digest and explicit authority; otherwise dirty execution fails closed
      - material dependency/lock identity
      - execution configuration hash
      - input bundle/dataset/snapshot identities where applicable
    explicitly_deferred:
      - generic software supply-chain attestation platform
      - enterprise SBOM framework

  A07_MINIMUM_PROJECT_NAMESPACE_CANONICAL_IDENTITY:
    classification: EXTEND
    keep:
      - existing canonical domain IDs such as company_id, fab_id, event_id/event_record_id, run_id, result_id
      - append-only correction and supersession semantics
    gap:
      - operational IDs and continuity IDs do not share an explicit project namespace/entity-type identity envelope
      - current P08 control state reports a continuity event-ID collision blocker, demonstrating a namespace/uniqueness risk
    r3_required_contract:
      - project namespace
      - entity family/type
      - canonical identity
      - version/revision where applicable
      - supersession relation where applicable
      - uniqueness scope and collision fail-closed behavior
    historical_id_rewrite_prohibited: true

  A08_FAIL_CLOSED_CROSS_STORE_PROMOTION_CONTRACT:
    classification: EXTEND
    keep:
      - current canonical-promotion boolean gates
      - CONTROL_ACCEPTANCE
      - REQUIRED_VALIDATION_PASS
      - OWNER_RELEASE_APPROVAL
      - DETERMINISTIC_PROMOTION_JOB
      - fail closed if any required gate is missing
      - Git Governance SoT, PostgreSQL operational plane boundary, and S3/R2 artifact boundary
    gap:
      - no durable standalone Promotion Receipt that binds source bytes/state, destination, exact target/version set, decision authority, and promotion outcome
    r3_required_contract:
      - promotion_id
      - source identity/hash/version set
      - destination store/namespace
      - exact approved target identity
      - Decision Receipt reference
      - actor and authority identities
      - promotion status and recorded time
      - fail-closed partial promotion semantics
    explicitly_deferred:
      - Saga platform
      - generic two-phase commit platform
      - distributed transaction framework

  A09_PROVIDER_NEUTRAL_RESTORE_CONTRACT:
    classification: EXTEND
    keep:
      - local PostgreSQL backup/restore drill
      - immutable Git governance history
      - artifact hash/locator discipline
      - provider separation between operational DB and immutable artifact storage
    gap:
      - managed provider restore/PITR qualification is not complete
      - no thin provider-neutral restore manifest defining the minimum identities and verification outcomes independent of provider
    r3_required_contract:
      - backup or snapshot identity
      - schema/migration version set
      - restore target identity
      - immutable artifact references
      - verification checks
      - RPO/RTO/PITR policy references when applicable
    explicitly_deferred:
      - automated disaster-recovery orchestration
      - provider-specific implementation freeze

  A10_ACTOR_NOT_AUTHORITY_SEMANTIC_BOUNDARY:
    classification: REFACTOR
    keep:
      - Persona != Worker != Channel != Model
      - Work Order approval identity fields
      - Owner authority boundaries
      - dual-core authority matrix and Shared Contract reconciliation rule
    current_conflation:
      - aaa_ops.run_events exposes actor_identity without a structural authority/decision reference
      - operational action identity can therefore be recorded without a typed statement of whose authority permits the action
    r3_required_contract:
      - actor_identity
      - actor_type
      - authority_identity_or_role
      - authority_source_or_decision_ref
      - permission/scope where material
      - authority-bearing approvals require exact target binding
    hard_rule:
      - ACTOR_IDENTITY != AUTHORITY_IDENTITY
      - possession of execution capability does not grant governance authority

  A11_COMMAND_WORKFLOW_BOUNDARY:
    classification: KEEP
    keep:
      - Work Order cannot supply arbitrary shell/command/entrypoint/script
      - code-owned allowlisted Execution Profile
      - shell=False
      - exact target checked before ACK/start/command
      - bounded profile timeout and permission/persona/capability enforcement
    r3_concept_freeze_only:
      - Work Order selects a governed execution profile/workflow identity rather than injecting arbitrary execution code
      - future multi-step workflows must preserve code-owned/approved executable boundaries
    explicitly_deferred:
      - workflow DSL
      - generic workflow engine
      - arbitrary user-authored command graph

  A12_EVENT_READY_OPERATIONAL_HISTORY:
    classification: REFACTOR
    keep:
      - append-only aaa_ops.run_events
      - event payload SHA256
      - idempotency and per-Run sequence guards
      - economic EVENT schema event_id versus event_record_id revision/supersession semantics
      - periodic observations are not forced into economic Event
    current_gap:
      - AAA operational event_id and idempotency_key are globally unique without an explicit namespace contract
      - operational event_type is free text
      - operational event only records actor_identity, not typed authority
      - no generic causality/correlation minimum is defined
      - P08 control state carries a named continuity event-ID collision blocker
    r3_required_contract:
      - operational event namespace and identity scope
      - event family/type/version semantics
      - actor plus authority reference
      - causation/correlation identifiers only where needed for deterministic lineage
      - idempotency scope
      - collision fail-closed rule
      - relation, if any, between AAA operational events and economic EVENT records without conflating them
    explicitly_not_event_sourcing:
      - AAA operational history may be event-ready without making events the sole reconstructive source of all state
      - CQRS/event-sourcing framework is not authorized

cross_cutting_delta:
  EXACT_TARGET_DECISION_RECEIPT:
    classification: EXTEND
    priority: P0_SEMANTIC_FREEZE_CANDIDATE
    rationale: Approval of target X must never be interpreted as approval of target Y.
    r3_minimum_fields:
      - decision_id
      - decision_type
      - target_kind
      - exact_target_identity
      - authority_identity_or_role
      - actor_identity_if_different
      - decision
      - decided_at
      - supersedes_or_revokes_reference_if_applicable
    applies_at_minimum_to:
      - ARCHITECTURE_EXACT_FREEZE
      - RELEASE
      - CANONICAL_PROMOTION
      - POSTGRESQL_OPERATIONAL_SOT_CUTOVER
      - LIVE_EXECUTION_ENABLEMENT
      - CONTROLLED_CUTOVER

  PARTIAL_CHECKPOINT_BOUNDARY:
    classification: EXTEND
    freeze_level: CONCEPT_ONLY
    keep:
      - terminal Run requires persistent terminal Result
    r3_rule:
      - partial/checkpoint artifacts cannot satisfy terminal Result or terminal success
      - incomplete 350_of_400 style progress cannot be represented as completed PASS
    explicitly_deferred:
      - generic resumable-checkpoint framework
      - generic partial-result aggregation framework

  COMPATIBLE_VERSION_SET_RELEASE_MANIFEST:
    classification: EXTEND
    freeze_level: CONCEPT_ONLY
    r3_rule:
      - a release/canonical promotion identifies the compatible set of material schema/model/config/runtime/data identities rather than only a floating latest version
    explicitly_deferred:
      - generic package manager or dependency solver

  CANCELLATION_TIMEOUT_RESULT_REASON:
    classification: REFACTOR
    freeze_level: CONCEPT_ONLY
    r3_rule:
      - distinguish cancellation, timeout, infrastructure fault, stale authority, application/model failure, and validation finding
      - none may be silently converted to success

  P09_T17_PENDING_INDEPENDENT_RERUN:
    classification: KEEP
    disposition: PRESERVE_PENDING_SEPARATE_GOVERNED_DISPOSITION
    current_run: RUN-VALIDATION-AAA-INDEPENDENT-PREFLIGHT-20260816-002
    current_state: DISPATCHED_AWAITING_ACK
    architecture_revision_dependency: NOT_AUTOMATICALLY_REQUIRED_FOR_R3_DESIGN
    rule: Do not fabricate PASS/FAIL, do not rewrite historical target, and do not silently discard the pending governed Run.

  T18_PENDING_INDEPENDENT_VALIDATION:
    classification: KEEP
    disposition: PRESERVE_PENDING_SEPARATE_GOVERNED_DISPOSITION
    current_run: RUN-VALIDATION-AAA-T18-INDEPENDENT-20260816-001
    current_state: DISPATCHED_AWAITING_ACK
    architecture_revision_dependency: NOT_AUTOMATICALLY_REQUIRED_FOR_R3_DESIGN
    rule: Existing T18 implementation remains an architecture anchor; later successor validation/cutover disposition must be explicit.

