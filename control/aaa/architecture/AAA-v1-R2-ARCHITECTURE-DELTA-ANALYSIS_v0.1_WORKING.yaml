purpose: >-
  Classify the exact R1-observed AAA baseline against the Owner-approved BALANCED_V1 architecture direction as KEEP, EXTEND, REFACTOR, or DEFER without mutating implementation, schema, migration, API, CLI, historical Runs/Results/Findings, or Shared Contract. This artifact is an architecture-delta decision input for R3 Exact Contract Design only; it is not Exact Freeze or implementation authorization.

