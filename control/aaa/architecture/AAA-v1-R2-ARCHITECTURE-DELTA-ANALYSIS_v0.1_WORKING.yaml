  control_only_successors_must_not_move_r1_observed_baseline: true

classification_semantics:
  KEEP: Existing semantic and implementation anchor is fit for Balanced v1; preserve it, allowing only wording/interface alignment that does not change its core contract.
  EXTEND: Existing anchor is sound but missing a minimum semantic field, receipt, identity, compatibility, or provenance layer required for Balanced v1.
  REFACTOR: Current semantic boundary conflates concepts or places responsibility at the wrong object/cardinality; successor semantics must be redesigned while historical meaning remains preserved.
  DEFER: Do not freeze or build the detailed implementation in Balanced v1; preserve an explicit extension point or concept boundary only.
  primary_classification_rule: Each A-item receives one primary classification. Retained anchors and deferred detail are recorded separately rather than using ambiguous multi-class labels.

