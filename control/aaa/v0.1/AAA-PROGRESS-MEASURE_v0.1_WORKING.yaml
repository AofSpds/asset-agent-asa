measure_id: AAA-PROGRESS-MEASURE
version: v0.1_WORKING
project: Asset Agent ASA
short_name: AAA
status: WORKING_MEASUREMENT_ONLY_NOT_RELEASE_GATE
measurement_rule:
  purpose: Provide owner-visible progress without confusing engineering completion with canonical cutover readiness.
  dimensions:
    - ENGINEERING_USABLE_MVP
    - FULL_CONTROLLED_CUTOVER_PROGRAM
  percent_is_planning_estimate_not_validation_verdict: true
engineering_usable_mvp:
  current_percent: 64
  completed:
    - NAMING_AND_REPOSITORY_REBIND
    - GAP_BUILD_CONTRACT_MATRIX
    - AAA_WORK_RUN_RESULT_CONTRACT_FOUNDATION
    - DETERMINISTIC_IDENTITY_STATE_CORE
    - READ_ONLY_CLI_HTTP_API
    - LIVE_OWNER_CONSOLE
    - PROVIDER_NEUTRAL_GATEWAY_SKELETON
    - LEVEL_0_TO_2_AGENT_PERMISSION_HARNESS
    - STORAGE_IDENTITY_AND_PROMOTION_GUARDS
    - SHADOW_ANCHOR_DISCREPANCY_ENGINE
    - ENGINEERING_CI_AND_UI_BUILD
  remaining_major:
    - FRONTEND_DEPENDENCY_LOCK
    - LEDGER_LINEAGE_AWARE_SHADOW_REPLAY
    - AGENT_RUNTIME_MATURATION
    - NATURAL_LANGUAGE_AND_REAL_PROVIDER_ADAPTERS
    - RECOVERY_ADVERSARIAL_HARDENING
full_controlled_cutover_program:
  current_percent: 43
  remaining_major:
    - COMPLETE_BUILD_HARDENING
    - ACTUAL_SHADOW_OPERATION_CYCLE
    - SHADOW_COMPARE_AND_NO_DATA_LOSS_EVIDENCE
    - RECOVERY_DRILL
    - PROVIDER_SWAP_AND_LLM_OFF_ADVERSARIAL_VALIDATION
    - INDEPENDENT_VALIDATION
    - OWNER_CONTROLLED_CUTOVER
exclusions:
  - M3TOP3_EXTERNAL_P0_FIX_PROGRESS_IS_NOT_COUNTED_AS_AAA_ENGINEERING_COMPLETION
  - PERCENT_DOES_NOT_AUTHORIZE_REPLAY_FREEZE_RELEASE_OR_CANONICAL_CUTOVER
