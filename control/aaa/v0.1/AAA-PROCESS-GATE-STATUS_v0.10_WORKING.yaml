status_semantics:
  CLOSED: Exit criteria satisfied and evidence bound.
  READY_NOT_DISPATCHED: Work definition exists but no execution Run has been dispatched.
  DISPATCHED_AWAITING_ACK: Work handed to an executor but start evidence not yet recorded.
  OPEN_ACTIVE: At least one RUNNING_CONFIRMED Run exists with start and heartbeat evidence.
  OPEN_BLOCKED: Named blocker prevents completion.
  STALE_UNKNOWN: Previously active Run lacks sufficient current evidence; never infer RUNNING.
  NOT_STARTED: Process has not materially started.

