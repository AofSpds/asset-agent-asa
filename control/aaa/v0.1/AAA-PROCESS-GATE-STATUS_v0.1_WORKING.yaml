control_id: AAA-PROCESS-GATE-STATUS
version: v0.2_WORKING
project: Asset Agent ASA
short_name: AAA
purpose: Make process completion and actual execution state explicit. A process is finished only when completion_gate is CLOSED.
status_semantics:
  CLOSED: Exit criteria satisfied and evidence bound. Process may be treated as finished for its defined scope.
  READY_NOT_DISPATCHED: Work definition exists but no execution Run has started. Process is not running and is not finished.
  DISPATCHED_AWAITING_ACK: Work has been handed to an executor but start evidence is not yet recorded.
  OPEN_ACTIVE: At least one RUNNING_CONFIRMED execution Run exists with start evidence. Process is not finished.
  OPEN_BLOCKED: Work cannot finish until one or more named blockers are resolved. Process is not finished.
  STALE_UNKNOWN: A previously active Run lacks sufficient current evidence; do not infer RUNNING.
  NOT_STARTED: Process has not materially started. Process is not finished.
measurement_note:
  percent_is_secondary: true
  completion_gate_is_authoritative_for_finished_question: true
  running_claim_requires_run_id_and_start_evidence: true
  terminal_claim_requires_persistent_terminal_result_artifact: true
  engineering_completion_does_not_equal_independent_validation: true
  independent_validation_does_not_equal_owner_cutover_authorization: true
