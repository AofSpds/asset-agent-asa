control_id: AAA-PROCESS-GATE-STATUS
version: v0.1_WORKING
project: Asset Agent ASA
short_name: AAA
purpose: Make process completion explicit. A process is finished only when completion_gate is CLOSED.
status_semantics:
  CLOSED: Exit criteria satisfied and evidence bound. Process may be treated as finished for its defined scope.
  OPEN_ACTIVE: Work is currently in progress. Process is not finished.
  OPEN_BLOCKED: Work cannot finish until one or more named blockers are resolved. Process is not finished.
  NOT_STARTED: Process has not materially started. Process is not finished.
