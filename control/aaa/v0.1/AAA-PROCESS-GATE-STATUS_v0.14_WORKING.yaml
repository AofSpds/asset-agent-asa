status_semantics:
  CLOSED: Exit criteria satisfied and evidence bound.
  READY_NOT_DISPATCHED: Work definition exists but no execution/reconciliation acknowledgement has been recorded.
  DISPATCHED_AWAITING_ACK: Work handed to an executor/reconciler but start evidence not yet recorded.
  OPEN_ACTIVE: At least one governed active execution/reconciliation has sufficient current evidence.
  OPEN_BLOCKED: Named blocker prevents completion.
  STALE_UNKNOWN: Previously active work lacks sufficient current evidence; never infer active/running.
  NOT_STARTED: Process has not materially started.

