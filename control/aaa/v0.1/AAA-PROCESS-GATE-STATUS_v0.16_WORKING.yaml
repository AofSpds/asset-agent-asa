status_semantics:
  CLOSED: Exit criteria satisfied and evidence bound.
  READY_NOT_DISPATCHED: Work definition/candidate exists but no authority decision has been dispatched.
  DISPATCHED_AWAITING_ACK: Work handed to an executor/authority but start/position evidence is absent.
  OPEN_ACTIVE: Governed active work has sufficient current evidence.
  OPEN_BLOCKED: Named blocker prevents completion.
  STALE_UNKNOWN: Previously active execution lacks sufficient current evidence; never infer running.
  NOT_STARTED: Process has not materially started.

