      KRX block-trading rules permit negotiated-price block/off-hours block transactions,
      with a KRW50 million minimum and off-hours windows 08:00-09:00 and 15:40-18:00.
      Raw Amount KRW79.2 million exceeds that threshold, making the row structurally
      compatible with KONEX block/off-hours semantics.
