    severity: ERROR_BEFORE_PROMOTION
    issue: >-
      84,111 rows violate the naive PRICE-CANONICAL OHLC inequality High>=Close
      because raw provider rows contain zero Open/High/Low with positive Close.
    required_resolution: >-
      Establish evidence-backed provider semantics and an approved deterministic
      treatment for non-trading/carry-close style rows; separately adjudicate the
      four zero-OHL rows with nonzero Volume/Amount. Do not infer trading_status from
      zeros without explicit control approval.
  - id: PRICE-DRYRUN-IDENTITY-002
    severity: CONTROL_REFRESH
    issue: D3 executable identity/listing audit used Working v0.7 because v0.8 workbook bytes were not available in runtime.
    required_resolution: rerun D3 boundary checks against v0.8 or later workbook before promotion.

