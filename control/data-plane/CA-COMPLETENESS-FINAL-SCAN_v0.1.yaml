  dominant_pattern_semantics:
    raw_condition: Open=0 AND High=0 AND Low=0 AND Volume=0 AND Amount=0 AND Close>0
    result: >-
      Evidence-compatible with no regular-session execution, suspension, or maintained
      closing/base-price semantics. It is not a malformed traded OHLC bar solely because
      High<Close. The zero pattern alone is insufficient to infer a specific trading_status.
    trading_status_inference_from_zero_pattern_only: PROHIBITED
    silent_drop: PROHIBITED
