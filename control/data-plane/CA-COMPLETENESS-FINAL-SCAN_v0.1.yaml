four_exception_rows:
  - date: '2024-03-28'
    code: '001527'
    raw_name: 동양2우B
    close: 11480
    volume: 2
    amount: 23060
    implied_average_trade_price: 11530
    adjudication_status: PARTIAL_BLOCKER
    result: >-
      Non-regular/session-specific transaction is plausible, but the exact KRX transaction
      session/print locator for 2024-03-28 was not resolved. Do not classify the row as CA,
      invalid, or a specific trading_status without that locator.
    corporate_action_relation: NOT_ESTABLISHED
  - date: '2024-12-30'
    code: '076340'
    raw_name: 관악산업
    close: 5590
    volume: 35536
    amount: 177680000
    implied_average_trade_price: 5000
    adjudication_status: VERIFIED
    result: >-
      Exact issuer/KIND major-holder record identifies 35,536 shares on 2024-12-30 as
      시간외매매 at unit price 5,000; 35,536 x 5,000 equals the raw Amount exactly.
      Therefore the row represents off-hours transaction metrics rather than a regular
      OHLC bar or a corporate action.
    evidence:
      - source: KRX_KIND
        source_id: '20250106000440'
        publication_date: '2025-01-06'
        locator: https://kind.krx.co.kr/external/2025/01/06/000144/20250106000440/00636.htm
    corporate_action_relation: NONE
  - date: '2025-03-21'
    code: '145210'
    raw_name: 다이나믹디자인
    close: 1126
    volume: 1015
    amount: 1142890
    implied_average_trade_price: 1126
    adjudication_status: VERIFIED_COMPOSED
    result: >-
      KRX suspended the issue at 08:58 on 2025-03-21. KRX market rules allow pre-open
      off-hours closing-price transactions before the 09:00 regular session. Raw Amount
      equals 1,015 x 1,126 exactly. With regular-session execution prevented by the 08:58
      halt, the observed transaction metrics are deterministically consistent with
      pre-open/off-hours carried-close execution, not a corporate action.
    evidence:
      - source: KRX_KIND
        source_id: '20250321000242'
        publication_date: '2025-03-21'
        locator: https://kind.krx.co.kr/external/2025/03/21/000060/20250321000242/99810.htm
      - source: KRX_GLOBAL_MARKET_RULES
        locator: https://global.krx.co.kr/contents/GLB/06/0602/0602010203/GLB0602010203T1.jsp
    corporate_action_relation: NONE
  - date: '2026-05-08'
    code: '403360'
    raw_name: 라피치
    close: 6900
    volume: 11000
    amount: 79200000
    implied_average_trade_price: 7200
    adjudication_status: PARTIAL_BLOCKER
    result: >-
      KONEX permits block/off-hours executions even where a regular-session trade is absent,
      and the row is compatible with that source/session structure. However an exact KRX
      2026-05-08 transaction/session locator matching 11,000 shares at the implied 7,200
      price was not resolved. No evidence-backed CA explanation for this row was found.
    corporate_action_relation: NOT_ESTABLISHED_AS_CA

